# A page type of its own rather than another `contentPage`: the layout is a form
# beside an address panel, which is a different thing from prose with a picture,
# and branching one template on which properties happen to be filled is how a
# view becomes unreadable.
[content-type]
alias = "contactPage"
name = "Contact Page"
description = "A form and the details beside it"
icon = "icon-message"
components = ["pages/contactPage"]
default-component = "pages/contactPage"

[[tab]]
name = "Header"

[[tab.property]]
alias = "eyebrow"
name = "Eyebrow"
type = "textstring"
site-search = "low"

[[tab.property]]
alias = "title"
name = "Title"
type = "textstring"
mandatory = true
site-search = "high"

[[tab.property]]
alias = "standfirst"
name = "Standfirst"
type = "textarea"

[[tab]]
name = "Form"

# `formPicker` is seeded with the other built-in data types, so a property can
# use it with no file of its own. The value is a form's UUID from
# `schema/forms/`, and the value converter hands the view the definition rather
# than the key — see `web/components/contact-page.tsx`.
[[tab.property]]
alias = "enquiryForm"
name = "Form"
description = "Leave empty for a page that only gives the address."
type = "formPicker"

[[tab]]
name = "Details"

[[tab.property]]
alias = "asideEyebrow"
name = "Eyebrow"
type = "textstring"

[[tab.property]]
alias = "asideHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "asideBody"
name = "Address and contact"
type = "richtext"

[[tab.property]]
alias = "asideImage"
name = "Image"
type = "imageMediaPicker"
