# An element type: content with no URL of its own, created in the Library and
# pointed at from a page. `is-element` makes it one; `allow-in-library` is what
# puts it in the Library's Create dialog, and Umbraco requires both.
[content-type]
alias = "tastingNote"
name = "Tasting Note"
description = "Nose, palate or finish, reusable across bottlings"
icon = "icon-coffee"
is-element = true
allow-in-library = true

[[property]]
alias = "aspect"
name = "Aspect"
description = "Nose, Palate or Finish"
type = "textstring"
mandatory = true

[[property]]
alias = "note"
name = "Note"
type = "textarea"
mandatory = true
