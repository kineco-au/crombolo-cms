# A second element type, and the point of it is reuse: the home page holds four
# of these as blocks, the figures beside the house style, and the About page four
# more, the decisions that set it. Same type, two content types, no second shape
# to maintain. Each block renders through `web/components/highlights.tsx`.
[content-type]
alias = "highlight"
name = "Highlight"
description = "A short heading and a line under it, reusable across pages"
icon = "icon-list"
is-element = true

[[property]]
alias = "heading"
name = "Heading"
description = "A year, a number, or a single word"
type = "textstring"
mandatory = true

[[property]]
alias = "detail"
name = "Detail"
type = "textarea"
mandatory = true
