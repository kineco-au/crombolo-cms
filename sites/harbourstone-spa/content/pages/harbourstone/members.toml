bodyText = { html = "<p>Cask 214 is a refill sherry butt filled in the winter of 2009, and it is close. Cask 87 is a first-fill bourbon barrel from the year the warehouse roof came off in a storm, and it tastes of it.</p><p>When either is ready, members hear first, and may ask for a bottle before the rest of the outturn goes to the shop.</p>" }
