[content-type]
alias = "contentPage"
name = "Content Page"
description = "A page with a main column and a sidebar"
icon = "icon-document"
allow-at-root = true
allow-children = ["contentPage", "searchPage"]
compositions = ["seoFields"]
components = ["pages/contentPage"]
default-component = "pages/contentPage"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true
site-search = "high"

[[tab.property]]
alias = "intro"
name = "Introduction"
description = "A sentence or two under the heading"
type = "textarea"

[[tab.property]]
alias = "bodyText"
name = "Body"
type = "richtext"

[[tab]]
name = "Sidebar"

[[tab.property]]
alias = "sidebarHeading"
name = "Heading"
type = "textstring"
site-search = "low"

[[tab.property]]
alias = "sidebarText"
name = "Text"
description = "Leave empty for a single-column page"
type = "richtext"
site-search = "low"
