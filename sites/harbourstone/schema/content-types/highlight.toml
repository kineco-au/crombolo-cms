# A second element type, and the point of it is reuse: the home page picks four
# of these as the figures beside the house style, and the About page picks four
# more as the decisions that set it. Same type, two content types, no second
# shape to maintain.
[content-type]
alias = "highlight"
name = "Highlight"
description = "A short heading and a line under it, reusable across pages"
icon = "icon-list"
is-element = true
allow-in-library = true

[[property]]
alias = "heading"
name = "Heading"
description = "A year, a number, or a single word"
type = "textstring"
mandatory = true

[[property]]
alias = "detail"
name = "Detail"
type = "textarea"
mandatory = true
