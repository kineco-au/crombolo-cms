[content-type]
alias = "searchPage"
name = "Search Page"
description = "Lists the pages matching what a visitor searched for"
icon = "icon-search"
components = ["pages/searchPage"]
default-component = "pages/searchPage"
site-search = false

[[tab]]
name = "Header"

[[tab.property]]
alias = "eyebrow"
name = "Eyebrow"
description = "The small line above the heading"
type = "textstring"

[[tab.property]]
alias = "title"
name = "Title"
type = "textstring"
mandatory = true

[[tab.property]]
alias = "standfirst"
name = "Standfirst"
description = "A sentence under the heading, shown before anyone has searched"
type = "textarea"
