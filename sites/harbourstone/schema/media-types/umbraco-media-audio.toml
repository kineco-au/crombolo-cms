[media-type]
alias = "umbracoMediaAudio"
name = "Audio"
icon = "icon-audio-lines"
allow-at-root = true

[[group]]
name = "Audio"
alias = "audio"

[[group.property]]
alias = "umbracoFile"
name = "Audio"
type = "uploadAudio"
mandatory = true

[[group.property]]
alias = "umbracoExtension"
name = "File extension"
type = "label"

[[group.property]]
alias = "umbracoBytes"
name = "File size"
type = "labelBytes"
