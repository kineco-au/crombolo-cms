title = "The forecast that learned from forty years of weather"
standfirst = "An AI model called GenCast beat the world's leading weather forecast on almost every measure it was tested on, and it runs in minutes rather than hours."
byline = "Plain Signal staff"
publishedOn = 2024-12-05
heroImage = "/hurricane-florence-from-the-iss.jpg"
