[content-type]
alias = "docsSection"
name = "Docs Section"
description = "The front page of the documentation, listing what is in it"
icon = "icon-book-alt"
allow-children = ["docsPage", "searchPage"]
compositions = ["seoFields"]
components = ["pages/docsSection"]
default-component = "pages/docsSection"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true

[[tab.property]]
alias = "standfirst"
name = "Standfirst"
description = "A paragraph under the title"
type = "textarea"

[[tab.property]]
alias = "body"
name = "Body"
description = "Shown above the list of pages"
type = "richtext"
