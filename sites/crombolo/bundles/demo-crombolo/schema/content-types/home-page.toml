[content-type]
alias = "homePage"
name = "Home Page"
description = "The landing page, written for the people who choose a CMS"
icon = "icon-home"
allow-at-root = true
allow-children = ["developerPage", "docsSection"]
compositions = ["seoFields"]
components = ["pages/homePage"]
default-component = "pages/homePage"

[[tab]]
name = "Hero"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true

[[tab.property]]
alias = "strapline"
name = "Strapline"
description = "A sentence or two under the heading"
type = "textarea"

[[tab.property]]
alias = "heroCtaLabel"
name = "Button"
description = "Jumps to the closing call to action. Leave empty for no button."
type = "textstring"

[[tab]]
name = "Why switch"

[[tab.property]]
alias = "whyHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "whyIntro"
name = "Introduction"
type = "textarea"

[[tab.property]]
alias = "reasons"
name = "Reasons"
description = "Picked from the Library; shown as cards"
type = "featurePicker"

[[tab]]
name = "Editors"

[[tab.property]]
alias = "editorsHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "editorsIntro"
name = "Introduction"
type = "textarea"

[[tab.property]]
alias = "editorFeatures"
name = "Features"
description = "Picked from the Library; shown as a checklist"
type = "featurePicker"

[[tab.property]]
alias = "migrateHeading"
name = "Migration heading"
description = "The panel beside the checklist. Leave empty for no panel."
type = "textstring"

[[tab.property]]
alias = "migrateBody"
name = "Migration text"
type = "richtext"

[[tab]]
name = "Developers"

[[tab.property]]
alias = "developersHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "developersIntro"
name = "Introduction"
type = "textarea"

[[tab.property]]
alias = "developersCtaLabel"
name = "Button"
description = "Links to the developer page. Leave empty for no button."
type = "textstring"

[[tab]]
name = "Get started"

[[tab.property]]
alias = "closingHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "closingBody"
name = "Text"
type = "textarea"

[[tab]]
name = "Site"

[[tab.property]]
alias = "repositoryUrl"
name = "Source code link"
description = "Where the GitHub links in the header and on every page point"
type = "textstring"

[[tab.property]]
alias = "installCommand"
name = "Install command"
description = "The one command shown in the closing call to action"
type = "textstring"
