[content-type]
alias = "step"
name = "Step"
description = "One step in a set of instructions, with an optional command to run"
icon = "icon-terminal"
is-element = true
allow-in-library = true

[[property]]
alias = "heading"
name = "Heading"
type = "textstring"
mandatory = true

[[property]]
alias = "detail"
name = "Detail"
type = "textarea"

[[property]]
alias = "command"
name = "Command"
description = "Shown as code, ready to copy. Leave empty for a step with nothing to run."
type = "textarea"
