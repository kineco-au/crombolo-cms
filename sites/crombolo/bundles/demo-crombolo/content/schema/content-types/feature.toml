# Reused across both pages: the reasons to switch, the editor checklist and the
# developer toolkit are all a heading and a line under it.
[content-type]
alias = "feature"
name = "Feature"
description = "A short heading and a sentence or two under it"
icon = "icon-check"
is-element = true
allow-in-library = true

[[property]]
alias = "heading"
name = "Heading"
type = "textstring"
mandatory = true

[[property]]
alias = "detail"
name = "Detail"
type = "textarea"
