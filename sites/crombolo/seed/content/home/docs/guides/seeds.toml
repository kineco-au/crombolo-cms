title = "Seed files"
standfirst = "Write a site's starting pages, Library elements and media as files, and apply them from the command line."
body = { html = "<p>A seed is a site&#39;s starting content kept in the repository: pages, Library elements and media, written as small TOML files. <code>crombolo seed apply</code> turns them into content. A fresh clone plus one command is a populated site, and content that belongs with the code, such as legal pages or a docs section, is reviewed like the code is.</p>\n<p>The back office is still where content is edited. A seed is where it is declared.</p>\n<h2 id=\"a-page\">A page</h2>\n<p>Each page is a file named for its URL segment, under <code>seed/content/</code>. Its children go in a folder of the same name:</p>\n<pre><code>seed/content/home.toml\nseed/content/home/about.toml\n</code></pre>\n<pre><code class=\"language-toml\">type = &quot;page&quot;\nname = &quot;Home&quot;\n\n[values]\ntitle = &quot;Welcome&quot;\nbody = &quot;Read [about us](/home/about).&quot;\n</code></pre>\n<p><code>type</code> is the content type. <code>name</code> is optional and comes from the file name otherwise. <code>order</code> sorts siblings, and <code>published = false</code> keeps a page a draft.</p>\n<h2 id=\"values\">Values</h2>\n<p>Give each value by its property alias, in the form it reads most naturally:</p>\n<ul>\n<li><strong>Rich text:</strong> Markdown. Links to <code>/paths</code> in the seed become links to those pages.</li>\n<li><strong>Content pickers:</strong> a path such as <code>/home/about</code>.</li>\n<li><strong>Media pickers:</strong> a path under <code>seed/media/</code>.</li>\n<li><strong>Element pickers:</strong> a path under <code>seed/library/</code>.</li>\n<li><strong>Blocks:</strong> <code>[{ type = &quot;card&quot;, values = { heading = &quot;One&quot; } }]</code>.</li>\n<li><strong>Tags, dates, numbers and toggles:</strong> as TOML writes them.</li>\n</ul>\n<p>For another culture, add a <code>[values.fr-FR]</code> table and give <code>name</code> per culture.</p>\n<h2 id=\"media\">Media</h2>\n<p>Put the files under <code>seed/media/</code>, in the folders they should sit in. Each file becomes a media item of the type its extension implies. A sidecar file beside it, <code>photo.jpg.toml</code>, can give its name and focal point.</p>\n<h2 id=\"commands\">Commands</h2>\n<pre><code class=\"language-bash\">crombolo seed check            # every problem, with its file and line\ncrombolo seed apply --dry-run  # what applying would change\ncrombolo seed apply --publish  # apply it, and publish it\ncrombolo seed export --all     # seed files from everything already in a site\ncrombolo start --seed          # apply it before serving, once for each change\n</code></pre>\n<h2 id=\"applying-again\">Applying again</h2>\n<p>Applying an unchanged seed changes nothing. Change a file and apply again, and that change is taken.</p>\n<p>An edit made in the back office since the last apply is kept, not overwritten. Only when the same thing changed in both places does <code>seed apply</code> stop and ask, and <code>--resolve</code> answers it.</p>\n<p>Every apply is a run that <code>crombolo content revert &lt;run&gt;</code> undoes.</p>\n<h2 id=\"a-whole-site-as-one-bundle\">A whole site as one bundle</h2>\n<p><code>crombolo bundle build</code> turns a site directory into a bundle carrying its schema, views, styles and seed. A bare site becomes that site with <code>start --bundle</code>. This is how the demos start:</p>\n<pre><code class=\"language-bash\">crombolo init --name &quot;Harbourstone&quot;\ncrombolo bundle build --template demo/harbourstone --out ./harbourstone-bundle\ncrombolo start --bundle ./harbourstone-bundle --publish\n</code></pre>" }
