[content-type]
alias = "docsPage"
name = "Docs Page"
description = "A page of the documentation, with the section's contents beside it"
icon = "icon-document"
allow-children = ["docsPage"]
compositions = ["seoFields"]
components = ["pages/docsPage"]
default-component = "pages/docsPage"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true

[[tab.property]]
alias = "standfirst"
name = "Summary"
description = "A sentence under the title, also shown in the contents"
type = "textarea"

[[tab.property]]
alias = "body"
name = "Body"
description = "Second-level headings are listed as the page's own contents"
type = "richtext"

[[tab]]
name = "Source"

[[tab.property]]
alias = "generatedFrom"
name = "Generated from"
description = "Set when the page is written from the product itself, such as the command line; shown at the foot of the page"
type = "textstring"

[[tab.property]]
alias = "editUrl"
name = "Edit link"
description = "Where to suggest a change to this page; shown at the foot of the page"
type = "textstring"

[[tab]]
name = "Address"

[[tab.property]]
alias = "umbracoUrlName"
name = "Address"
description = "The last part of the page's address; taken from its name when empty"
type = "textstring"
