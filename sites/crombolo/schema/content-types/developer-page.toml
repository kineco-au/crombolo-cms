[content-type]
alias = "developerPage"
name = "Developer Page"
description = "What developers get, with a code sample and getting-started steps"
icon = "icon-code"
compositions = ["seoFields"]
components = ["pages/developerPage"]
default-component = "pages/developerPage"
allow-children = ["developerPage"]

[[tab]]
name = "Header"

[[tab.property]]
alias = "eyebrow"
name = "Eyebrow"
description = "The small line above the heading"
type = "textstring"

[[tab.property]]
alias = "title"
name = "Title"
type = "textstring"
mandatory = true

[[tab.property]]
alias = "standfirst"
name = "Standfirst"
description = "A paragraph under the title"
type = "textarea"

[[tab]]
name = "Templates"

[[tab.property]]
alias = "codeHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "codeIntro"
name = "Introduction"
type = "textarea"

[[tab.property]]
alias = "codeSample"
name = "Code sample"
description = "Shown exactly as typed, in a code block"
type = "textarea"

[[tab]]
name = "Toolkit"

[[tab.property]]
alias = "toolkitHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "toolkit"
name = "Features"
description = "Picked from the Library; shown as a grid"
type = "featurePicker"

[[tab]]
name = "Getting started"

[[tab.property]]
alias = "stepsHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
alias = "steps"
name = "Steps"
description = "Picked from the Library; numbered in the order picked"
type = "stepPicker"

[[tab.property]]
alias = "nextSteps"
name = "After the steps"
type = "richtext"

[[tab]]
name = "Redirect"

[[tab.property]]
alias = "umbracoRedirect"
name = "Send visitors to"
description = "When set, visitors who open this page are taken to the chosen page instead"
type = "contentPicker"
