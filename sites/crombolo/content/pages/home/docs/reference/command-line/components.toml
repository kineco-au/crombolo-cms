title = "Components and assets"
standfirst = "Create and check the templates under components/, and the styles and scripts beside them."
body = { html = "<h2 id=\"components-check\"><code>crombolo components check</code></h2>\n<p>Compile every component, and report one a type declares with no file. Changes nothing.</p>\n<pre><code>crombolo components check</code></pre>\n<h2 id=\"components-list\"><code>crombolo components list</code></h2>\n<p>What is in components/, and which type declares each. Changes nothing.</p>\n<pre><code>crombolo components list</code></pre>\n<h2 id=\"components-new\"><code>crombolo components new</code></h2>\n<p>Components/&lt;alias&gt;.tsx; the alias may carry folders. Each run acts again.</p>\n<pre><code>crombolo components new [&lt;alias&gt;] [--block &lt;block&gt;] [--folder]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The component's alias.</td></tr><tr><td><code>--block</code></td><td>An element type's block component: components/blocks/&lt;alias&gt;.tsx.</td></tr><tr><td><code>--folder</code></td><td>Components/&lt;alias&gt;/page.tsx, so the page's own parts can sit beside it.</td></tr></tbody></table>\n<h2 id=\"assets-list\"><code>crombolo assets list</code></h2>\n<p>The stylesheets and scripts this site has. Changes nothing.</p>\n<pre><code>crombolo assets list</code></pre>\n<h2 id=\"assets-new\"><code>crombolo assets new</code></h2>\n<p>Write an empty stylesheet or script in the place the backoffice edits. Each run acts again.</p>\n<pre><code>crombolo assets new &lt;kind&gt; &lt;name&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>kind</code></td><td>Which kind. One of <code>stylesheet</code>, <code>script</code>. Required.</td></tr><tr><td><code>name</code></td><td>Its file name. Required.</td></tr></tbody></table>" }
generatedFrom = "the command line’s own description of its commands"
