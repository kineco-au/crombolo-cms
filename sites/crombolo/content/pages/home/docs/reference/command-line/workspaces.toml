title = "Workspaces and changes"
standfirst = "Open a workspace, change it, check it, and push and merge it as one change; list the changes a site holds, and revert one."
body = { html = "<h2 id=\"workspace-address\"><code>crombolo workspace address</code></h2>\n<p>Where a workspace’s site is looked at, as you. Each run acts again.</p>\n<pre><code>crombolo workspace address &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--path &lt;path&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--path</code></td><td>A page on it. Default <code>/</code>.</td></tr></tbody></table>\n<h2 id=\"workspace-check\"><code>crombolo workspace check</code></h2>\n<p>Every check before a merge: each changed page rendered, a sample per changed type and template, every file’s problems. Changes nothing.</p>\n<pre><code>crombolo workspace check &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--all]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--all</code></td><td>Render every affected page, not a sample.</td></tr></tbody></table>\n<h2 id=\"workspace-conflicts\"><code>crombolo workspace conflicts</code></h2>\n<p>Each conflict, by part: the base, mine and theirs, and the change that made theirs. Changes nothing.</p>\n<pre><code>crombolo workspace conflicts &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr></tbody></table>\n<h2 id=\"workspace-diff\"><code>crombolo workspace diff</code></h2>\n<p>How a workspace differs: from Shared (what a merge changes), from where it began, or from another environment. Changes nothing.</p>\n<pre><code>crombolo workspace diff &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--against &lt;against&gt;] [--to &lt;to&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--against</code></td><td>Shared, base, or an environment of the site --to names. Default <code>shared</code>.</td></tr><tr><td><code>--to</code></td><td>The profile of the site --against &lt;env&gt; is on.</td></tr></tbody></table>\n<h2 id=\"workspace-discard\"><code>crombolo workspace discard</code></h2>\n<p>Discard a workspace and everything in it. Each run acts again.</p>\n<pre><code>crombolo workspace discard &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--yes]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--yes</code></td><td>Discard it, rather than only saying what would go.</td></tr></tbody></table>\n<h2 id=\"workspace-errors\"><code>crombolo workspace errors</code></h2>\n<p>What a workspace’s renders logged: exceptions, crashes and timeouts. Changes nothing.</p>\n<pre><code>crombolo workspace errors &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--since &lt;since&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--since</code></td><td>Only those since this time.</td></tr></tbody></table>\n<h2 id=\"workspace-list\"><code>crombolo workspace list</code></h2>\n<p>The workspaces you may use there, newest first. Changes nothing.</p>\n<pre><code>crombolo workspace list [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--all]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--all</code></td><td>Every one, for an administrator.</td></tr></tbody></table>\n<h2 id=\"workspace-merge\"><code>crombolo workspace merge</code></h2>\n<p>Merge workspaces into Shared, all or none: a dry run says what it would do and runs the checks. Each run acts again.</p>\n<pre><code>crombolo workspace merge &lt;workspaces&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--dry-run] [--yes] [--accept-lossy &lt;accept-lossy&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspaces</code></td><td>One or more, by name or key, separated by commas. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--dry-run</code></td><td>Say what it would do, changing nothing.</td></tr><tr><td><code>--yes</code></td><td>Merge, rather than only saying what would.</td></tr><tr><td><code>--accept-lossy</code></td><td>A change that loses data, removes or renames, by its id or kind; repeatable.</td></tr></tbody></table>\n<h2 id=\"workspace-open\"><code>crombolo workspace open</code></h2>\n<p>Open a workspace, to change pages, types and files apart from Shared. Each run acts again.</p>\n<pre><code>crombolo workspace open &lt;name&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>name</code></td><td>What to call it. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr></tbody></table>\n<h2 id=\"workspace-pages\"><code>crombolo workspace pages</code></h2>\n<p>Each page a workspace affects: its address, whether it rendered, and how long it took. Changes nothing.</p>\n<pre><code>crombolo workspace pages &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--failing] [--all]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--failing</code></td><td>Only those that did not render.</td></tr><tr><td><code>--all</code></td><td>Every affected page, not a sample per type and template.</td></tr></tbody></table>\n<h2 id=\"workspace-pull\"><code>crombolo workspace pull</code></h2>\n<p>Bring changes from another site: those merged there that this site lacks, or one of its workspaces to work on here. Each run acts again.</p>\n<pre><code>crombolo workspace pull [&lt;workspace&gt;] [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] --from &lt;from&gt; [--from-env &lt;from-env&gt;] [--yes]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>A workspace there, by its name or key.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--from</code></td><td>The site it comes from, by its profile. Required.</td></tr><tr><td><code>--from-env</code></td><td>Its environment.</td></tr><tr><td><code>--yes</code></td><td>Bring it, rather than only saying what would come.</td></tr></tbody></table>\n<h2 id=\"workspace-push\"><code>crombolo workspace push</code></h2>\n<p>Send a workspace from here to a workspace on another site, where it is looked at and merged; it never merges. Each run acts again.</p>\n<pre><code>crombolo workspace push &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] --to &lt;to&gt; [--to-env &lt;to-env&gt;] [--yes]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--to</code></td><td>The site it goes to, by its profile. Required.</td></tr><tr><td><code>--to-env</code></td><td>Its environment.</td></tr><tr><td><code>--yes</code></td><td>Send it, rather than only saying what it holds.</td></tr></tbody></table>\n<h2 id=\"workspace-render\"><code>crombolo workspace render</code></h2>\n<p>One page of a workspace’s site: whether it rendered, and its error if not. Changes nothing.</p>\n<pre><code>crombolo workspace render &lt;workspace&gt; &lt;path&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--html]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>path</code></td><td>The page’s address on the site. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--html</code></td><td>Print the page too.</td></tr></tbody></table>\n<h2 id=\"workspace-resolve\"><code>crombolo workspace resolve</code></h2>\n<p>Settle one conflict: a page’s part by --mine or --theirs, a file by those or its merged text. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workspace resolve &lt;workspace&gt; &lt;item&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--mine] [--theirs] [--file &lt;file&gt;] [--value &lt;value&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>item</code></td><td>A page’s part as `conflicts` names it (&lt;key&gt;#&lt;part&gt;), or a file’s path. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--mine</code></td><td>Keep the workspace’s.</td></tr><tr><td><code>--theirs</code></td><td>Take Shared’s.</td></tr><tr><td><code>--file</code></td><td>A file’s merged text, from this file.</td></tr><tr><td><code>--value</code></td><td>A file’s merged text, given here.</td></tr></tbody></table>\n<h2 id=\"workspace-share\"><code>crombolo workspace share</code></h2>\n<p>Let people read and change a workspace, by their email. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workspace share &lt;workspace&gt; &lt;people&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>people</code></td><td>Their emails, separated by commas. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr></tbody></table>\n<h2 id=\"workspace-status\"><code>crombolo workspace status</code></h2>\n<p>What a workspace has changed, and whether it would merge now. Changes nothing.</p>\n<pre><code>crombolo workspace status &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr></tbody></table>\n<h2 id=\"workspace-sync\"><code>crombolo workspace sync</code></h2>\n<p>Bring Shared’s latest into a workspace: what merges is merged, the rest is a conflict. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workspace sync &lt;workspace&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr></tbody></table>\n<h2 id=\"workspace-unshare\"><code>crombolo workspace unshare</code></h2>\n<p>Take people out of a workspace, by their email. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workspace unshare &lt;workspace&gt; &lt;people&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workspace</code></td><td>The workspace, by its name or key. Required.</td></tr><tr><td><code>people</code></td><td>Their emails, separated by commas. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr></tbody></table>\n<h2 id=\"workspaces\"><code>crombolo workspaces</code></h2>\n<p>The workspaces open there, with what each holds. Changes nothing.</p>\n<pre><code>crombolo workspaces [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--all]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--all</code></td><td>Every one, for an administrator.</td></tr></tbody></table>\n<h2 id=\"changes\"><code>crombolo changes</code></h2>\n<p>The changes made there, newest first, or one of them with what it holds. Changes nothing.</p>\n<pre><code>crombolo changes [&lt;change&gt;] [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--take &lt;take&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>change</code></td><td>One change, by its id.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--take</code></td><td>How many. Default <code>20</code>.</td></tr></tbody></table>\n<h2 id=\"changes-stage\"><code>crombolo changes stage</code></h2>\n<p>Stage a site bundle, or a site's checkout, into a workspace there as a change, measured from its source's last merge. Each run acts again.</p>\n<pre><code>crombolo changes stage &lt;path&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] --into &lt;into&gt; --source &lt;source&gt; [--base &lt;base&gt;] [--prune] [--dry-run]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>path</code></td><td>A site bundle (.tgz or its folder), or a site's checkout. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--into</code></td><td>The workspace it goes into, by name or key; one by that name is opened if none is. Required.</td></tr><tr><td><code>--source</code></td><td>Where it comes from, as the site remembers it: its base is what was last merged from here. Required.</td></tr><tr><td><code>--base</code></td><td>What it is measured from the first time: now, or a change's key.</td></tr><tr><td><code>--prune</code></td><td>Delete what the base had and it lacks, each accepted by name at the merge.</td></tr><tr><td><code>--dry-run</code></td><td>Say what staging it would do, and stage nothing.</td></tr></tbody></table>\n<h2 id=\"revert\"><code>crombolo revert</code></h2>\n<p>Undo a change as a change of its own, or reopen its work as a workspace to carry on with. Each run acts again.</p>\n<pre><code>crombolo revert &lt;change&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;] [--include-private] [--to-workspace &lt;to-workspace&gt;] [--yes]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>change</code></td><td>The change, by its id. Required.</td></tr><tr><td><code>--profile</code></td><td>A hosted site, by its profile, rather than this folder’s.</td></tr><tr><td><code>--env</code></td><td>The hosted site’s environment, named whenever --profile is.</td></tr><tr><td><code>--include-private</code></td><td>An administrator: read a workspace you are not in, a person’s own included.</td></tr><tr><td><code>--to-workspace</code></td><td>Reopen its work in a workspace of this name.</td></tr><tr><td><code>--yes</code></td><td>Revert it, rather than only saying so.</td></tr></tbody></table>" }
generatedFrom = "the command line’s own description of its commands"
umbracoUrlName = "workspaces"
