title = "Remotes, pull and push"
standfirst = "Sign in to another environment, and move content and schema between them."
body = { html = "<h2 id=\"login\"><code>crombolo login</code></h2>\n<p>Sign in to a remote with a code you approve in its back office. Each run acts again.</p>\n<pre><code>crombolo login [&lt;remote&gt;] [--no-browser]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr><tr><td><code>--no-browser</code></td><td>Don't open the approval page.</td></tr></tbody></table>\n<h2 id=\"logout\"><code>crombolo logout</code></h2>\n<p>Sign out of a remote, here and at the remote. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo logout [&lt;remote&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr></tbody></table>\n<h2 id=\"whoami\"><code>crombolo whoami</code></h2>\n<p>Who you are signed in as at a remote, and what you may do there. Changes nothing.</p>\n<pre><code>crombolo whoami [&lt;remote&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr></tbody></table>\n<h2 id=\"remote-add\"><code>crombolo remote add</code></h2>\n<p>A remote this site pulls from and pushes to, kept in remotes.toml. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo remote add &lt;name&gt; &lt;url&gt; [--env &lt;env&gt;] [--force]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>name</code></td><td>A name for it: lower case letters, digits and dashes. Required.</td></tr><tr><td><code>url</code></td><td>The site's URL. Required.</td></tr><tr><td><code>--env</code></td><td>The environment it goes to by default.</td></tr><tr><td><code>--force</code></td><td>Replace a remote of the same name.</td></tr></tbody></table>\n<h2 id=\"remote-job\"><code>crombolo remote job</code></h2>\n<p>Watch a pull or push job again, after a wait gave up. Changes nothing.</p>\n<pre><code>crombolo remote job &lt;id&gt; [&lt;remote&gt;] [--timeout &lt;timeout&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>id</code></td><td>The job id the wait printed. Required.</td></tr><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr><tr><td><code>--timeout</code></td><td>Seconds to wait before giving up. Default <code>1800</code>.</td></tr></tbody></table>\n<h2 id=\"remote-list\"><code>crombolo remote list</code></h2>\n<p>The remotes in remotes.toml, and whether you are signed in to each. Changes nothing.</p>\n<pre><code>crombolo remote list</code></pre>\n<h2 id=\"remote-remove\"><code>crombolo remote remove</code></h2>\n<p>Forget a remote; removing one that is not there changes nothing. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo remote remove &lt;name&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>name</code></td><td>The remote's name. Required.</td></tr></tbody></table>\n<h2 id=\"remote-trust-add\"><code>crombolo remote trust add</code></h2>\n<p>Trust a CI job: its repository and branch, tag or environment, and what it may do. Each run acts again.</p>\n<pre><code>crombolo remote trust add [&lt;remote&gt;] --name &lt;name&gt; --provider &lt;provider&gt; --repository &lt;repository&gt; [--branch &lt;branch&gt;] [--tag &lt;tag&gt;] [--environment &lt;environment&gt;] --may &lt;may&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr><tr><td><code>--name</code></td><td>What to call the rule. Required.</td></tr><tr><td><code>--provider</code></td><td>`github`, `gitlab`, or a self-managed GitLab the site names. Required.</td></tr><tr><td><code>--repository</code></td><td>Owner/name, or group/project. Required.</td></tr><tr><td><code>--branch</code></td><td>The branch the job must run on.</td></tr><tr><td><code>--tag</code></td><td>The tag the job must run on.</td></tr><tr><td><code>--environment</code></td><td>The CI environment the job must run in.</td></tr><tr><td><code>--may</code></td><td>What it may do; repeat for each. One of <code>pull</code>, <code>pull-full</code>, <code>push</code>, <code>push-protected</code>, <code>apply-structure</code>. Required.</td></tr></tbody></table>\n<h2 id=\"remote-trust-disable\"><code>crombolo remote trust disable</code></h2>\n<p>Stop a trusted CI job at once; its tokens stop working. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo remote trust disable &lt;rule&gt; [&lt;remote&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>rule</code></td><td>The rule's key, or the start of it. Required.</td></tr><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr></tbody></table>\n<h2 id=\"remote-trust-enable\"><code>crombolo remote trust enable</code></h2>\n<p>Trust a disabled CI job again. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo remote trust enable &lt;rule&gt; [&lt;remote&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>rule</code></td><td>The rule's key, or the start of it. Required.</td></tr><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr></tbody></table>\n<h2 id=\"remote-trust-list\"><code>crombolo remote trust list</code></h2>\n<p>The CI jobs a remote trusts: each rule, what it matches and what it may do. Changes nothing.</p>\n<pre><code>crombolo remote trust list [&lt;remote&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr></tbody></table>\n<h2 id=\"remote-trust-remove\"><code>crombolo remote trust remove</code></h2>\n<p>Forget a trusted CI job; its tokens stop working. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo remote trust remove &lt;rule&gt; [&lt;remote&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>rule</code></td><td>The rule's key, or the start of it. Required.</td></tr><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr></tbody></table>\n<h2 id=\"pull\"><code>crombolo pull</code></h2>\n<p>A copy of a remote environment: started here, or replacing this site. Each run acts again.</p>\n<pre><code>crombolo pull [&lt;remote&gt;] [--env &lt;env&gt;] [--full] [--yes] [--no-media] [--media-info-only] [--lazy-media] [--timeout &lt;timeout&gt;] [--backup-taken]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr><tr><td><code>--env</code></td><td>The environment to pull.</td></tr><tr><td><code>--full</code></td><td>A full copy, people included: needs the permission for it.</td></tr><tr><td><code>--yes</code></td><td>Replace this site without asking.</td></tr><tr><td><code>--no-media</code></td><td>Leave the media files out.</td></tr><tr><td><code>--media-info-only</code></td><td>Fetch media files one at a time, only what changed.</td></tr><tr><td><code>--lazy-media</code></td><td>Fetch each media file the first time it is asked for.</td></tr><tr><td><code>--timeout</code></td><td>Seconds to wait for the remote before giving up. Default <code>1800</code>.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr></tbody></table>\n<h2 id=\"push\"><code>crombolo push</code></h2>\n<p>Replace a remote environment with this site. Each run acts again.</p>\n<pre><code>crombolo push [&lt;remote&gt;] [--env &lt;env&gt;] [--force] [--auto-approve] [--media-info-only] [--dry-run] [--timeout &lt;timeout&gt;] [--no-browser]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>remote</code></td><td>The remote; the only one, when there is one.</td></tr><tr><td><code>--env</code></td><td>The environment to replace.</td></tr><tr><td><code>--force</code></td><td>Go on to a protected environment.</td></tr><tr><td><code>--auto-approve</code></td><td>With --force: don't ask for its name.</td></tr><tr><td><code>--media-info-only</code></td><td>Send media files one at a time, only what the remote lacks.</td></tr><tr><td><code>--dry-run</code></td><td>Say what it would replace, and send nothing.</td></tr><tr><td><code>--timeout</code></td><td>Seconds to wait for the remote before giving up. Default <code>1800</code>.</td></tr><tr><td><code>--no-browser</code></td><td>Don't open an approval page.</td></tr></tbody></table>\n<h2 id=\"bundle-apply\"><code>crombolo bundle apply</code></h2>\n<p>Apply a bundle's content here or to a remote: checked, backed up, one transaction. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo bundle apply [&lt;bundle&gt;] [--under &lt;under&gt;] [--resolve &lt;resolve&gt;] [--resolve-all &lt;resolve-all&gt;] [--allow-missing-blobs] [--publish] [--no-schema] [--no-files] [--replace-files] [--exclude-people] [--label &lt;label&gt;] [--backup-taken] [--dry-run] [--save] [--remote &lt;remote&gt;] [--env &lt;env&gt;] [--structure]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>bundle</code></td><td>A package directory, a .tgz, a bundle this site depends on, or `.` for this site's content files.</td></tr><tr><td><code>--under</code></td><td>Place the bundle under this page.</td></tr><tr><td><code>--resolve</code></td><td>Answer a finding: &lt;key&gt;=take-bundle|keep-local|skip, or &lt;key&gt;/&lt;property&gt;[@&lt;culture&gt;]=take-bundle|keep-local.</td></tr><tr><td><code>--resolve-all</code></td><td>Answer every finding the same way. One of <code>take-bundle</code>, <code>keep-local</code>, <code>skip</code>.</td></tr><tr><td><code>--allow-missing-blobs</code></td><td>Import media items whose files the bundle does not carry.</td></tr><tr><td><code>--publish</code></td><td>Publish what it imports.</td></tr><tr><td><code>--no-schema</code></td><td>Decline the schema the bundle carries.</td></tr><tr><td><code>--no-files</code></td><td>Decline the views, styles and scripts it carries.</td></tr><tr><td><code>--replace-files</code></td><td>Allow replacing files this site has; the originals are kept for a revert.</td></tr><tr><td><code>--exclude-people</code></td><td>Leave out the members and users it carries; this site's own are untouched.</td></tr><tr><td><code>--label</code></td><td>A label for the run.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr><tr><td><code>--dry-run</code></td><td>Say what it would do, and change nothing.</td></tr><tr><td><code>--save</code></td><td>With --dry-run: write the answers into the bundle.</td></tr><tr><td><code>--remote</code></td><td>Apply it on this remote instead.</td></tr><tr><td><code>--env</code></td><td>With --remote: the remote's environment.</td></tr><tr><td><code>--structure</code></td><td>With --remote, from a site directory: send its schema, views, styles and code too, not its content alone.</td></tr></tbody></table>\n<h2 id=\"bundle-build\"><code>crombolo bundle build</code></h2>\n<p>A bundle from a site directory: its schema, views, styles and content. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo bundle build [&lt;dir&gt;] [--template &lt;template&gt;] [--out &lt;out&gt;] [--check] [--name &lt;name&gt;] [--with-media] [--code &lt;code&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>dir</code></td><td>The site directory; this one when left out.</td></tr><tr><td><code>--template</code></td><td>A starter site the CLI ships, instead of a directory.</td></tr><tr><td><code>--out</code></td><td>The directory to write it to.</td></tr><tr><td><code>--check</code></td><td>Build it, report its problems, and write nothing.</td></tr><tr><td><code>--name</code></td><td>The bundle's package name.</td></tr><tr><td><code>--with-media</code></td><td>The media files too; left out unless asked.</td></tr><tr><td><code>--code</code></td><td>The site's own code, as globs; in place of crombolo.code in its package.json.</td></tr></tbody></table>\n<h2 id=\"bundle-check-code\"><code>crombolo bundle check-code</code></h2>\n<p>Check a bundle's code against this CMS. Changes nothing.</p>\n<pre><code>crombolo bundle check-code &lt;bundle&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>bundle</code></td><td>The bundle package directory. Required.</td></tr></tbody></table>\n<h2 id=\"bundle-export\"><code>crombolo bundle export</code></h2>\n<p>Write a subtree as a private bundle package to move elsewhere, or as content files to edit. Each run acts again.</p>\n<pre><code>crombolo bundle export [--root &lt;root&gt;] [--out &lt;out&gt;] [--source] [--all] [--only] [--drafts] [--with-blueprints] [--with-media] [--with-members] [--with-users] [--name &lt;name&gt;] [--package-version &lt;package-version&gt;] [--include-content] [--allow-content-unencrypted]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--root</code></td><td>The subtree to export; repeatable.</td></tr><tr><td><code>--out</code></td><td>The directory to write the package to.</td></tr><tr><td><code>--source</code></td><td>Write this site's content files instead of a package.</td></tr><tr><td><code>--all</code></td><td>With --source: every page, Library element and media item, with its file.</td></tr><tr><td><code>--only</code></td><td>The roots alone, not what is below them.</td></tr><tr><td><code>--drafts</code></td><td>Drafts, not only what is published.</td></tr><tr><td><code>--with-blueprints</code></td><td>The blueprints of its types.</td></tr><tr><td><code>--with-media</code></td><td>With --include-content: the media files.</td></tr><tr><td><code>--with-members</code></td><td>Members, encrypted.</td></tr><tr><td><code>--with-users</code></td><td>Back-office users, encrypted.</td></tr><tr><td><code>--name</code></td><td>The package's npm name.</td></tr><tr><td><code>--package-version</code></td><td>The package's version.</td></tr><tr><td><code>--include-content</code></td><td>Bring property values and media files, encrypted under a passphrase.</td></tr><tr><td><code>--allow-content-unencrypted</code></td><td>With --include-content: write them readable.</td></tr></tbody></table>\n<h2 id=\"bundle-install-code\"><code>crombolo bundle install-code</code></h2>\n<p>Install a bundle's code into a directory, ready to start. Each run acts again.</p>\n<pre><code>crombolo bundle install-code &lt;bundle&gt; &lt;dir&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>bundle</code></td><td>The bundle package directory. Required.</td></tr><tr><td><code>dir</code></td><td>An empty directory to install into. Required.</td></tr></tbody></table>\n<h2 id=\"bundle-purge\"><code>crombolo bundle purge</code></h2>\n<p>Back up, then drop a bundle's tables and clear its state. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo bundle purge &lt;id&gt; [--yes] [--dry-run] [--backup-taken]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>id</code></td><td>The bundle's id. Required.</td></tr><tr><td><code>--yes</code></td><td>Don't ask: drop them.</td></tr><tr><td><code>--dry-run</code></td><td>Say what it would do, and change nothing.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr></tbody></table>\n<h2 id=\"bundle-revert\"><code>crombolo bundle revert</code></h2>\n<p>Put an import back, restoring what the site served. Each run acts again.</p>\n<pre><code>crombolo bundle revert &lt;run&gt; [--resolve &lt;resolve&gt;] [--resolve-all &lt;resolve-all&gt;] [--force] [--backup-taken] [--remote &lt;remote&gt;] [--env &lt;env&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>run</code></td><td>The run id: `crombolo bundle runs` lists them. Required.</td></tr><tr><td><code>--resolve</code></td><td>Answer a finding: &lt;key&gt;=discard|skip.</td></tr><tr><td><code>--resolve-all</code></td><td>Answer every finding the same way. One of <code>discard</code>, <code>skip</code>.</td></tr><tr><td><code>--force</code></td><td>Revert over changes made since the run.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr><tr><td><code>--remote</code></td><td>Revert it on this remote instead.</td></tr><tr><td><code>--env</code></td><td>With --remote: the remote's environment.</td></tr></tbody></table>\n<h2 id=\"bundle-runs\"><code>crombolo bundle runs</code></h2>\n<p>The bundles applied here or on a remote, newest first. Changes nothing.</p>\n<pre><code>crombolo bundle runs [--limit &lt;limit&gt;] [--offset &lt;offset&gt;] [--fields &lt;fields&gt;] [--remote &lt;remote&gt;] [--env &lt;env&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--limit</code></td><td>How many to list. Default <code>20</code>.</td></tr><tr><td><code>--offset</code></td><td>How many to skip first. Default <code>0</code>.</td></tr><tr><td><code>--fields</code></td><td>Only these fields of each item, comma-separated.</td></tr><tr><td><code>--remote</code></td><td>A remote's applies instead.</td></tr><tr><td><code>--env</code></td><td>With --remote: the remote's environment.</td></tr></tbody></table>" }
generatedFrom = "the command line’s own description of its commands"
