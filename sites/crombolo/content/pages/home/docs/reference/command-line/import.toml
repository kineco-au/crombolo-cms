[values]
title = "Importing from Umbraco"
standfirst = "Bring an Umbraco site’s content types, content and media across."
body = { html = "<h2 id=\"import\"><code>crombolo import</code></h2>\n<p>Replace this site with a whole-site file; says what first. Each run acts again.</p>\n<pre><code>crombolo import &lt;file&gt; [--replace] [--replace-all] [--yes] [--allow-missing-media] [--exclude-people] [--backup-taken]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>file</code></td><td>A whole-site file (crombolo export --site). Required.</td></tr><tr><td><code>--replace</code></td><td>Replace this site: what it loses is recycled, people kept.</td></tr><tr><td><code>--replace-all</code></td><td>Make it exactly the file: what it loses is deleted, people too.</td></tr><tr><td><code>--yes</code></td><td>With --replace-all: don't ask.</td></tr><tr><td><code>--allow-missing-media</code></td><td>Import media items whose files the file does not carry.</td></tr><tr><td><code>--exclude-people</code></td><td>Leave out the members and users it carries; this site's own are untouched.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr></tbody></table>" }
