anch</code></td><td>Cover this branch too.</td></tr><tr><td><code>--remove-branch</code></td><td>Stop covering this branch.</td></tr><tr><td><code>--publishers-may-skip</code></td><td>People who may publish skip it.</td></tr><tr><td><code>--on-edit</code></td><td>What saving a page does while it waits. One of <code>withdraw</code>, <code>approve-latest</code>, <code>lock</code>, <code>lock-after-first-approval</code>.</td></tr><tr><td><code>--self-approval</code></td><td>Whether whoever sent it may approve it. One of <code>refused</code>, <code>allowed</code>, <code>automatic</code>.</td></tr><tr><td><code>--comments</code></td><td>When a decision needs a comment. One of <code>optional</code>, <code>on-send-back</code>, <code>always</code>.</td></tr><tr><td><code>--unpublish</code></td><td>Taking a page down goes through it too.</td></tr><tr><td><code>--on-change</code></td><td>What waiting requests do when it changes. One of <code>keep</code>, <code>restart</code>, <code>withdraw</code>.</td></tr><tr><td><code>--scheduling</code></td><td>A request may say when to publish or take down.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"webhooks-events\"><code>crombolo webhooks events</code></h2>\n<p>The events a webhook can be sent on. Changes nothing.</p>\n<pre><code>crombolo webhooks events</code></pre>\n<h2 id=\"webhooks-list\"><code>crombolo webhooks list</code></h2>\n<p>The site's webhooks, and those kept in this environment only. Changes nothing.</p>\n<pre><code>crombolo webhooks list</code></pre>\n<h2 id=\"webhooks-new\"><code>crombolo webhooks new</code></h2>\n<p>Write a webhook kept with the site, checked as the server reads it. Each run acts again.</p>\n<pre><code>crombolo webhooks new &lt;alias&gt; --url &lt;url&gt; --event &lt;event&gt; [--content-type &lt;content-type&gt;]