[values]
title = "Content types"
standfirst = "Check, apply and change the content model kept in schema/: types, languages, forms, workflows, webhooks and page addresses."
body = { html = "<h2 id=\"types-check\"><code>crombolo types check</code></h2>\n<p>Check the site's definitions, and what applying them would do to this database. Changes nothing.</p>\n<pre><code>crombolo types check [--static]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--static</code></td><td>Validate the files only, no database.</td></tr></tbody></table>\n<h2 id=\"types-editors\"><code>crombolo types editors</code></h2>\n<p>The editors a data type can use, and the settings each takes by name. Changes nothing.</p>\n<pre><code>crombolo types editors [&lt;editor&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>editor</code></td><td>One editor, by the name `types new data-type --editor` takes.</td></tr></tbody></table>\n<h2 id=\"types-export\"><code>crombolo types export</code></h2>\n<p>Write the database's definitions as schema/ files. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types export</code></pre>\n<h2 id=\"types-list\"><code>crombolo types list</code></h2>\n<p>The site's content, element, media, member and data types. Changes nothing.</p>\n<pre><code>crombolo types list [--kind &lt;kind&gt;] [--own] [--from-database]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--kind</code></td><td>Only this kind. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>, <code>data</code>.</td></tr><tr><td><code>--own</code></td><td>Leave out the data types every site has built in.</td></tr><tr><td><code>--from-database</code></td><td>What the database has applied, not what the site defines.</td></tr></tbody></table>\n<h2 id=\"types-new\"><code>crombolo types new</code></h2>\n<p>Write a type or data type file, and the view it points at, then apply it. Each run acts again.</p>\n<pre><code>crombolo types new &lt;kind&gt; &lt;alias&gt; [--name &lt;name&gt;] [--description &lt;description&gt;] [--icon &lt;icon&gt;] [--at-root] [--element] [--tab &lt;tab&gt;] [--title] [--no-view] [--compose &lt;compose&gt;] [--allow-child &lt;allow-child&gt;] [--vary-by-culture] [--vary-by-segment] [--library] [--list-view] [--list-view-type &lt;list-view-type&gt;] [--editor &lt;editor&gt;] [--max-chars &lt;max-chars&gt;] [--rows &lt;rows&gt;] [--min &lt;min&gt;] [--max &lt;max&gt;] [--step &lt;step&gt;] [--default-on] [--label &lt;label&gt;] [--with-time] [--option &lt;option&gt;] [--multiple] [--allow &lt;allow&gt;] [--block &lt;block&gt;] [--columns &lt;columns&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>kind</code></td><td>What kind of type. One of <code>content-type</code>, <code>media-type</code>, <code>member-type</code>, <code>data-type</code>. Required.</td></tr><tr><td><code>alias</code></td><td>The type's alias. Required.</td></tr><tr><td><code>--name</code></td><td>The type's name.</td></tr><tr><td><code>--description</code></td><td>The type's description.</td></tr><tr><td><code>--icon</code></td><td>The type's icon.</td></tr><tr><td><code>--at-root</code></td><td>Allow it at the root of the tree.</td></tr><tr><td><code>--element</code></td><td>An element type, for blocks.</td></tr><tr><td><code>--tab</code></td><td>The tab its title goes in.</td></tr><tr><td><code>--title</code></td><td>Start it with a mandatory title: a content type has one unless a composition does, an element type has none.</td></tr><tr><td><code>--no-view</code></td><td>No view: a type nothing renders.</td></tr><tr><td><code>--compose</code></td><td>A type it is composed of.</td></tr><tr><td><code>--allow-child</code></td><td>A type allowed beneath it.</td></tr><tr><td><code>--vary-by-culture</code></td><td>Its content differs by language.</td></tr><tr><td><code>--vary-by-segment</code></td><td>Its content differs by segment.</td></tr><tr><td><code>--library</code></td><td>It may be created in the Library.</td></tr><tr><td><code>--list-view</code></td><td>Show the pages beneath it as a list.</td></tr><tr><td><code>--list-view-type</code></td><td>The list view data type, instead of the default.</td></tr><tr><td><code>--editor</code></td><td>Data types: the editor it uses. One of <code>textstring</code>, <code>textarea</code>, <code>rich-text</code>, <code>number</code>, <code>toggle</code>, <code>date</code>, <code>dropdown</code>, <code>content-picker</code>, <code>media-picker</code>, <code>element-picker</code>, <code>block-list</code>, <code>block-grid</code>.</td></tr><tr><td><code>--max-chars</code></td><td>Data types: the most characters allowed.</td></tr><tr><td><code>--rows</code></td><td>Data types: the rows a text area shows.</td></tr><tr><td><code>--min</code></td><td>Data types: the least allowed (number, items).</td></tr><tr><td><code>--max</code></td><td>Data types: the most allowed (number, items).</td></tr><tr><td><code>--step</code></td><td>Data types: the step between numbers.</td></tr><tr><td><code>--default-on</code></td><td>Data types: a toggle starts on.</td></tr><tr><td><code>--label</code></td><td>Data types: a toggle's label.</td></tr><tr><td><code>--with-time</code></td><td>Data types: a date with a time of day.</td></tr><tr><td><code>--option</code></td><td>Data types: a dropdown choice.</td></tr><tr><td><code>--multiple</code></td><td>Data types: more than one may be chosen.</td></tr><tr><td><code>--allow</code></td><td>Data types: a type a picker offers.</td></tr><tr><td><code>--block</code></td><td>Data types: an element type offered as a block.</td></tr><tr><td><code>--columns</code></td><td>Data types: the columns a block grid has.</td></tr></tbody></table>\n<h2 id=\"types-property-add\"><code>crombolo types property add</code></h2>\n<p>Add a property to a type. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types property add &lt;type&gt; &lt;alias&gt; --type &lt;type&gt; [--name &lt;name&gt;] [--description &lt;description&gt;] [--mandatory] [--tab &lt;tab&gt;] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>alias</code></td><td>The property's alias. Required.</td></tr><tr><td><code>--type</code></td><td>Its data type. Required.</td></tr><tr><td><code>--name</code></td><td>Its name.</td></tr><tr><td><code>--description</code></td><td>Its description.</td></tr><tr><td><code>--mandatory</code></td><td>An editor must fill it in.</td></tr><tr><td><code>--tab</code></td><td>The tab it goes in.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-property-move\"><code>crombolo types property move</code></h2>\n<p>Move a property to another tab, or before or after another property. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types property move &lt;type&gt; &lt;property&gt; [--tab &lt;tab&gt;] [--before &lt;before&gt;] [--after &lt;after&gt;] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>property</code></td><td>The property's alias. Required.</td></tr><tr><td><code>--tab</code></td><td>The tab it goes in.</td></tr><tr><td><code>--before</code></td><td>The property it goes before.</td></tr><tr><td><code>--after</code></td><td>The property it goes after.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-property-remove\"><code>crombolo types property remove</code></h2>\n<p>Remove a property from a type; its values are kept until `types purge`. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types property remove &lt;type&gt; &lt;property&gt; [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>property</code></td><td>The property's alias. Required.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-property-rename\"><code>crombolo types property rename</code></h2>\n<p>Rename a property's alias, keeping its values. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types property rename &lt;type&gt; &lt;property&gt; &lt;to&gt; [--kind &lt;kind&gt;] [--dry-run] [--no-apply] [--everywhere]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>property</code></td><td>The property's alias now. Required.</td></tr><tr><td><code>to</code></td><td>Its new alias. Required.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr><tr><td><code>--everywhere</code></td><td>Rename it wherever the site names it too: definitions, content files and views.</td></tr></tbody></table>\n<h2 id=\"types-property-update\"><code>crombolo types property update</code></h2>\n<p>Change a property's name, description, validation, variance or data type. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types property update &lt;type&gt; &lt;property&gt; [--name &lt;name&gt;] [--description &lt;description&gt;] [--mandatory] [--regex &lt;regex&gt;] [--regex-message &lt;regex-message&gt;] [--vary-by-culture] [--vary-by-segment] [--type &lt;type&gt;] [--member-can-view] [--member-can-edit] [--sensitive] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>property</code></td><td>The property's alias. Required.</td></tr><tr><td><code>--name</code></td><td>Its name.</td></tr><tr><td><code>--description</code></td><td>Its description; &quot;&quot; for none.</td></tr><tr><td><code>--mandatory</code></td><td>An editor must fill it in.</td></tr><tr><td><code>--regex</code></td><td>What a value must match; &quot;&quot; for nothing.</td></tr><tr><td><code>--regex-message</code></td><td>What an editor is told when it does not.</td></tr><tr><td><code>--vary-by-culture</code></td><td>Its value differs by language.</td></tr><tr><td><code>--vary-by-segment</code></td><td>Its value differs by segment.</td></tr><tr><td><code>--type</code></td><td>Its data type.</td></tr><tr><td><code>--member-can-view</code></td><td>Member types: the member sees it on their profile.</td></tr><tr><td><code>--member-can-edit</code></td><td>Member types: the member may change it on their profile.</td></tr><tr><td><code>--sensitive</code></td><td>Member types: hidden from users who may not see sensitive data.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-purge\"><code>crombolo types purge</code></h2>\n<p>Delete properties retired more than N days ago, with their values. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types purge --older-than &lt;older-than&gt; [--backup-taken]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--older-than</code></td><td>How long, in days, a property must have been retired. Required.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr></tbody></table>\n<h2 id=\"types-remove\"><code>crombolo types remove</code></h2>\n<p>Remove a type or data type the site no longer needs. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types remove &lt;alias&gt; [--retire] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The type's or data type's alias. Required.</td></tr><tr><td><code>--retire</code></td><td>Types: retire it though items use it; they stay, with their values.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>, <code>data</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-rename\"><code>crombolo types rename</code></h2>\n<p>Rename a type's or a data type's alias, keeping its content. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types rename &lt;alias&gt; &lt;to&gt; [--kind &lt;kind&gt;] [--dry-run] [--no-apply] [--everywhere]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>Its alias now. Required.</td></tr><tr><td><code>to</code></td><td>Its new alias. Required.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>, <code>data</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr><tr><td><code>--everywhere</code></td><td>Rename it wherever the site names it too: definitions, content files and views.</td></tr></tbody></table>\n<h2 id=\"types-rewrite\"><code>crombolo types rewrite</code></h2>\n<p>Rewrite every schema/ file canonically. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types rewrite</code></pre>\n<h2 id=\"types-show\"><code>crombolo types show</code></h2>\n<p>One content, element, media, member or data type, and what uses it. Changes nothing.</p>\n<pre><code>crombolo types show &lt;alias&gt; [--kind &lt;kind&gt;] [--from-database]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The type's or data type's alias. Required.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>, <code>data</code>.</td></tr><tr><td><code>--from-database</code></td><td>What the database has applied, not what the site defines.</td></tr></tbody></table>\n<h2 id=\"types-sync\"><code>crombolo types sync</code></h2>\n<p>Apply the site's definitions to its database. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types sync [--force-retire-types]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--force-retire-types</code></td><td>Retire a type the files no longer have even though content uses it.</td></tr></tbody></table>\n<h2 id=\"types-tab-add\"><code>crombolo types tab add</code></h2>\n<p>Add a tab to a type. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types tab add &lt;type&gt; &lt;name&gt; [--before &lt;before&gt;] [--after &lt;after&gt;] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>name</code></td><td>The tab's name. Required.</td></tr><tr><td><code>--before</code></td><td>The tab it goes before.</td></tr><tr><td><code>--after</code></td><td>The tab it goes after.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-tab-move\"><code>crombolo types tab move</code></h2>\n<p>Move a tab before or after another. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types tab move &lt;type&gt; &lt;name&gt; [--before &lt;before&gt;] [--after &lt;after&gt;] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>name</code></td><td>The tab's name. Required.</td></tr><tr><td><code>--before</code></td><td>The tab it goes before.</td></tr><tr><td><code>--after</code></td><td>The tab it goes after.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-tab-remove\"><code>crombolo types tab remove</code></h2>\n<p>Remove a type's tab, moving its properties to another. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types tab remove &lt;type&gt; &lt;name&gt; [--move-to &lt;move-to&gt;] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>name</code></td><td>The tab's name. Required.</td></tr><tr><td><code>--move-to</code></td><td>The tab its properties go to.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-tab-rename\"><code>crombolo types tab rename</code></h2>\n<p>Rename a type's tab. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types tab rename &lt;type&gt; &lt;name&gt; &lt;to&gt; [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>type</code></td><td>The type's alias. Required.</td></tr><tr><td><code>name</code></td><td>The tab's name. Required.</td></tr><tr><td><code>to</code></td><td>Its new name. Required.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two types share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"types-update\"><code>crombolo types update</code></h2>\n<p>Change a type's or a data type's settings. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo types update &lt;alias&gt; [--name &lt;name&gt;] [--description &lt;description&gt;] [--icon &lt;icon&gt;] [--at-root] [--element] [--library] [--vary-by-culture] [--vary-by-segment] [--list-view &lt;list-view&gt;] [--allow-child &lt;allow-child&gt;] [--disallow-child &lt;disallow-child&gt;] [--compose &lt;compose&gt;] [--decompose &lt;decompose&gt;] [--view &lt;view&gt;] [--remove-view &lt;remove-view&gt;] [--default-view &lt;default-view&gt;] [--set &lt;set&gt;] [--unset &lt;unset&gt;] [--max-chars &lt;max-chars&gt;] [--rows &lt;rows&gt;] [--min &lt;min&gt;] [--max &lt;max&gt;] [--step &lt;step&gt;] [--default-on] [--label &lt;label&gt;] [--with-time] [--option &lt;option&gt;] [--multiple] [--allow &lt;allow&gt;] [--columns &lt;columns&gt;] [--add-block &lt;add-block&gt;] [--block-label &lt;block-label&gt;] [--block-settings &lt;block-settings&gt;] [--remove-block &lt;remove-block&gt;] [--start-at &lt;start-at&gt;] [--kind &lt;kind&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The type's or data type's alias. Required.</td></tr><tr><td><code>--name</code></td><td>Its name.</td></tr><tr><td><code>--description</code></td><td>Its description; &quot;&quot; for none.</td></tr><tr><td><code>--icon</code></td><td>Its icon.</td></tr><tr><td><code>--at-root</code></td><td>Types: allowed at the root of the tree.</td></tr><tr><td><code>--element</code></td><td>Types: an element type, for blocks.</td></tr><tr><td><code>--library</code></td><td>Types: may be created in the Library.</td></tr><tr><td><code>--vary-by-culture</code></td><td>Types: its content differs by language.</td></tr><tr><td><code>--vary-by-segment</code></td><td>Types: its content differs by segment.</td></tr><tr><td><code>--list-view</code></td><td>Types: show the items beneath it as this list view; none for no list.</td></tr><tr><td><code>--allow-child</code></td><td>Types: allow this type beneath it.</td></tr><tr><td><code>--disallow-child</code></td><td>Types: stop allowing this type beneath it.</td></tr><tr><td><code>--compose</code></td><td>Types: compose it of this type too.</td></tr><tr><td><code>--decompose</code></td><td>Types: stop composing it of this type.</td></tr><tr><td><code>--view</code></td><td>Types: add a view it may be shown with.</td></tr><tr><td><code>--remove-view</code></td><td>Types: take a view away.</td></tr><tr><td><code>--default-view</code></td><td>Types: the view it is shown with unless another is chosen.</td></tr><tr><td><code>--set</code></td><td>Data types: store a setting as given; JSON when it parses.</td></tr><tr><td><code>--unset</code></td><td>Data types: take a setting away.</td></tr><tr><td><code>--max-chars</code></td><td>Data types: the most characters allowed.</td></tr><tr><td><code>--rows</code></td><td>Data types: the rows a text area shows.</td></tr><tr><td><code>--min</code></td><td>Data types: the least allowed (number, items).</td></tr><tr><td><code>--max</code></td><td>Data types: the most allowed (number, items).</td></tr><tr><td><code>--step</code></td><td>Data types: the step between numbers.</td></tr><tr><td><code>--default-on</code></td><td>Data types: a toggle starts on.</td></tr><tr><td><code>--label</code></td><td>Data types: a toggle's label.</td></tr><tr><td><code>--with-time</code></td><td>Data types: a date with a time of day.</td></tr><tr><td><code>--option</code></td><td>Data types: a dropdown option; give each, in order.</td></tr><tr><td><code>--multiple</code></td><td>Data types: more than one may be chosen.</td></tr><tr><td><code>--allow</code></td><td>Data types: a type a picker allows; give each.</td></tr><tr><td><code>--columns</code></td><td>Data types: a block grid's columns.</td></tr><tr><td><code>--add-block</code></td><td>Data types: offer this element type as a block.</td></tr><tr><td><code>--block-label</code></td><td>Data types: the label of the block --add-block adds.</td></tr><tr><td><code>--block-settings</code></td><td>Data types: the settings element type of the block --add-block adds.</td></tr><tr><td><code>--remove-block</code></td><td>Data types: stop offering this block.</td></tr><tr><td><code>--start-at</code></td><td>Data types: a picker's start node, by the page's path; none for none.</td></tr><tr><td><code>--kind</code></td><td>The kind, when two share the alias. One of <code>content</code>, <code>element</code>, <code>media</code>, <code>member</code>, <code>data</code>.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"languages-add\"><code>crombolo languages add</code></h2>\n<p>Add a language to the site. Each run acts again.</p>\n<pre><code>crombolo languages add &lt;iso&gt; [--name &lt;name&gt;] [--default] [--mandatory] [--fallback &lt;fallback&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>iso</code></td><td>The language code, such as fr-FR. Required.</td></tr><tr><td><code>--name</code></td><td>Its name; from the code when absent.</td></tr><tr><td><code>--default</code></td><td>Make it the default language.</td></tr><tr><td><code>--mandatory</code></td><td>A page must be filled in this language to publish.</td></tr><tr><td><code>--fallback</code></td><td>The language shown when this one is empty.</td></tr></tbody></table>\n<h2 id=\"languages-list\"><code>crombolo languages list</code></h2>\n<p>The site's languages. Changes nothing.</p>\n<pre><code>crombolo languages list</code></pre>\n<h2 id=\"languages-remove\"><code>crombolo languages remove</code></h2>\n<p>Remove a language no content is written in. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo languages remove &lt;iso&gt; [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>iso</code></td><td>The language code, such as fr-FR. Required.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave the database as it is.</td></tr></tbody></table>\n<h2 id=\"languages-update\"><code>crombolo languages update</code></h2>\n<p>Change a language's name, fallback or whether it is mandatory, or make it the default. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo languages update &lt;iso&gt; [--name &lt;name&gt;] [--fallback &lt;fallback&gt;] [--mandatory] [--default] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>iso</code></td><td>The language code, such as fr-FR. Required.</td></tr><tr><td><code>--name</code></td><td>Its name.</td></tr><tr><td><code>--fallback</code></td><td>The language shown when this one is empty; none for none.</td></tr><tr><td><code>--mandatory</code></td><td>A page must be filled in this language to publish.</td></tr><tr><td><code>--default</code></td><td>Make it the default language.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-field-add\"><code>crombolo forms field add</code></h2>\n<p>Add a field to a form. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms field add &lt;form&gt; &lt;alias&gt; --type &lt;type&gt; [--caption &lt;caption&gt;] [--help &lt;help&gt;] [--mandatory] [--mandatory-message &lt;mandatory-message&gt;] [--pattern &lt;pattern&gt;] [--pattern-message &lt;pattern-message&gt;] [--sensitive] [--placeholder &lt;placeholder&gt;] [--default &lt;default&gt;] [--option &lt;option&gt;] [--set &lt;set&gt;] [--show-when &lt;show-when&gt;] [--show-when-any] [--show-always] [--page &lt;page&gt;] [--group &lt;group&gt;] [--before &lt;before&gt;] [--after &lt;after&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>alias</code></td><td>The new field's alias. Required.</td></tr><tr><td><code>--type</code></td><td>Its type: short-answer, long-answer, email, number, date, checkbox, dropdown, single-choice, multiple-choice, file-upload, data-consent, hidden, or one a bundle adds. Required.</td></tr><tr><td><code>--caption</code></td><td>The words beside it.</td></tr><tr><td><code>--help</code></td><td>Help text beneath it.</td></tr><tr><td><code>--mandatory</code></td><td>It must be filled in.</td></tr><tr><td><code>--mandatory-message</code></td><td>What a visitor is told when it is left empty.</td></tr><tr><td><code>--pattern</code></td><td>A pattern its answer must match.</td></tr><tr><td><code>--pattern-message</code></td><td>What a visitor is told when it does not match.</td></tr><tr><td><code>--sensitive</code></td><td>Only people allowed to see sensitive answers see it.</td></tr><tr><td><code>--placeholder</code></td><td>The hint shown in it while empty.</td></tr><tr><td><code>--default</code></td><td>The answer it starts with.</td></tr><tr><td><code>--option</code></td><td>A choice; give each, in order.</td></tr><tr><td><code>--set</code></td><td>A bundle field type's setting, stored as given; JSON when it parses.</td></tr><tr><td><code>--show-when</code></td><td>Show it only when another field has this value: &lt;field&gt;=&lt;value&gt;, or &lt;field&gt;!=&lt;value&gt;; give several for all of them.</td></tr><tr><td><code>--show-when-any</code></td><td>With --show-when: show it when any of them holds, not all.</td></tr><tr><td><code>--show-always</code></td><td>Take its condition away.</td></tr><tr><td><code>--page</code></td><td>The page, by its caption or its number from 1.</td></tr><tr><td><code>--group</code></td><td>The fieldset, by its caption or its number from 1.</td></tr><tr><td><code>--before</code></td><td>Put it before this one.</td></tr><tr><td><code>--after</code></td><td>Put it after this one.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-field-move\"><code>crombolo forms field move</code></h2>\n<p>Move a form field beside another, or to another page or fieldset. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms field move &lt;form&gt; &lt;alias&gt; [--page &lt;page&gt;] [--group &lt;group&gt;] [--before &lt;before&gt;] [--after &lt;after&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>alias</code></td><td>The field's alias. Required.</td></tr><tr><td><code>--page</code></td><td>The page, by its caption or its number from 1.</td></tr><tr><td><code>--group</code></td><td>The fieldset, by its caption or its number from 1.</td></tr><tr><td><code>--before</code></td><td>Put it before this one.</td></tr><tr><td><code>--after</code></td><td>Put it after this one.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-field-remove\"><code>crombolo forms field remove</code></h2>\n<p>Remove a field from a form. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms field remove &lt;form&gt; &lt;alias&gt; [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>alias</code></td><td>The field's alias. Required.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-field-update\"><code>crombolo forms field update</code></h2>\n<p>Change a form field's caption, type, rules, choices or condition. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms field update &lt;form&gt; &lt;alias&gt; [--type &lt;type&gt;] [--caption &lt;caption&gt;] [--help &lt;help&gt;] [--mandatory] [--mandatory-message &lt;mandatory-message&gt;] [--pattern &lt;pattern&gt;] [--pattern-message &lt;pattern-message&gt;] [--sensitive] [--placeholder &lt;placeholder&gt;] [--default &lt;default&gt;] [--option &lt;option&gt;] [--set &lt;set&gt;] [--show-when &lt;show-when&gt;] [--show-when-any] [--show-always] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>alias</code></td><td>The field's alias. Required.</td></tr><tr><td><code>--type</code></td><td>Its type.</td></tr><tr><td><code>--caption</code></td><td>The words beside it.</td></tr><tr><td><code>--help</code></td><td>Help text beneath it.</td></tr><tr><td><code>--mandatory</code></td><td>It must be filled in.</td></tr><tr><td><code>--mandatory-message</code></td><td>What a visitor is told when it is left empty.</td></tr><tr><td><code>--pattern</code></td><td>A pattern its answer must match.</td></tr><tr><td><code>--pattern-message</code></td><td>What a visitor is told when it does not match.</td></tr><tr><td><code>--sensitive</code></td><td>Only people allowed to see sensitive answers see it.</td></tr><tr><td><code>--placeholder</code></td><td>The hint shown in it while empty.</td></tr><tr><td><code>--default</code></td><td>The answer it starts with.</td></tr><tr><td><code>--option</code></td><td>A choice; give each, in order.</td></tr><tr><td><code>--set</code></td><td>A bundle field type's setting, stored as given; JSON when it parses.</td></tr><tr><td><code>--show-when</code></td><td>Show it only when another field has this value: &lt;field&gt;=&lt;value&gt;, or &lt;field&gt;!=&lt;value&gt;; give several for all of them.</td></tr><tr><td><code>--show-when-any</code></td><td>With --show-when: show it when any of them holds, not all.</td></tr><tr><td><code>--show-always</code></td><td>Take its condition away.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-group-add\"><code>crombolo forms group add</code></h2>\n<p>Add a fieldset to a page of a form. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms group add &lt;form&gt; [--page &lt;page&gt;] [--caption &lt;caption&gt;] [--columns &lt;columns&gt;] [--show-when &lt;show-when&gt;] [--show-when-any] [--show-always] [--before &lt;before&gt;] [--after &lt;after&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>--page</code></td><td>The page, by its caption or its number from 1.</td></tr><tr><td><code>--caption</code></td><td>Its caption.</td></tr><tr><td><code>--columns</code></td><td>The columns its fields are laid out in.</td></tr><tr><td><code>--show-when</code></td><td>Show it only when another field has this value: &lt;field&gt;=&lt;value&gt;, or &lt;field&gt;!=&lt;value&gt;; give several for all of them.</td></tr><tr><td><code>--show-when-any</code></td><td>With --show-when: show it when any of them holds, not all.</td></tr><tr><td><code>--show-always</code></td><td>Take its condition away.</td></tr><tr><td><code>--before</code></td><td>Put it before this one.</td></tr><tr><td><code>--after</code></td><td>Put it after this one.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-group-move\"><code>crombolo forms group move</code></h2>\n<p>Move a fieldset before or after another on its page. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms group move &lt;form&gt; &lt;group&gt; [--page &lt;page&gt;] [--before &lt;before&gt;] [--after &lt;after&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>group</code></td><td>The fieldset, by its caption or its number from 1. Required.</td></tr><tr><td><code>--page</code></td><td>The page it is on, by its caption or its number from 1. Default <code>1</code>.</td></tr><tr><td><code>--before</code></td><td>Put it before this one.</td></tr><tr><td><code>--after</code></td><td>Put it after this one.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-group-remove\"><code>crombolo forms group remove</code></h2>\n<p>Remove a fieldset from a page of a form. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms group remove &lt;form&gt; &lt;group&gt; [--page &lt;page&gt;] [--move-fields-to &lt;move-fields-to&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>group</code></td><td>The fieldset, by its caption or its number from 1. Required.</td></tr><tr><td><code>--page</code></td><td>The page it is on, by its caption or its number from 1. Default <code>1</code>.</td></tr><tr><td><code>--move-fields-to</code></td><td>The fieldset that takes its fields.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-group-update\"><code>crombolo forms group update</code></h2>\n<p>Change a fieldset's caption, columns or when it is shown. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms group update &lt;form&gt; &lt;group&gt; [--page &lt;page&gt;] [--caption &lt;caption&gt;] [--columns &lt;columns&gt;] [--show-when &lt;show-when&gt;] [--show-when-any] [--show-always] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>group</code></td><td>The fieldset, by its caption or its number from 1. Required.</td></tr><tr><td><code>--page</code></td><td>The page it is on, by its caption or its number from 1. Default <code>1</code>.</td></tr><tr><td><code>--caption</code></td><td>Its caption.</td></tr><tr><td><code>--columns</code></td><td>The columns its fields are laid out in.</td></tr><tr><td><code>--show-when</code></td><td>Show it only when another field has this value: &lt;field&gt;=&lt;value&gt;, or &lt;field&gt;!=&lt;value&gt;; give several for all of them.</td></tr><tr><td><code>--show-when-any</code></td><td>With --show-when: show it when any of them holds, not all.</td></tr><tr><td><code>--show-always</code></td><td>Take its condition away.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-list\"><code>crombolo forms list</code></h2>\n<p>The site's forms. Changes nothing.</p>\n<pre><code>crombolo forms list</code></pre>\n<h2 id=\"forms-new\"><code>crombolo forms new</code></h2>\n<p>Write a form asking for a name and an email address, then apply it. Each run acts again.</p>\n<pre><code>crombolo forms new &lt;alias&gt; [--name &lt;name&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The form's alias. Required.</td></tr><tr><td><code>--name</code></td><td>The form's name.</td></tr></tbody></table>\n<h2 id=\"forms-page-add\"><code>crombolo forms page add</code></h2>\n<p>Add a page to a form, with one empty fieldset. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms page add &lt;form&gt; [--caption &lt;caption&gt;] [--show-when &lt;show-when&gt;] [--show-when-any] [--show-always] [--before &lt;before&gt;] [--after &lt;after&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>--caption</code></td><td>Its caption.</td></tr><tr><td><code>--show-when</code></td><td>Show it only when another field has this value: &lt;field&gt;=&lt;value&gt;, or &lt;field&gt;!=&lt;value&gt;; give several for all of them.</td></tr><tr><td><code>--show-when-any</code></td><td>With --show-when: show it when any of them holds, not all.</td></tr><tr><td><code>--show-always</code></td><td>Take its condition away.</td></tr><tr><td><code>--before</code></td><td>Put it before this one.</td></tr><tr><td><code>--after</code></td><td>Put it after this one.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-page-move\"><code>crombolo forms page move</code></h2>\n<p>Move a form page before or after another. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms page move &lt;form&gt; &lt;page&gt; [--before &lt;before&gt;] [--after &lt;after&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>page</code></td><td>The page, by its caption or its number from 1. Required.</td></tr><tr><td><code>--before</code></td><td>Put it before this one.</td></tr><tr><td><code>--after</code></td><td>Put it after this one.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-page-remove\"><code>crombolo forms page remove</code></h2>\n<p>Remove a page from a form. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms page remove &lt;form&gt; &lt;page&gt; [--move-fields-to &lt;move-fields-to&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>page</code></td><td>The page, by its caption or its number from 1. Required.</td></tr><tr><td><code>--move-fields-to</code></td><td>The page that takes its fields.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-page-update\"><code>crombolo forms page update</code></h2>\n<p>Change a form page's caption or when it is shown. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms page update &lt;form&gt; &lt;page&gt; [--caption &lt;caption&gt;] [--show-when &lt;show-when&gt;] [--show-when-any] [--show-always] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>page</code></td><td>The page, by its caption or its number from 1. Required.</td></tr><tr><td><code>--caption</code></td><td>Its caption.</td></tr><tr><td><code>--show-when</code></td><td>Show it only when another field has this value: &lt;field&gt;=&lt;value&gt;, or &lt;field&gt;!=&lt;value&gt;; give several for all of them.</td></tr><tr><td><code>--show-when-any</code></td><td>With --show-when: show it when any of them holds, not all.</td></tr><tr><td><code>--show-always</code></td><td>Take its condition away.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-remove\"><code>crombolo forms remove</code></h2>\n<p>Remove a form no page or Library form uses. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms remove &lt;alias&gt; [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The form's alias. Required.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-show\"><code>crombolo forms show</code></h2>\n<p>One form: its pages, fieldsets, fields, workflows and what uses it. Changes nothing.</p>\n<pre><code>crombolo forms show &lt;alias&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The form's alias. Required.</td></tr></tbody></table>\n<h2 id=\"forms-update\"><code>crombolo forms update</code></h2>\n<p>Change a form's settings: its name, what it keeps, its buttons and what follows sending. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms update &lt;alias&gt; [--name &lt;name&gt;] [--store-entries] [--requires-approval] [--step-pages] [--submit-label &lt;submit-label&gt;] [--next-label &lt;next-label&gt;] [--previous-label &lt;previous-label&gt;] [--message &lt;message&gt;] [--redirect-to &lt;redirect-to&gt;] [--theme &lt;theme&gt;] [--honeypot] [--minimum-seconds &lt;minimum-seconds&gt;] [--max-entries &lt;max-entries&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The form's alias. Required.</td></tr><tr><td><code>--name</code></td><td>Its name.</td></tr><tr><td><code>--store-entries</code></td><td>Keep each entry.</td></tr><tr><td><code>--requires-approval</code></td><td>Entries wait until someone approves them.</td></tr><tr><td><code>--step-pages</code></td><td>Show one page at a time.</td></tr><tr><td><code>--submit-label</code></td><td>The send button's words.</td></tr><tr><td><code>--next-label</code></td><td>The next-page button's words.</td></tr><tr><td><code>--previous-label</code></td><td>The previous-page button's words.</td></tr><tr><td><code>--message</code></td><td>What a visitor sees after sending; &quot;&quot; for none.</td></tr><tr><td><code>--redirect-to</code></td><td>The page a visitor goes to after sending, by its path; none for none.</td></tr><tr><td><code>--theme</code></td><td>Its theme.</td></tr><tr><td><code>--honeypot</code></td><td>Catch spam with a field visitors never fill.</td></tr><tr><td><code>--minimum-seconds</code></td><td>Mark as spam an entry sent faster than this; 0 for no limit.</td></tr><tr><td><code>--max-entries</code></td><td>Refuse entries once there are this many; 0 for no limit.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-workflow-add\"><code>crombolo forms workflow add</code></h2>\n<p>Add a workflow to a form: what happens to each entry. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms workflow add &lt;form&gt; --type &lt;type&gt; --name &lt;name&gt; [--on &lt;on&gt;] [--to &lt;to&gt;] [--subject &lt;subject&gt;] [--url &lt;url&gt;] [--set &lt;set&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>--type</code></td><td>Its type: send-email, send-to-url, save-as-content, or one a bundle adds. Required.</td></tr><tr><td><code>--name</code></td><td>Its name, which other commands know it by. Required.</td></tr><tr><td><code>--on</code></td><td>When it runs: when an entry is sent, or when one is approved. One of <code>submit</code>, <code>approve</code>.</td></tr><tr><td><code>--to</code></td><td>E-mail: who it is sent to; give each.</td></tr><tr><td><code>--subject</code></td><td>E-mail: its subject.</td></tr><tr><td><code>--url</code></td><td>Send to a URL: the address entries are sent to.</td></tr><tr><td><code>--set</code></td><td>Any setting, stored as given; JSON when it parses.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-workflow-remove\"><code>crombolo forms workflow remove</code></h2>\n<p>Remove a workflow from a form. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms workflow remove &lt;form&gt; &lt;workflow&gt; [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>workflow</code></td><td>The workflow's name. Required.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"forms-workflow-update\"><code>crombolo forms workflow update</code></h2>\n<p>Change a form workflow's name, when it runs, or its settings. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo forms workflow update &lt;form&gt; &lt;workflow&gt; [--name &lt;name&gt;] [--on &lt;on&gt;] [--to &lt;to&gt;] [--subject &lt;subject&gt;] [--url &lt;url&gt;] [--set &lt;set&gt;] [--unset &lt;unset&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>form</code></td><td>The form's alias. Required.</td></tr><tr><td><code>workflow</code></td><td>The workflow's name. Required.</td></tr><tr><td><code>--name</code></td><td>Its new name.</td></tr><tr><td><code>--on</code></td><td>When it runs: when an entry is sent, or when one is approved. One of <code>submit</code>, <code>approve</code>.</td></tr><tr><td><code>--to</code></td><td>E-mail: who it is sent to; give each.</td></tr><tr><td><code>--subject</code></td><td>E-mail: its subject.</td></tr><tr><td><code>--url</code></td><td>Send to a URL: the address entries are sent to.</td></tr><tr><td><code>--set</code></td><td>Any setting, stored as given; JSON when it parses.</td></tr><tr><td><code>--unset</code></td><td>Take a setting away.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"workflows-list\"><code>crombolo workflows list</code></h2>\n<p>The site's approval workflows. Changes nothing.</p>\n<pre><code>crombolo workflows list</code></pre>\n<h2 id=\"workflows-new\"><code>crombolo workflows new</code></h2>\n<p>Write an approval workflow with one stage, then apply it. Each run acts again.</p>\n<pre><code>crombolo workflows new &lt;alias&gt; [--name &lt;name&gt;] [--content-type &lt;content-type&gt;] [--approver &lt;approver&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The workflow's alias. Required.</td></tr><tr><td><code>--name</code></td><td>The workflow's name.</td></tr><tr><td><code>--content-type</code></td><td>A content type it covers.</td></tr><tr><td><code>--approver</code></td><td>A user group who approve; editors when absent.</td></tr></tbody></table>\n<h2 id=\"workflows-remove\"><code>crombolo workflows remove</code></h2>\n<p>Remove an approval workflow; the requests waiting on it are withdrawn. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workflows remove &lt;alias&gt; [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The workflow's alias. Required.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"workflows-show\"><code>crombolo workflows show</code></h2>\n<p>One approval workflow: what it covers, its rules and its stages. Changes nothing.</p>\n<pre><code>crombolo workflows show &lt;alias&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The workflow's alias. Required.</td></tr></tbody></table>\n<h2 id=\"workflows-stage-add\"><code>crombolo workflows stage add</code></h2>\n<p>Add a stage to an approval workflow. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workflows stage add &lt;workflow&gt; &lt;stage&gt; [--name &lt;name&gt;] --approver &lt;approver&gt; [--required &lt;required&gt;] [--after &lt;after&gt;] [--next &lt;next&gt;] [--send-back &lt;send-back&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workflow</code></td><td>The workflow's alias. Required.</td></tr><tr><td><code>stage</code></td><td>The stage's alias. Required.</td></tr><tr><td><code>--name</code></td><td>Its name.</td></tr><tr><td><code>--approver</code></td><td>A user group who approve it. Required.</td></tr><tr><td><code>--required</code></td><td>How many must approve: one, majority, all, or a number.</td></tr><tr><td><code>--after</code></td><td>A stage it follows.</td></tr><tr><td><code>--next</code></td><td>A stage that follows it.</td></tr><tr><td><code>--send-back</code></td><td>Where it sends back to: editor, or a stage before it.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"workflows-stage-remove\"><code>crombolo workflows stage remove</code></h2>\n<p>Remove a stage from an approval workflow. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workflows stage remove &lt;workflow&gt; &lt;stage&gt; [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workflow</code></td><td>The workflow's alias. Required.</td></tr><tr><td><code>stage</code></td><td>The stage's alias. Required.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr><tr><td><code>--no-apply</code></td><td>Change it, and leave applying it to `crombolo types sync`.</td></tr></tbody></table>\n<h2 id=\"workflows-stage-update\"><code>crombolo workflows stage update</code></h2>\n<p>Change an approval workflow's stage. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo workflows stage update &lt;workflow&gt; &lt;stage&gt; [--name &lt;name&gt;] [--approver &lt;approver&gt;] [--add-approver &lt;add-approver&gt;] [--remove-approver &lt;remove-approver&gt;] [--required &lt;required&gt;] [--next &lt;next&gt;] [--send-back &lt;send-back&gt;] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>workflow</code></td><td>The workflow's alias. R