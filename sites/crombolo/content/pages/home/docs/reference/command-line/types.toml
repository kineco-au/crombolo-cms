;remove-content-type&gt;] [--header &lt;header&gt;] [--remove-header &lt;remove-header&gt;] [--dry-run]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>alias</code></td><td>The webhook's alias. Required.</td></tr><tr><td><code>--name</code></td><td>Its name; &quot;&quot; for none.</td></tr><tr><td><code>--description</code></td><td>Its description; &quot;&quot; for none.</td></tr><tr><td><code>--url</code></td><td>Where it is sent.</td></tr><tr><td><code>--enabled</code></td><td>It is sent; --no-enabled turns it off.</td></tr><tr><td><code>--event</code></td><td>An event that sends it too.</td></tr><tr><td><code>--remove-event</code></td><td>An event that no longer sends it.</td></tr><tr><td><code>--content-type</code></td><td>Send it for pages of this type too.</td></tr><tr><td><code>--remove-content-type</code></td><td>Stop sending it for pages of this type.</td></tr><tr><td><code>--header</code></td><td>A header sent with it, as Name=env:VARIABLE.</td></tr><tr><td><code>--remove-header</code></td><td>A header no longer sent.</td></tr><tr><td><code>--dry-run</code></td><td>Say what would change, and change nothing.</td></tr></tbody></table>\n<h2 id=\"site-show\"><code>crombolo site show</code></h2>\n<p>What this site is: its languages, addresses, types, forms, workflows, groups and webhooks. Changes nothing.</p>\n<pre><code>crombolo site show</code></pre>\n<h2 id=\"site-urls\"><code>crombolo site urls</code></h2>\n<p>Whether page addresses leave out the top-level page. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo site urls [--hide-top-level] [--show-top-level] [--dry-run] [--no-apply]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--hide-top-level</code></td><td>Leave the top-level page out of every address.</td></tr><tr><td><code>--show-top-level</code></td><td>Put the top-level page in every address.</td></tr><tr><td><cod