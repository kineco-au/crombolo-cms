standfirst = "The seo commands."
body = { html = "<h2 id=\"seo-set\"><code>crombolo seo set</code></h2>\n<p>Save a search and sharing value on this site. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo seo set &lt;field&gt; [&lt;value&gt;] [--file &lt;file&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>field</code></td><td>One of indexable, sitemap, siteName, titleSuffix, defaultImage, notFoundPage, robotsTxt; any case, or kebab-case. Required.</td></tr><tr><td><code>value</code></td><td>Its value.</td></tr><tr><td><code>--file</code></td><td>Read the robots file from this file.</td></tr></tbody></table>\n<h2 id=\"seo-show\"><code>crombolo seo show</code></h2>\n<p>The values every page falls back to, the robots file and the not-found page. Changes nothing.</p>\n<pre><code>crombolo seo show</code></pre>\n<h2 id=\"seo-unset\"><code>crombolo seo unset</code></h2>\n<p>Remove a value saved on this site, so the configuration or the default applies. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo seo unset &lt;field&gt;</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>field</code></td><td>One of indexable, sitemap, siteName, titleSuffix, defaultImage, notFoundPage, robotsTxt; any case, or kebab-case. Required.</td></tr></tbody></table>" }
