title = "Command line"
standfirst = "Every crombolo command: what it takes, what it changes and how it fails."
body = { html = "<p>Every command, generated from the CLI itself. Each takes <code>--help</code> for its entry here, and <code>-o json</code> for a result a script can read. <code>crombolo schema</code> prints the same description for a machine, as a <a href=\"https://clispec.dev\">clispec</a> document. A command that fails exits with a code saying why: see the <a href=\"/docs/reference/exit-codes/\">exit codes</a>.</p>\n<h2 id=\"sites\"><a href=\"/docs/reference/command-line/sites/\">Sites</a></h2>\n<p>Create a site, start it, check on it, and describe the command line to a script.</p>\n<ul><li><a href=\"/docs/reference/command-line/sites/#init\"><code>crombolo init</code></a></li><li><a href=\"/docs/reference/command-line/sites/#start\"><code>crombolo start</code></a></li><li><a href=\"/docs/reference/command-line/sites/#status\"><code>crombolo status</code></a></li><li><a href=\"/docs/reference/command-line/sites/#health\"><code>crombolo health</code></a></li><li><a href=\"/docs/reference/command-line/sites/#generate\"><code>crombolo generate</code></a></li><li><a href=\"/docs/reference/command-line/sites/#export\"><code>crombolo export</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema\"><code>crombolo schema</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema-check\"><code>crombolo schema check</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema-export\"><code>crombolo schema export</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema-new\"><code>crombolo schema new</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema-purge\"><code>crombolo schema purge</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema-rewrite\"><code>crombolo schema rewrite</code></a></li><li><a href=\"/docs/reference/command-line/sites/#schema-sync\"><code>crombolo schema sync</code></a></li></ul>\n<h2 id=\"types\"><a href=\"/docs/reference/command-line/types/\">Content types</a></h2>\n<p>Check, apply and change the content model kept in schema/: types, languages, forms, workflows, webhooks and page addresses.</p>\n<ul><li><a href=\"/docs/reference/command-line/types/#types-check\"><code>crombolo types check</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-editors\"><code>crombolo types editors</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-export\"><code>crombolo types export</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-list\"><code>crombolo types list</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-new\"><code>crombolo types new</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-property-add\"><code>crombolo types property add</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-property-move\"><code>crombolo types property move</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-property-remove\"><code>crombolo types property remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-property-rename\"><code>crombolo types property rename</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-property-update\"><code>crombolo types property update</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-purge\"><code>crombolo types purge</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-remove\"><code>crombolo types remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-rename\"><code>crombolo types rename</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-rewrite\"><code>crombolo types rewrite</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-show\"><code>crombolo types show</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-sync\"><code>crombolo types sync</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-tab-add\"><code>crombolo types tab add</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-tab-move\"><code>crombolo types tab move</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-tab-remove\"><code>crombolo types tab remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-tab-rename\"><code>crombolo types tab rename</code></a></li><li><a href=\"/docs/reference/command-line/types/#types-update\"><code>crombolo types update</code></a></li><li><a href=\"/docs/reference/command-line/types/#languages-add\"><code>crombolo languages add</code></a></li><li><a href=\"/docs/reference/command-line/types/#languages-list\"><code>crombolo languages list</code></a></li><li><a href=\"/docs/reference/command-line/types/#languages-remove\"><code>crombolo languages remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#languages-update\"><code>crombolo languages update</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-field-add\"><code>crombolo forms field add</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-field-move\"><code>crombolo forms field move</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-field-remove\"><code>crombolo forms field remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-field-update\"><code>crombolo forms field update</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-group-add\"><code>crombolo forms group add</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-group-move\"><code>crombolo forms group move</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-group-remove\"><code>crombolo forms group remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-group-update\"><code>crombolo forms group update</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-list\"><code>crombolo forms list</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-new\"><code>crombolo forms new</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-page-add\"><code>crombolo forms page add</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-page-move\"><code>crombolo forms page move</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-page-remove\"><code>crombolo forms page remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-page-update\"><code>crombolo forms page update</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-remove\"><code>crombolo forms remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-show\"><code>crombolo forms show</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-update\"><code>crombolo forms update</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-workflow-add\"><code>crombolo forms workflow add</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-workflow-remove\"><code>crombolo forms workflow remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#forms-workflow-update\"><code>crombolo forms workflow update</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-list\"><code>crombolo workflows list</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-new\"><code>crombolo workflows new</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-remove\"><code>crombolo workflows remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-show\"><code>crombolo workflows show</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-stage-add\"><code>crombolo workflows stage add</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-stage-remove\"><code>crombolo workflows stage remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-stage-update\"><code>crombolo workflows stage update</code></a></li><li><a href=\"/docs/reference/command-line/types/#workflows-update\"><code>crombolo workflows update</code></a></li><li><a href=\"/docs/reference/command-line/types/#webhooks-events\"><code>crombolo webhooks events</code></a></li><li><a href=\"/docs/reference/command-line/types/#webhooks-list\"><code>crombolo webhooks list</code></a></li><li><a href=\"/docs/reference/command-line/types/#webhooks-new\"><code>crombolo webhooks new</code></a></li><li><a href=\"/docs/reference/command-line/types/#webhooks-remove\"><code>crombolo webhooks remove</code></a></li><li><a href=\"/docs/reference/command-line/types/#webhooks-show\"><code>crombolo webhooks show</code></a></li><li><a href=\"/docs/reference/command-line/types/#webhooks-update\"><code>crombolo webhooks update</code></a></li><li><a href=\"/docs/reference/command-line/types/#site-show\"><code>crombolo site show</code></a></li><li><a href=\"/docs/reference/command-line/types/#site-urls\"><code>crombolo site urls</code></a></li></ul>\n<h2 id=\"components\"><a href=\"/docs/reference/command-line/components/\">Components and assets</a></h2>\n<p>Create and check the templates under components/, and the styles and scripts beside them.</p>\n<ul><li><a href=\"/docs/reference/command-line/components/#components-check\"><code>crombolo components check</code></a></li><li><a href=\"/docs/reference/command-line/components/#components-gaps\"><code>crombolo components gaps</code></a></li><li><a href=\"/docs/reference/command-line/components/#components-list\"><code>crombolo components list</code></a></li><li><a href=\"/docs/reference/command-line/components/#components-new\"><code>crombolo components new</code></a></li><li><a href=\"/docs/reference/command-line/components/#assets-list\"><code>crombolo assets list</code></a></li><li><a href=\"/docs/reference/command-line/components/#assets-new\"><code>crombolo assets new</code></a></li></ul>\n<h2 id=\"content\"><a href=\"/docs/reference/command-line/content/\">Content and media</a></h2>\n<p>Pages, media, the dictionary, domains and the recycle bin.</p>\n<ul><li><a href=\"/docs/reference/command-line/content/#content-block-add\"><code>crombolo content block add</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-block-move\"><code>crombolo content block move</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-block-remove\"><code>crombolo content block remove</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-block-update\"><code>crombolo content block update</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-copy\"><code>crombolo content copy</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-delete\"><code>crombolo content delete</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-find\"><code>crombolo content find</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-move\"><code>crombolo content move</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-new\"><code>crombolo content new</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-publish\"><code>crombolo content publish</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-show\"><code>crombolo content show</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-sort\"><code>crombolo content sort</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-unpublish\"><code>crombolo content unpublish</code></a></li><li><a href=\"/docs/reference/command-line/content/#content-update\"><code>crombolo content update</code></a></li><li><a href=\"/docs/reference/command-line/content/#media-delete\"><code>crombolo media delete</code></a></li><li><a href=\"/docs/reference/command-line/content/#media-export\"><code>crombolo media export</code></a></li><li><a href=\"/docs/reference/command-line/content/#media-fetch\"><code>crombolo media fetch</code></a></li><li><a href=\"/docs/reference/command-line/content/#media-import\"><code>crombolo media import</code></a></li><li><a href=\"/docs/reference/command-line/content/#media-move\"><code>crombolo media move</code></a></li><li><a href=\"/docs/reference/command-line/content/#dictionary-export\"><code>crombolo dictionary export</code></a></li><li><a href=\"/docs/reference/command-line/content/#dictionary-import\"><code>crombolo dictionary import</code></a></li><li><a href=\"/docs/reference/command-line/content/#domains-apply\"><code>crombolo domains apply</code></a></li><li><a href=\"/docs/reference/command-line/content/#domains-clear\"><code>crombolo domains clear</code></a></li><li><a href=\"/docs/reference/command-line/content/#domains-list\"><code>crombolo domains list</code></a></li><li><a href=\"/docs/reference/command-line/content/#domains-set\"><code>crombolo domains set</code></a></li><li><a href=\"/docs/reference/command-line/content/#domains-undo\"><code>crombolo domains undo</code></a></li><li><a href=\"/docs/reference/command-line/content/#recycle-bin-empty\"><code>crombolo recycle-bin empty</code></a></li></ul>\n<h2 id=\"remotes\"><a href=\"/docs/reference/command-line/remotes/\">Remotes, pull and push</a></h2>\n<p>Sign in to another environment, and move content and schema between them.</p>\n<ul><li><a href=\"/docs/reference/command-line/remotes/#login\"><code>crombolo login</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#logout\"><code>crombolo logout</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#whoami\"><code>crombolo whoami</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-add\"><code>crombolo remote add</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-job\"><code>crombolo remote job</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-list\"><code>crombolo remote list</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-remove\"><code>crombolo remote remove</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-trust-add\"><code>crombolo remote trust add</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-trust-disable\"><code>crombolo remote trust disable</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-trust-enable\"><code>crombolo remote trust enable</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-trust-list\"><code>crombolo remote trust list</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#remote-trust-remove\"><code>crombolo remote trust remove</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#pull\"><code>crombolo pull</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#push\"><code>crombolo push</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-apply\"><code>crombolo bundle apply</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-build\"><code>crombolo bundle build</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-check-code\"><code>crombolo bundle check-code</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-deploy\"><code>crombolo bundle deploy</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-digest\"><code>crombolo bundle digest</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-disable\"><code>crombolo bundle disable</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-enable\"><code>crombolo bundle enable</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-export\"><code>crombolo bundle export</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-install\"><code>crombolo bundle install</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-list\"><code>crombolo bundle list</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-purge\"><code>crombolo bundle purge</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-revert\"><code>crombolo bundle revert</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-runs\"><code>crombolo bundle runs</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-sign\"><code>crombolo bundle sign</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-uninstall\"><code>crombolo bundle uninstall</code></a></li><li><a href=\"/docs/reference/command-line/remotes/#bundle-verify\"><code>crombolo bundle verify</code></a></li></ul>\n<h2 id=\"import\"><a href=\"/docs/reference/command-line/import/\">Importing from Umbraco</a></h2>\n<p>Bring an Umbraco site’s content types, content and media across.</p>\n<ul><li><a href=\"/docs/reference/command-line/import/#import\"><code>crombolo import</code></a></li></ul>\n<h2 id=\"users\"><a href=\"/docs/reference/command-line/users/\">Users and access</a></h2>\n<p>Back office users, the administrator’s password, API clients and the audit log.</p>\n<ul><li><a href=\"/docs/reference/command-line/users/#users-disable\"><code>crombolo users disable</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-enable\"><code>crombolo users enable</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-export\"><code>crombolo users groups export</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-list\"><code>crombolo users groups list</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-new\"><code>crombolo users groups new</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-permissions\"><code>crombolo users groups permissions</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-remove\"><code>crombolo users groups remove</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-sections\"><code>crombolo users groups sections</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-show\"><code>crombolo users groups show</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-groups-update\"><code>crombolo users groups update</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-invite\"><code>crombolo users invite</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-list\"><code>crombolo users list</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-reset-2fa\"><code>crombolo users reset-2fa</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-reset-password\"><code>crombolo users reset-password</code></a></li><li><a href=\"/docs/reference/command-line/users/#users-unlock\"><code>crombolo users unlock</code></a></li><li><a href=\"/docs/reference/command-line/users/#admin-reset-password\"><code>crombolo admin reset-password</code></a></li><li><a href=\"/docs/reference/command-line/users/#api-client-rotate\"><code>crombolo api-client rotate</code></a></li><li><a href=\"/docs/reference/command-line/users/#audit-list\"><code>crombolo audit list</code></a></li><li><a href=\"/docs/reference/command-line/users/#audit-stream\"><code>crombolo audit stream</code></a></li></ul>\n<h2 id=\"operations\"><a href=\"/docs/reference/command-line/operations/\">Operations</a></h2>\n<p>Caches, the search index, maintenance pauses, outgoing changes, upgrades and restarts.</p>\n<ul><li><a href=\"/docs/reference/command-line/operations/#cache-rebuild\"><code>crombolo cache rebuild</code></a></li><li><a href=\"/docs/reference/command-line/operations/#index-list\"><code>crombolo index list</code></a></li><li><a href=\"/docs/reference/command-line/operations/#index-rebuild\"><code>crombolo index rebuild</code></a></li><li><a href=\"/docs/reference/command-line/operations/#maintenance-pause\"><code>crombolo maintenance pause</code></a></li><li><a href=\"/docs/reference/command-line/operations/#maintenance-resume\"><code>crombolo maintenance resume</code></a></li><li><a href=\"/docs/reference/command-line/operations/#maintenance-status\"><code>crombolo maintenance status</code></a></li><li><a href=\"/docs/reference/command-line/operations/#events-failed\"><code>crombolo events failed</code></a></li><li><a href=\"/docs/reference/command-line/operations/#events-retry\"><code>crombolo events retry</code></a></li><li><a href=\"/docs/reference/command-line/operations/#events-status\"><code>crombolo events status</code></a></li><li><a href=\"/docs/reference/command-line/operations/#upgrade\"><code>crombolo upgrade</code></a></li><li><a href=\"/docs/reference/command-line/operations/#upgrade-check\"><code>crombolo upgrade check</code></a></li><li><a href=\"/docs/reference/command-line/operations/#upgrade-ledger\"><code>crombolo upgrade ledger</code></a></li><li><a href=\"/docs/reference/command-line/operations/#upgrade-schema\"><code>crombolo upgrade schema</code></a></li><li><a href=\"/docs/reference/command-line/operations/#restart\"><code>crombolo restart</code></a></li></ul>" }
