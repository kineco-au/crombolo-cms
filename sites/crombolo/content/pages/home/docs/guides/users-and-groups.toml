title = "Users and groups"
standfirst = "Groups and what they may do, inviting the people in them, approval workflows that ask a group to sign a page off, and webhooks that tell other systems what changed."
body = { html = "<p>The people who work in the back office are users, and what they may do comes from the groups they are in. A group&#39;s name, sections, permissions and languages are part of the site&#39;s definitions: built with commands and kept in files you commit. Who is in each group, and where in the tree they start, stay with each environment.</p>\n<h2 id=\"groups\">Groups</h2>\n<pre><code class=\"language-sh\">bunx crombolo users groups new editors --name Editors --section content --section media \\\n  --permission content:read --permission content:update --permission content:publish \\\n  --language all\nbunx crombolo users groups show editors\nbunx crombolo users groups list\n</code></pre>\n<p>A section is a part of the back office a group may open, and a permission is what it may do there. To see the choices:</p>\n<pre><code class=\"language-sh\">bunx crombolo users groups sections       # each section, and what it holds\nbunx crombolo users groups permissions    # each permission, and what it allows\n</code></pre>\n<p>A permission is named for its area and its action: <code>content:publish</code> publishes pages, <code>library:publish</code> publishes Library items, <code>media:update</code> changes media, <code>forms:manage</code> designs forms and <code>form-entries:view</code> reads their entries. A bare <code>publish</code> is refused with the areas it could mean. The names the back office keeps, such as <code>Umb.Document.Publish</code>, are accepted too; <code>users groups permissions --verbs</code> shows each one.</p>\n<h2 id=\"changing-a-group\">Changing a group</h2>\n<pre><code class=\"language-sh\">bunx crombolo users groups update editors --permission content:delete --remove-section media\nbunx crombolo users groups update translators --no-all-languages --language fr-FR\nbunx crombolo users groups export marketing           # a group made in the back office becomes the site&#39;s\nbunx crombolo users groups remove reviewers --move-users-to editors\n</code></pre>\n<p>A group made in the back office is listed as such, and is changed from the command line once <code>users groups export</code> has made it one of the site&#39;s. A group with users in it is removed only with <code>--move-users-to</code>, which moves them first. The administrators group stays with each environment.</p>\n<h2 id=\"users\">Users</h2>\n<pre><code class=\"language-sh\">bunx crombolo users invite sam@example.com --name &quot;Sam Lee&quot; --group editors\nbunx crombolo users list\nbunx crombolo users disable sam@example.com\nbunx crombolo users enable sam@example.com\n</code></pre>\n<p><code>invite</code> creates the user and prints the link they set their password with, so it works on a site with no e-mail. The link is used once, and expires as an invitation does. <code>users reset-password</code> gives a user a new password and ends their sessions, and <code>users unlock</code> lets them in again after too many tries.</p>\n<h2 id=\"approval-workflows\">Approval workflows</h2>\n<p>A workflow asks one or more groups to approve a page before it is published:</p>\n<pre><code class=\"language-sh\">bunx crombolo workflows new article-sign-off --name &quot;Article sign-off&quot; \\\n  --content-type article --approver editors\nbunx crombolo workflows stage add article-sign-off legal --approver legal --required all\nbunx crombolo workflows stage update article-sign-off legal --send-back editor\nbunx crombolo workflows update article-sign-off --self-approval refused --scheduling\nbunx crombolo workflows show article-sign-off\n</code></pre>\n<p>A workflow covers the content types and branches it names. Its stages run in order: a new stage follows the last ones unless <code>--after</code> names others, its approvers are groups the site has, and <code>--required</code> says how many of them must approve. A stage sends a page back to its editor, or to a stage before it.</p>\n<p><code>workflows list</code> shows each workflow and what is waiting on it. Removing one withdraws the requests waiting on it, and says how many. A page under a workflow is sent for approval from its <strong>Workflow</strong> tab in the back office; <code>content publish --skip-approval</code> publishes it anyway, and the audit log records who did.</p>\n<h2 id=\"webhooks\">Webhooks</h2>\n<p>A webhook tells another system when something changes:</p>\n<pre><code class=\"language-sh\">bunx crombolo webhooks new searchIndex --url https://search.example/hook \\\n  --event content-published --event content-unpublished --content-type article\nbunx crombolo webhooks update searchIndex --header Authorization=env:SEARCH_TOKEN\nbunx crombolo webhooks update searchIndex --no-enabled\nbunx crombolo webhooks events\n</code></pre>\n<p><code>webhooks events</code> lists the events by name, such as <code>content-published</code> and <code>media-deleted</code>. A header&#39;s value is given as <code>env:NAME</code>, with <code>NAME</code> set on the server, so a secret is never kept with the site. A change is used from the next delivery, with nothing to apply.</p>\n<p>Every change in this guide is checked before anything is written, and takes <code>--dry-run</code> and <code>-o json</code>.</p>\n<h2 id=\"where-next\">Where next</h2>\n<ul>\n<li><a href=\"/docs/guides/forms/\">Forms</a>: forms, and who reads their entries.</li>\n<li><a href=\"/docs/reference/command-line/users/\">The <code>users</code> commands</a>, with every flag.</li>\n</ul>" }
