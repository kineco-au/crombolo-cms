standfirst = "A page for each template: what is in it, and how to create and start it."
body = { html = "<p>Each template is a site to start from: its types, views, styles and starting content. <code>init --template</code> scaffolds one into an empty folder.</p>\n<p>| Template | What it is |</p>\n<p>| --- | --- |</p>\n<p>| <a href=\"/docs/getting-started/templates/basic/\">Basic</a> | a home page type, one view and one published page |</p>\n<p>| <a href=\"/docs/getting-started/templates/next/\">Next.js</a> | an empty site with a Next.js front end in web/, wired for preview, revalidation and member sign-in |</p>\n<p>| <a href=\"/docs/getting-started/templates/demo-crombolo/\">Crombolo</a> | a full site about Crombolo, in English and Spanish: a home page built from blocks, features filtered by category, people from the Library, a blog with tags and paging, search, and a contact form |</p>\n<p>| <a href=\"/docs/getting-started/templates/demo-harbourstone/\">Harbourstone Distillery</a> | a coastal distillery: a range with tasting-note elements, reusable highlights, a contact form, photographs and a stylesheet |</p>\n<p>| <a href=\"/docs/getting-started/templates/demo-harbourstone-next/\">Harbourstone Distillery (Next.js)</a> | the Harbourstone distillery with a Next.js front end in web/: the same content, drafts in Draft Mode, a cache cleared by webhook, and a comparison of the bottlings chosen in the browser |</p>\n<p>| <a href=\"/docs/getting-started/templates/demo-plain-signal/\">Plain Signal</a> | an AI magazine for everyone: sections, articles with photographs and their credits, a sub-editor and editor approval workflow, and a contact form drawn by an island |</p>\n<p>| <a href=\"/docs/getting-started/templates/starter/\">Starter</a> | a header, a footer and a two-column page layout with placeholder text, ready to restyle |</p>\n<p>To list them from the command line:</p>\n<pre><code class=\"language-sh\">bunx @crombolo/cli@latest init --template list\n</code></pre>" }
generatedFrom = "the templates the command line offers"
