body = { html = "<p>Crombolo: a full site about Crombolo, in English and Spanish: a home page built from blocks, features filtered by category, people from the Library, a blog with tags and paging, search, and a contact form.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir crombolo &amp;&amp; cd crombolo\nbunx @crombolo/cli@latest init --template demo/crombolo\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun start\n</code></pre>\n<p>The site is served on <a href=\"http://localhost:8080/\">http://localhost:8080/</a>.</p>\n<p>The first start applies the template&#39;s content and publishes it. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<ul>\n<li>a site about Crombolo in English and Spanish: a home page built from blocks, features filtered by category, a people page, a blog with tags and paging, an about page, search and a contact form;</li>\n<li>people kept in the Library, a menu in the header, a dictionary for the words the views print, and site settings in the footer;</li>\n<li>search and sharing details, a sitemap, and a language switch on every page.</li>\n</ul>\n<p>The people and the quote are invented, and the photographs are public domain.</p>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p><code>components/blocks/</code> holds a view for each block, and <code>content/pages/home.toml</code> shows a page made of them. <code>schema/languages.toml</code> and <code>domains.toml</code> set up Spanish at <code>/es</code>, and <code>bunx crombolo types show blogPost</code> shows how a post is put together.</p>" }
