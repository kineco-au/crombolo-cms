body = { html = "<p>Plain Signal: an AI magazine for everyone: sections, articles with photographs and their credits, a sub-editor and editor approval workflow, and a contact form drawn by an island.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir plain-signal &amp;&amp; cd plain-signal\nbunx @crombolo/cli@latest init --template demo/plain-signal\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun start\n</code></pre>\n<p>The site is served on <a href=\"http://localhost:8080/\">http://localhost:8080/</a>.</p>\n<p>The first start applies the template&#39;s content and publishes it. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<ul>\n<li>a magazine about AI for everyone: sections, and articles with photographs and their credits;</li>\n<li>an approval workflow, where a sub-editor and then an editor sign an article off before it is published;</li>\n<li>a contact form drawn by an island, a part of the page that runs in the browser.</li>\n</ul>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p><code>bunx crombolo workflows show articleApproval</code> shows the sign-off, and <code>components/shared/</code> holds the article list and the contact form island.</p>" }
