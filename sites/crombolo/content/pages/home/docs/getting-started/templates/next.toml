body = { html = "<p>Next.js: an empty site with a Next.js front end in web/, wired for preview, revalidation and member sign-in.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir next &amp;&amp; cd next\nbunx @crombolo/cli@latest init --template next\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun run dev\n</code></pre>\n<p>This runs the CMS on <a href=\"http://localhost:8080/\">http://localhost:8080/</a> and the Next.js front end in <code>web/</code> on <a href=\"http://localhost:3000/\">http://localhost:3000/</a>.</p>\n<p>The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<ul>\n<li>an empty site: no types or pages yet;</li>\n<li>a Next.js app in <code>web/</code>, wired to the CMS for preview, cache revalidation when a page is published, and member sign-in.</li>\n</ul>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p>Add a type and a page from the command line (<a href=\"/docs/getting-started/from-the-command-line/\">A site from the command line</a>), then render it in <code>web/app/</code>. The app reads the site through the Delivery API with <code>@crombolo/delivery-client</code>.</p>" }
generatedFrom = "the template’s manifest and its TEMPLATE.md"
