body = { html = "<p>Starter: a header, a footer and a two-column page layout with placeholder text, ready to restyle.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir starter &amp;&amp; cd starter\nbunx @crombolo/cli@latest init --template starter\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun start\n</code></pre>\n<p>The site is served on <a href=\"http://localhost:8080/\">http://localhost:8080/</a>.</p>\n<p>The first start applies the template&#39;s content and publishes it. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<ul>\n<li>a content page and a search page type;</li>\n<li>a header, a footer and a two-column page layout in <code>components/</code>, with placeholder text;</li>\n<li>a home page with About, Contact and Search pages beneath it.</li>\n</ul>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p>Restyle <code>components/shared/</code> and the stylesheet in <code>css/</code>, then replace the placeholder text in the back office or with <code>crombolo content update</code>.</p>" }
