body = { html = "<p>Basic: a Content Page type with a title, an image and a description, its template, and a published welcome page; what a plain init gives you.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir basic &amp;&amp; cd basic\nbunx @crombolo/cli@latest init --template basic\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun start\n</code></pre>\n<p>The site is served on <a href=\"http://localhost:8080/\">http://localhost:8080/</a>.</p>\n<p>The first start applies the template&#39;s content and publishes it. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<p>What a plain <code>crombolo init</code> gives you:</p>\n<ul>\n<li>one content type, <code>contentPage</code>, with a title, an image and a description;</li>\n<li>its template, <code>components/contentPage.tsx</code>;</li>\n<li>one published page, the home page, welcoming you to Crombolo, as a content file in <code>content/pages/</code>;</li>\n<li>the Crombolo logo, the home page&#39;s image, in <code>content/media/</code>.</li>\n</ul>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p>Open <code>components/contentPage.tsx</code> and change what the page shows, then add types and pages from the command line: <a href=\"/docs/getting-started/from-the-command-line/\">A site from the command line</a> goes from here. <code>crombolo init --empty</code> starts with none of this.</p>" }
