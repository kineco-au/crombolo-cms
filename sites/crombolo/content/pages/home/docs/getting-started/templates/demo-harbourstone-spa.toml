standfirst = "crombolo init --template demo/harbourstone-spa"
body = { html = "<p>Harbourstone Distillery (single-page app): the Harbourstone distillery as a single-page app in web/, built with Next.js and run in the browser: the same content read from the APIs, members signing in from the app, drafts shown by the Preview button, and a static build to host anywhere.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir harbourstone-spa &amp;&amp; cd harbourstone-spa\nbunx @crombolo/cli@latest init --template demo/harbourstone-spa\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun run dev\n</code></pre>\n<p>This runs the CMS on <a href=\"http://localhost:8080/\">http://localhost:8080/</a> and the single-page app in <code>web/</code> on <a href=\"http://localhost:3001/\">http://localhost:3001/</a>.</p>\n<p>The first start applies the template&#39;s content and publishes it. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"the-bundles-it-brings\">The bundles it brings</h2>\n<ul>\n<li><code>@crombolo/simple-redirects</code></li>\n</ul>\n<p>They are installed with the site, and wired in its <code>crombolo.config.ts</code>.</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<ul>\n<li>the same Harbourstone content as the distillery template, with a members&#39; cellar only members see;</li>\n<li>a single-page app in <code>web/</code>, built with Next.js as static files: every page is read from the site in the browser, so a change shows as soon as it is published, with no rebuild;</li>\n<li>members signing in from the app, drafts shown by the Preview button, and the contact form posted straight to the site;</li>\n<li>the simple redirects bundle.</li>\n</ul>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p><code>web/components/app.tsx</code> turns the address into a page. The site itself draws only the page members sign in on, in <code>components/</code>. <code>bun run members</code> makes the Members page members-only, and <code>bun run dev</code> runs it for you; add a member in the back office&#39;s Members section, in the Members group, to sign in as.</p>\n<p>To host the app, <code>cd web &amp;&amp; bun run build</code> writes it to <code>web/out</code>: put that folder on any static host that answers an address with no file of its own with <code>index.html</code>, as <code>bun serve.ts</code> does. Search engines see only what runs JavaScript, so a site that needs them is better served by the Next.js version, <code>demo/harbourstone-next</code>.</p>" }
generatedFrom = "the template’s manifest and its TEMPLATE.md"
