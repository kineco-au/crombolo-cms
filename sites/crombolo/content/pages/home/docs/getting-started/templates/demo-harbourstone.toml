body = { html = "<p>Harbourstone Distillery: a coastal distillery: a range with tasting-note elements, reusable highlights, a contact form, photographs and a stylesheet.</p>\n<h2 id=\"create-it\">Create it</h2>\n<pre><code class=\"language-sh\">mkdir harbourstone &amp;&amp; cd harbourstone\nbunx @crombolo/cli@latest init --template demo/harbourstone\nbun install\n</code></pre>\n<h2 id=\"start-it\">Start it</h2>\n<pre><code class=\"language-sh\">bun start\n</code></pre>\n<p>The site is served on <a href=\"http://localhost:8080/\">http://localhost:8080/</a>.</p>\n<p>The first start applies the template&#39;s content and publishes it. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in (<a href=\"/docs/getting-started/#sign-in\">Getting started</a>).</p>\n<h2 id=\"the-bundles-it-brings\">The bundles it brings</h2>\n<ul>\n<li><code>@crombolo/simple-redirects</code></li>\n</ul>\n<p>They are installed with the site, and wired in its <code>crombolo.config.ts</code>.</p>\n<h2 id=\"what-is-in-it\">What is in it</h2>\n<ul>\n<li>a coastal distillery&#39;s brochure site: a home page, an about page, its bottlings with tasting notes, a comparison of bottlings, search, and a contact page;</li>\n<li>reusable highlights kept in the Library, and a highlight block (<code>components/blocks/highlight.tsx</code>);</li>\n<li>a contact form, photographs with their credits, and a stylesheet;</li>\n<li>the simple redirects bundle.</li>\n</ul>\n<h2 id=\"where-to-look-first\">Where to look first</h2>\n<p><code>components/pages/</code> holds a view for each page type. <code>bunx crombolo site show</code> lists its types, forms and groups, and <code>bunx crombolo types show expression</code> shows how a bottling is put together.</p>" }
