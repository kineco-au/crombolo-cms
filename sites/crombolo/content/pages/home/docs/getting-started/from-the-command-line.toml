[values]
title = "A site from the command line"
standfirst = "Build a small bakery site with commands alone, from an empty folder to pages served, a contact form, an editors' group, an approval workflow, a webhook and a bundle to ship."
body = { html = "<p>This walk builds a small site for a bakery. Every step is a command, and each one is checked against the site before it changes anything. The site&#39;s definitions are kept as files under <code>schema/</code>, which you commit with the rest of the site, but you never need to open them.</p>\n<p>The same steps run on every build of Crombolo, as a test, so what you see here is what happens.</p>\n<h2 id=\"an-empty-site\">An empty site</h2>\n<pre><code class=\"language-sh\">mkdir riverside-bakery &amp;&amp; cd riverside-bakery\nbunx @crombolo/cli@latest init --name &quot;Riverside Bakery&quot;\nbun install\n</code></pre>\n<p><code>init</code> says what it set up and what to run next. A SQLite database is made the first time a command needs one, so there is nothing else to install.</p>\n<p>From here on, <code>bunx crombolo</code> runs the command line the site installed.</p>\n<h2 id=\"the-types\">The types</h2>\n<p>A type says what a page or block holds. Start with the pieces: a short text, and a &quot;highlight&quot; block with a heading. A block is an element type, so it comes before the list that offers it. A new element type starts empty, and is not offered in the Library unless you add <code>--library</code>.</p>\n<pre><code class=\"language-sh\">bunx crombolo types new data-type shortText --editor textstring --max-chars 80\n\nbunx crombolo types new content-type highlight --element --name Highlight --no-view\nbunx crombolo types property add highlight heading --type shortText --name Heading\n\nbunx crombolo types new data-type pageBlocks --editor block-list --block highlight\n</code></pre>\n<p>Then the page. A content page starts with a mandatory title. Give it a list of blocks, and let pages sit beneath it:</p>\n<pre><code class=\"language-sh\">bunx crombolo types new content-type contentPage --name &quot;Content page&quot; --at-root\nbunx crombolo types property add contentPage blocks --type pageBlocks --name Blocks\nbunx crombolo types update contentPage --allow-child contentPage\n</code></pre>\n<p>Each command is checked and applied at once, and says what it did:</p>\n<pre><code class=\"language-text\">  The content type &quot;Content page&quot; gains &quot;blocks&quot; (pageBlocks) in the tab &quot;Content&quot;.\n  schema   applied 1.0.0: created 0 type(s), 1 property, 0 data type(s), 0 language(s)\n</code></pre>\n<p><code>bunx crombolo types show contentPage</code> shows a type and what uses it. A type composed of another, with <code>--compose</code>, takes its properties and shows each one with where it comes from.</p>\n<h2 id=\"the-views\">The views</h2>\n<p>Views are code, and you write them as code. <code>types new</code> wrote <code>components/contentPage.tsx</code> for the page type. <code>components new</code> writes one for the block:</p>\n<pre><code class=\"language-sh\">bunx crombolo components new --block highlight\nbunx crombolo generate\n</code></pre>\n<p><code>generate</code> writes the model types your views are checked against. Change <code>components/contentPage.tsx</code> to show the title and the blocks:</p>\n<pre><code class=\"language-tsx\">import { Blocks, type PageProps } from &#39;@crombolo/crombolo&#39;\n\nexport default function ContentPage({ model }: PageProps) {\n  return (\n    &lt;main&gt;\n      &lt;h1&gt;{model.text(&#39;title&#39;)}&lt;/h1&gt;\n      &lt;Blocks items={model.value(&#39;blocks&#39;)} /&gt;\n    &lt;/main&gt;\n  )\n}\n</code></pre>\n<p>A view can pick one block out by its alias too: <code>model.value(&#39;blocks&#39;)?.byAlias(&#39;sourdough&#39;)</code>.</p>\n<h2 id=\"a-form-a-group-a-workflow-and-a-webhook\">A form, a group, a workflow and a webhook</h2>\n<p>A contact form, with a field for the message, picked on the page:</p>\n<pre><code class=\"language-sh\">bunx crombolo forms new contact --name &quot;Contact us&quot;\nbunx crombolo forms field add contact message --type long-answer --caption Message --mandatory\nbunx crombolo types property add contentPage contactForm --type formPicker --name &quot;Contact form&quot;\n</code></pre>\n<p>A group for the people who edit the site, and a workflow that asks one of them to approve a page before it is published:</p>\n<pre><code class=\"language-sh\">bunx crombolo users groups new editors --name Editors --section content \\\n  --permission content:read --permission content:publish --language all\nbunx crombolo workflows new sign-off --content-type contentPage --approver editors\n</code></pre>\n<p><code>bunx crombolo users groups permissions</code> lists the permissions a group can hold, and <code>bunx crombolo users groups sections</code> the sections it can open. A permission is named for its area and what it allows, such as <code>content:publish</code> or <code>media:update</code>.</p>\n<p>A webhook, sent whenever a page is published:</p>\n<pre><code class=\"language-sh\">bunx crombolo webhooks new published --url https://example.test/hook --event content-published\n</code></pre>\n<p><code>bunx crombolo webhooks events</code> lists the events.</p>\n<h2 id=\"the-pages\">The pages</h2>\n<p>Pages are written to the site&#39;s database, as the back office writes them. Values take the same shorthand content files use: Markdown for rich text, a path for a picked page.</p>\n<pre><code class=\"language-sh\">bunx crombolo content new /Home --type contentPage --set title=&quot;Riverside Bakery&quot;\nbunx crombolo content block add /Home blocks --type highlight --alias sourdough \\\n  --set heading=Sourdough\nbunx crombolo content new &quot;/Home/Visit us&quot; --type contentPage \\\n  --set title=&quot;Visit us&quot; --set contactForm=contact\nbunx crombolo content show /Home\n</code></pre>\n<p>A block is named by its alias, here <code>sourdough</code>, or by its key. <code>content block update</code>, <code>move</code> and <code>remove</code> take the same names.</p>\n<p>The home page is under the sign-off workflow, so publishing it waits for an editor&#39;s approval. To publish it now, and have the audit log record that you did:</p>\n<pre><code class=\"language-sh\">bunx crombolo content publish /Home --descendants --skip-approval\n</code></pre>\n<h2 id=\"served\">Served</h2>\n<pre><code class=\"language-sh\">bunx crombolo site show\nbun start\n</code></pre>\n<p><code>site show</code> is the whole site in one place: its languages, addresses, types, forms, workflows, groups and webhooks. <code>bun start</code> serves it on <a href=\"http://localhost:8080/\">http://localhost:8080/</a>, with the home page at <code>/</code> and its child at <code>/visit-us</code>. The back office is at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>, and the start prints how to sign in.</p>\n<h2 id=\"shipped\">Shipped</h2>\n<p>A bundle carries the site&#39;s definitions, views and content to another site. Pages made by command live in the database, so export them as content files first:</p>\n<pre><code class=\"language-sh\">bunx crombolo bundle export --source --root /Home\nbunx crombolo bundle build . --out ../bakery-bundle\n</code></pre>\n<p>When the definitions have changed since their version was first applied, <code>bundle build</code> raises the version, so a production site takes the change.</p>\n<p>On the other site, <code>start</code> applies the bundle, then serves the same pages:</p>\n<pre><code class=\"language-sh\">bunx crombolo start --bundle ../bakery-bundle --publish --replace-files\n</code></pre>\n<p><code>--replace-files</code> lets the bundle&#39;s definitions take the place of a new site&#39;s starting ones. To replace a whole environment from here instead, use <code>bunx crombolo push</code>; see <a href=\"/docs/guides/remotes/\">Remotes</a> and <a href=\"/docs/guides/deploying/\">Deploying</a>.</p>\n<h2 id=\"what-you-committed\">What you committed</h2>\n<pre><code class=\"language-text\">schema/        the site&#39;s definitions: types, forms, groups, workflows, webhooks\ncomponents/    its views\ncontent/       its pages, exported as content files\n</code></pre>\n<p>The files are readable, and a change to them shows in a review like any other code. Editing one by hand works too: it is checked, and applied, exactly as a command&#39;s change is.</p>" }
