title = "Templates in TSX, schema in Git, one runtime"
standfirst = "Crombolo keeps the back office your editors know and rebuilds everything behind it in TypeScript on Bun. Here is what that means for you, and how to get started."
codeHeading = "Templates are typed components"
codeIntro = "Write pages as React-style TSX components. They render to HTML on the server, with no React runtime and no hydration, and your changes show up without a restart."
codeSample = "import type { PageProps } from '@crombolo/crombolo'\nimport { Layout } from '../shared/layout.tsx'\n\nexport default function Article({ model, nav }: PageProps) {\n  return (\n    <Layout model={model} nav={nav}>\n      <h1>{model.text('title')}</h1>\n      {model.html('bodyText')}\n    </Layout>\n  )\n}"
