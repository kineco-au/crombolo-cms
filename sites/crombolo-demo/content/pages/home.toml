type = "homePage"
name = { "en-US" = "Home", "es-ES" = "Inicio" }

[values.en-US]
title = "Crombolo"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "A tour of Crombolo", heading = "Work on the next version of your site while this one stays live", text = "Change as many pages as the job needs, and see how the site will look before anyone else does. Publish when it's ready, with sign-off where it's needed.", image = "/blueprint-plan.jpg", primaryLink = [{ path = "/home/features", name = "See the features" }], secondaryLink = [{ path = "/home/developers", name = "For developers" }] } }, { type = "featureRowBlock", alias = "familiar", values = { heading = "A back office that feels familiar", text = { html = "<p>An Umbraco-inspired back office, so you'll feel at home: the page tree, drafts, previews, image cropping and page history.</p>" }, image = "/library-shelves.jpg" } }, { type = "featureRowBlock", alias = "workspace", values = { heading = "Your own space to work in", text = { html = "<p>A workspace is your own space to safely edit in. Change pages, media and translations, and preview your changes until you're ready to publish.</p>" }, image = "/drafting-compass.jpg", link = [{ path = "/home/features/workspaces", name = "About workspaces" }] } }, { type = "featureRowBlock", alias = "share", values = { heading = "Show it to your colleagues", text = { html = "<p>Share your workspace with the people who need to see it, and let them click through the site as it will look.</p>" }, image = "/compass-map.jpg" } }, { type = "featureRowBlock", alias = "publish", values = { heading = "Publish when it's ready", text = { html = "<p>Pages that need sign-off go for approval, and pages set to go live on a date keep that date. If someone else changed the same page in the meantime, you choose which version of each part to keep.</p>" }, image = "/archive-binders.jpg", link = [{ path = "/home/features/publishing-and-approvals", name = "About publishing" }] } }, { type = "featureRowBlock", alias = "blocks", values = { heading = "Build pages without a developer", text = { html = "<p>Arrange banners, text, images, quotes and buttons in whatever order the page needs. This page is made that way.</p>" }, image = "/letterpress-alphabet.jpg", link = [{ path = "/home/features/blocks", name = "About building pages" }] } }, { type = "quoteBlock", alias = "quote", values = { quote = "We rebuilt the whole pricing section in a workspace over two weeks. The live site never noticed.", attribution = "An invented editor, for this demo" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "See it for yourself", text = "Ask us for a tour of the back office.", link = [{ path = "/home/contact", name = "Get in touch" }] } }]
intro = "Crombolo gives editors a back office that feels familiar, and a space of their own for every piece of work."

[values.es-ES]
title = "Crombolo"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "Una visita a Crombolo", heading = "Trabaja en la próxima versión de tu sitio mientras esta sigue publicada", text = "Cambia tantas páginas como requiera el trabajo y mira cómo quedará el sitio antes que nadie. Publica cuando esté listo, con aprobación donde haga falta.", image = "/blueprint-plan.jpg", primaryLink = [{ path = "/home/features", name = "Ver las funciones" }], secondaryLink = [{ path = "/home/developers", name = "Para desarrolladores" }] } }, { type = "featureRowBlock", alias = "familiar", values = { heading = "Un panel que te resultará familiar", text = { html = "<p>Un panel inspirado en Umbraco, así que te sentirás como en casa: el árbol de páginas, los borradores, las vistas previas, el recorte de imágenes y el historial de cada página.</p>" }, image = "/library-shelves.jpg" } }, { type = "featureRowBlock", alias = "workspace", values = { heading = "Tu propio espacio de trabajo", text = { html = "<p>Un espacio de trabajo es tu propio lugar para editar con tranquilidad. Cambia páginas, medios y traducciones, y revisa tus cambios hasta que estés listo para publicar.</p>" }, image = "/drafting-compass.jpg", link = [{ path = "/home/features/workspaces", name = "Sobre los espacios de trabajo" }] } }, { type = "featureRowBlock", alias = "share", values = { heading = "Enséñaselo a tus compañeros", text = { html = "<p>Comparte tu espacio de trabajo con quien tenga que verlo y deja que recorra el sitio tal como quedará.</p>" }, image = "/compass-map.jpg" } }, { type = "featureRowBlock", alias = "publish", values = { heading = "Publica cuando esté listo", text = { html = "<p>Las páginas que necesitan aprobación se envían para aprobarlas, y las que tienen fecha de publicación la conservan. Si otra persona cambió la misma página mientras tanto, eliges qué versión de cada parte quieres conservar.</p>" }, image = "/archive-binders.jpg", link = [{ path = "/home/features/publishing-and-approvals", name = "Sobre la publicación" }] } }, { type = "featureRowBlock", alias = "blocks", values = { heading = "Crea páginas sin un desarrollador", text = { html = "<p>Ordena portadas, textos, imágenes, citas y botones como necesite la página. Esta página está hecha así.</p>" }, image = "/letterpress-alphabet.jpg", link = [{ path = "/home/features/blocks", name = "Sobre cómo crear páginas" }] } }, { type = "quoteBlock", alias = "quote", values = { quote = "Rehicimos toda la sección de precios en un espacio de trabajo durante dos semanas. El sitio publicado ni se enteró.", attribution = "Una editora inventada para esta demostración" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Compruébalo tú mismo", text = "Pídenos una visita guiada por el panel.", link = [{ path = "/home/contact", name = "Escríbenos" }] } }]
intro = "Crombolo da a los editores un panel que les resultará familiar y un espacio propio para cada trabajo."
