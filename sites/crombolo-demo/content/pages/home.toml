type = "homePage"
name = { "en-US" = "Home", "es-ES" = "Inicio" }

[values.en-US]
title = "Crombolo"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "Open source, MIT licensed", heading = "Crombolo: the open source CMS for the agentic era", text = "A back office your editors already know, a command line your developers and their coding agents can drive, and a workspace for every piece of work, so nothing goes live until a person says so.", image = "/crombolo-logo.png", imageAsItIs = true, primaryLink = [{ path = "/home/editors", name = "For editors" }], secondaryLink = [{ path = "/home/developers", name = "For developers" }] } }, { type = "featureRowBlock", alias = "editors", values = { heading = "Editors keep the tools they know", text = { html = "<p>An Umbraco-inspired back office: the page tree, drafts, previews and page history, with nothing to retrain.</p>" }, image = "/page-editor.jpg", link = [{ path = "/home/editors", name = "For editors" }] } }, { type = "featureRowBlock", alias = "developers", values = { heading = "Developers and their agents work from the terminal", text = { html = "<p>Every part of a site is a <code>crombolo</code> command, and every site comes with a guide written for coding agents.</p>" }, image = "/cli-agents.jpg", link = [{ path = "/home/developers", name = "For developers" }] } }, { type = "featureRowBlock", alias = "safe", values = { heading = "Nothing goes live by accident", text = { html = "<p>Work happens in workspaces, pages that need sign-off are sent for approval, and every page a change touches can be checked before it merges.</p>" }, image = "/cli-check.jpg" } }, { type = "featureRowBlock", alias = "yours", values = { heading = "Yours to run", text = { html = "<p>Open source under the MIT licence, with no licence fees. Start on SQLite, with no database to install or configure, and move to Postgres as you grow.</p>" }, image = "/cli-status.jpg" } }, { type = "featureRowBlock", alias = "upgrades", values = { heading = "Upgrades without the drama", text = { html = "<p>Before an upgrade, Crombolo says what it will need from you, backs up your data, and helps you navigate conflicts to make the whole process friction-free.</p>" }, image = "/cli-upgrade.jpg" } }, { type = "quoteBlock", alias = "quote", values = { quote = "Our editors didn't need training, and our agents didn't need a browser.", attribution = "An invented team lead, for this demo" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Start a site in a minute", text = "One command sets up a site like this one, content and all.", link = [{ path = "/home/developers", name = "For developers" }] } }]
intro = "Crombolo is the open source CMS for the agentic era: a familiar back office for editors, a command line for developers and their coding agents, and a workspace for every piece of work."

[values.es-ES]
title = "Crombolo"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "Código abierto, con licencia MIT", heading = "Crombolo: el CMS de código abierto para la era de los agentes", text = "Un panel que tus editores ya conocen, una línea de comandos que tus desarrolladores y sus agentes de programación pueden manejar, y un espacio de trabajo para cada trabajo, para que nada se publique hasta que una persona lo diga.", image = "/crombolo-logo.png", imageAsItIs = true, primaryLink = [{ path = "/home/editors", name = "Para editores" }], secondaryLink = [{ path = "/home/developers", name = "Para desarrolladores" }] } }, { type = "featureRowBlock", alias = "editors", values = { heading = "Los editores conservan las herramientas que conocen", text = { html = "<p>Un panel inspirado en Umbraco: el árbol de páginas, los borradores, las vistas previas y el historial de cada página, sin nada que volver a aprender.</p>" }, image = "/page-editor.jpg", link = [{ path = "/home/editors", name = "Para editores" }] } }, { type = "featureRowBlock", alias = "developers", values = { heading = "Los desarrolladores y sus agentes trabajan desde la terminal", text = { html = "<p>Cada parte de un sitio es un comando <code>crombolo</code>, y cada sitio trae una guía escrita para los agentes de programación.</p>" }, image = "/cli-agents.jpg", link = [{ path = "/home/developers", name = "Para desarrolladores" }] } }, { type = "featureRowBlock", alias = "safe", values = { heading = "Nada se publica por accidente", text = { html = "<p>El trabajo se hace en espacios de trabajo, las páginas que necesitan aprobación se envían para aprobarlas, y cada página que toca un cambio se puede comprobar antes de fusionarlo.</p>" }, image = "/cli-check.jpg" } }, { type = "featureRowBlock", alias = "yours", values = { heading = "Tuyo para ejecutarlo", text = { html = "<p>Código abierto con licencia MIT, sin pagar licencias. Empieza con SQLite, sin ninguna base de datos que instalar ni configurar, y pasa a Postgres a medida que creces.</p>" }, image = "/cli-status.jpg" } }, { type = "featureRowBlock", alias = "upgrades", values = { heading = "Actualizaciones sin dramas", text = { html = "<p>Antes de una actualización, Crombolo dice qué necesitará de ti, hace una copia de seguridad de tus datos y te ayuda a resolver los conflictos para que todo el proceso vaya sin fricciones.</p>" }, image = "/cli-upgrade.jpg" } }, { type = "quoteBlock", alias = "quote", values = { quote = "Nuestros editores no necesitaron formación, y nuestros agentes no necesitaron un navegador.", attribution = "Un jefe de equipo inventado para esta demostración" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Crea un sitio en un minuto", text = "Un solo comando prepara un sitio como este, con su contenido.", link = [{ path = "/home/developers", name = "Para desarrolladores" }] } }]
intro = "Crombolo es el CMS de código abierto para la era de los agentes: un panel familiar para los editores, una línea de comandos para los desarrolladores y sus agentes, y un espacio de trabajo para cada trabajo."
