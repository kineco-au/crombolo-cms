type = "homePage"
name = { "en-US" = "Home", "es-ES" = "Inicio" }

[values.en-US]
title = "Crombolo"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "A tour of Crombolo", heading = "A CMS you can read, diff and deploy", text = "For editors: a full back office, with pages built from blocks, drafts, approvals and previews. For developers: content types in your repository and views in TSX, reviewed and deployed like the rest of your code.", image = "/blueprint-plan.jpg", primaryLink = [{ path = "/home/features", name = "See the features" }], secondaryLink = [{ path = "/home/blog", name = "Read the blog" }] } }, { type = "featureRowBlock", alias = "files", values = { heading = "Model content in files", text = { html = "<p>Content types, data types and languages are plain TOML files. They go through review with the rest of your code, and every environment gets the same ones.</p>" }, image = "/drafting-compass.jpg", link = [{ path = "/home/features/content-as-code", name = "How it works" }] } }, { type = "featureRowBlock", alias = "blocks", values = { heading = "Build pages from blocks", text = { html = "<p>Editors arrange heroes, rows, quotes and buttons without a developer. This page is made that way.</p>" }, image = "/letterpress-alphabet.jpg", link = [{ path = "/home/features/blocks", name = "About blocks" }] } }, { type = "featureRowBlock", alias = "library", values = { heading = "Keep shared content in one place", text = { html = "<p>The Library holds what several pages use. Change a person there and the people page and their blog posts change too.</p>" }, image = "/type-case.jpg", link = [{ path = "/home/features/the-library", name = "About the Library" }] } }, { type = "quoteBlock", alias = "quote", values = { quote = "We wanted to see exactly what a release would change before it went live. Now we do.", attribution = "An invented editor, for this demo" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Try it on your own machine", text = "One command builds this site, with its content, so you can change anything.", link = [{ path = "/home/contact", name = "Get in touch" }] } }]
intro = "Crombolo is an Umbraco-inspired content management system that empowers editors and developers."

[values.es-ES]
title = "Crombolo"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "Una visita a Crombolo", heading = "Un CMS que puedes leer, comparar y desplegar", text = "Para editores: un panel completo, con páginas hechas de bloques, borradores, aprobaciones y vistas previas. Para desarrolladores: tipos de contenido en tu repositorio y vistas en TSX, revisados y desplegados como el resto de tu código.", image = "/blueprint-plan.jpg", primaryLink = [{ path = "/home/features", name = "Ver las funciones" }], secondaryLink = [{ path = "/home/blog", name = "Leer el blog" }] } }, { type = "featureRowBlock", alias = "files", values = { heading = "Modela el contenido en archivos", text = { html = "<p>Los tipos de contenido, los tipos de datos y los idiomas son archivos TOML. Se revisan junto con el resto del código y todos los entornos reciben los mismos.</p>" }, image = "/drafting-compass.jpg", link = [{ path = "/home/features/content-as-code", name = "Cómo funciona" }] } }, { type = "featureRowBlock", alias = "blocks", values = { heading = "Crea páginas con bloques", text = { html = "<p>Los editores ordenan portadas, filas, citas y botones sin ayuda de un desarrollador. Esta página está hecha así.</p>" }, image = "/letterpress-alphabet.jpg", link = [{ path = "/home/features/blocks", name = "Sobre los bloques" }] } }, { type = "featureRowBlock", alias = "library", values = { heading = "Guarda el contenido compartido en un solo lugar", text = { html = "<p>La Biblioteca contiene lo que usan varias páginas. Cambia a una persona allí y cambiarán la página del equipo y sus artículos.</p>" }, image = "/type-case.jpg", link = [{ path = "/home/features/the-library", name = "Sobre la Biblioteca" }] } }, { type = "quoteBlock", alias = "quote", values = { quote = "Queríamos ver exactamente qué cambiaría una publicación antes de que saliera. Ahora podemos.", attribution = "Una editora inventada para esta demostración" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Pruébalo en tu ordenador", text = "Un solo comando crea este sitio con su contenido, para que puedas cambiarlo todo.", link = [{ path = "/home/contact", name = "Escríbenos" }] } }]
intro = "Crombolo es un gestor de contenidos inspirado en Umbraco que da más poder a editores y desarrolladores."
