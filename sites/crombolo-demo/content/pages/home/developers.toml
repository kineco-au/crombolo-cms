name = { "en-US" = "For developers", "es-ES" = "Para desarrolladores" }
order = 2

[values.en-US]
title = "For developers"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "For developers", heading = "Everything the back office does, from the command line", text = "The crombolo command reads and changes pages, media, types, users, forms and workspaces, on a site in a folder or one that's hosted. Script it, put it in a pipeline, or hand it to a coding agent.", image = "/typewriter.jpg", primaryLink = [{ path = "/home/features", name = "See the features" }] } }, { type = "featureRowBlock", alias = "profiles", values = { heading = "One command, every site", text = { html = "<p>Name each site once, from your laptop's copy to production, and choose it with <code>--profile</code>. The same commands work on all of them.</p>" }, image = "/compass-map.jpg" } }, { type = "featureRowBlock", alias = "everything", values = { heading = "Everything from the terminal", text = { html = "<p>Pages and the Library, media, page types, languages and the dictionary, forms and workflows, users and members, domains and SEO, webhooks, upgrades and the audit log: each has its own <code>crombolo</code> commands.</p>" }, image = "/type-case.jpg" } }, { type = "featureRowBlock", alias = "agents", values = { heading = "Ready for coding agents", text = { html = "<p>A new site comes with an <code>AGENTS.md</code>: Crombolo's guide for the coding agent working beside you. <code>crombolo agents link</code> adds the guide a hosted site gives, and <code>agents refresh</code> keeps both current.</p>" }, image = "/letterpress-alphabet.jpg" } }, { type = "featureRowBlock", alias = "workspaces", values = { heading = "Workspaces: the next version of the site, alongside the live one", text = { html = "<p>A workspace is a copy of the site for one piece of work, kept apart from what visitors see. It holds the pages, media and translations, the page types and templates, the stylesheets and scripts, and runs its own templates, so a new view can be clicked through at the workspace's own address before it goes live.</p><p>When the work is done it goes live as one change, and it is recorded. Editors open workspaces in the back office, and you can open them from the terminal; they're the same workspaces.</p>" }, image = "/drafting-compass.jpg", link = [{ path = "/home/features/workspaces", name = "About workspaces" }] } }, { type = "featureRowBlock", alias = "webhooks", values = { heading = "Your systems hear about every change", text = { html = "<p>Webhooks tell your other systems when a change is published, or when a workspace is opened, merged or runs into a conflict. <code>crombolo events status</code> shows what's waiting to go out and what failed, and <code>events retry</code> sends it again.</p>" }, image = "/archive-binders.jpg" } }, { type = "featureRowBlock", alias = "check", values = { heading = "See every page a change affects", text = { html = "<p><code>crombolo workspace check</code> renders each page a workspace changed, and a sample for each page type and template it changed (<code>--all</code> for every affected page), then lists any problems it found. It changes nothing.</p>" }, image = "/blueprint-plan.jpg" } }, { type = "featureRowBlock", alias = "deploy", values = { heading = "Deploy in one command", text = { html = "<p><code>crombolo site deploy --profile production</code> builds the site, checks it on the live server, applies it and restarts it, then waits until the new version is healthy. If the check finds a problem, nothing is written. If the restart fails, the site keeps serving the version it had, and you're told the one command that undoes the deploy.</p>" }, image = "/workbench.jpg" } }, { type = "featureRowBlock", alias = "upgrades", values = { heading = "Hassle-free system upgrades", text = { html = "<p><code>crombolo upgrade check</code> says what a new version of Crombolo will need from your data, and changes nothing. <code>upgrade check --fix</code> takes a backup and does the safe part early, while the site stays live. <code>crombolo upgrade</code> then backs up again, finishes the job and switches over, and refuses to start while anything is unresolved. Administrators see the same findings on the Changes dashboard in Settings.</p>" }, image = "/library-shelves.jpg" } }, { type = "quoteBlock", alias = "quote", values = { quote = "Our release is a dozen lines of crombolo commands. Nobody clicks through the back office at midnight any more.", attribution = "An invented developer, for this demo" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Start a site", text = "bunx @crombolo/cli@latest init sets one up, and crombolo --help lists everything else.", link = [{ path = "/home/contact", name = "Get in touch" }] } }]
intro = "Everything the back office does, from a terminal: for scripts, pipelines and coding agents."

[values.es-ES]
title = "Para desarrolladores"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "Para desarrolladores", heading = "Todo lo que hace el panel, desde la línea de comandos", text = "El comando crombolo lee y cambia páginas, medios, tipos, usuarios, formularios y espacios de trabajo, en un sitio en una carpeta o en uno alojado. Úsalo en scripts, en un pipeline o déjaselo a un agente de programación.", image = "/typewriter.jpg", primaryLink = [{ path = "/home/features", name = "Ver las funciones" }] } }, { type = "featureRowBlock", alias = "profiles", values = { heading = "Un comando, todos los sitios", text = { html = "<p>Nombra cada sitio una vez, desde la copia de tu portátil hasta producción, y elígelo con <code>--profile</code>. Los mismos comandos funcionan en todos.</p>" }, image = "/compass-map.jpg" } }, { type = "featureRowBlock", alias = "everything", values = { heading = "Todo desde la terminal", text = { html = "<p>Páginas y la Biblioteca, medios, tipos de página, idiomas y el diccionario, formularios y flujos de trabajo, usuarios y miembros, dominios y SEO, webhooks, actualizaciones y el registro de auditoría: cada uno tiene sus propios comandos <code>crombolo</code>.</p>" }, image = "/type-case.jpg" } }, { type = "featureRowBlock", alias = "agents", values = { heading = "Listo para agentes de programación", text = { html = "<p>Un sitio nuevo trae un <code>AGENTS.md</code>: la guía de Crombolo para el agente que trabaja a tu lado. <code>crombolo agents link</code> añade la guía que da un sitio alojado, y <code>agents refresh</code> mantiene las dos al día.</p>" }, image = "/letterpress-alphabet.jpg" } }, { type = "featureRowBlock", alias = "workspaces", values = { heading = "Espacios de trabajo: la próxima versión del sitio, junto a la publicada", text = { html = "<p>Un espacio de trabajo es una copia del sitio para un trabajo concreto, apartada de lo que ven los visitantes. Contiene las páginas, los medios y las traducciones, los tipos de página y las plantillas, las hojas de estilo y los scripts, y ejecuta sus propias plantillas, de modo que una vista nueva se puede recorrer en la dirección del espacio de trabajo antes de publicarse.</p><p>Cuando el trabajo está terminado se publica como un solo cambio, y queda registrado. Los editores abren espacios de trabajo en el panel y tú puedes abrirlos desde la terminal; son los mismos espacios de trabajo.</p>" }, image = "/drafting-compass.jpg", link = [{ path = "/home/features/workspaces", name = "Sobre los espacios de trabajo" }] } }, { type = "featureRowBlock", alias = "webhooks", values = { heading = "Tus sistemas se enteran de cada cambio", text = { html = "<p>Los webhooks avisan a tus otros sistemas cuando se publica un cambio, o cuando un espacio de trabajo se abre, se fusiona o entra en conflicto. <code>crombolo events status</code> muestra lo que espera para salir y lo que falló, y <code>events retry</code> lo vuelve a enviar.</p>" }, image = "/archive-binders.jpg" } }, { type = "featureRowBlock", alias = "check", values = { heading = "Mira cada página que afecta un cambio", text = { html = "<p><code>crombolo workspace check</code> genera cada página que cambió un espacio de trabajo, y una muestra de cada tipo de página y plantilla que cambió (<code>--all</code> para todas las páginas afectadas), y luego enumera los problemas que encontró. No cambia nada.</p>" }, image = "/blueprint-plan.jpg" } }, { type = "featureRowBlock", alias = "deploy", values = { heading = "Despliega con un solo comando", text = { html = "<p><code>crombolo site deploy --profile production</code> construye el sitio, lo comprueba en el servidor publicado, lo aplica y lo reinicia, y espera a que la nueva versión esté en buen estado. Si la comprobación encuentra un problema, no se escribe nada. Si el reinicio falla, el sitio sigue sirviendo la versión que tenía y se te indica el comando que deshace el despliegue.</p>" }, image = "/workbench.jpg" } }, { type = "featureRowBlock", alias = "upgrades", values = { heading = "Actualizaciones del sistema sin complicaciones", text = { html = "<p><code>crombolo upgrade check</code> dice qué necesitará de tus datos una nueva versión de Crombolo, sin cambiar nada. <code>upgrade check --fix</code> hace una copia de seguridad y adelanta la parte segura mientras el sitio sigue publicado. <code>crombolo upgrade</code> vuelve a hacer una copia, termina el trabajo y hace el cambio, y se niega a empezar mientras quede algo por resolver. Los administradores ven lo mismo en el panel de Cambios, en Ajustes.</p>" }, image = "/library-shelves.jpg" } }, { type = "quoteBlock", alias = "quote", values = { quote = "Nuestra publicación son una docena de líneas de comandos crombolo. Ya nadie recorre el panel a medianoche.", attribution = "Un desarrollador inventado para esta demostración" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Crea un sitio", text = "bunx @crombolo/cli@latest init crea uno, y crombolo --help enumera todo lo demás.", link = [{ path = "/home/contact", name = "Escríbenos" }] } }]
intro = "Todo lo que hace el panel, desde una terminal: para scripts, pipelines y agentes de programación."
