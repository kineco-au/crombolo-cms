type = "landingPage"
name = { "en-US" = "For editors", "es-ES" = "Para editores" }
order = 2

[values.en-US]
title = "For editors"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "For editors", heading = "Crombolo: a CMS for editorial teams", text = "Make changes in your own personal space, preview them as visitors will see them, and share them with your colleagues. Publish when you're ready, with configurable sign-off workflows to support your team's content publishing processes.", image = "/crombolo-logo.png", imageAsItIs = true, primaryLink = [{ path = "/home/features", name = "See the features" }] } }, { type = "featureRowBlock", alias = "familiar", values = { heading = "A back office that feels familiar", text = { html = "<p>An Umbraco-inspired back office, so you'll feel at home: the page tree, drafts, previews, image cropping and page history.</p>" }, image = "/page-editor.jpg" } }, { type = "featureRowBlock", alias = "preview", values = { heading = "Edit content and preview your changes", text = { html = "<p>Change a page, then preview it exactly as visitors will see it, before anyone else does.</p>" }, image = "/preview-mode.jpg" } }, { type = "featureRowBlock", alias = "workspace", values = { heading = "Make changes safely in your own personal workspace", text = { html = "<p>A workspace is your own space to safely edit in. Change pages, media and translations, and keep working on them until you're ready to publish.</p>" }, image = "/workspace-editor.jpg", link = [{ path = "/home/features/workspaces", name = "About workspaces" }] } }, { type = "featureRowBlock", alias = "share", values = { heading = "Share your work with your colleagues", text = { html = "<p>Share your workspace with the people who need to see it, and let them click through the site as it will look.</p>" }, image = "/workspace-menu.jpg" } }, { type = "featureRowBlock", alias = "publish", values = { heading = "Publish when you're ready", text = { html = "<p>Pages that need sign-off go for approval, and pages set to go live on a date keep that date. If someone else changed the same page in the meantime, you choose which version of each part to keep.</p>" }, image = "/publish-options.jpg", link = [{ path = "/home/features/publishing-and-approvals", name = "About publishing" }] } }, { type = "featureRowBlock", alias = "blocks", values = { heading = "Build pages without a developer", text = { html = "<p>Arrange banners, text, images, quotes and buttons in whatever order the page needs. This page is made that way.</p>" }, image = "/site-editors.jpg", link = [{ path = "/home/features/blocks", name = "About building pages" }] } }, { type = "quoteBlock", alias = "quote", values = { quote = "We rebuilt the whole pricing section in a workspace over two weeks. The live site never noticed.", attribution = "An invented editor, for this demo" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "See it for yourself", text = "Ask us for a tour of the back office.", link = [{ path = "/home/contact", name = "Get in touch" }] } }]
intro = "Crombolo gives editors a back office that feels familiar, and a space of their own for every piece of work."

[values.es-ES]
title = "Para editores"
blocks = [{ type = "heroBlock", alias = "hero", values = { eyebrow = "Para editores", heading = "Crombolo: un CMS para equipos editoriales", text = "Haz cambios en tu propio espacio personal, revísalos tal como los verán los visitantes y compártelos con tus compañeros. Publica cuando estés listo, con flujos de aprobación configurables que se adaptan a los procesos de publicación de tu equipo.", image = "/crombolo-logo.png", imageAsItIs = true, primaryLink = [{ path = "/home/features", name = "Ver las funciones" }] } }, { type = "featureRowBlock", alias = "familiar", values = { heading = "Un panel que te resultará familiar", text = { html = "<p>Un panel inspirado en Umbraco, así que te sentirás como en casa: el árbol de páginas, los borradores, las vistas previas, el recorte de imágenes y el historial de cada página.</p>" }, image = "/page-editor.jpg" } }, { type = "featureRowBlock", alias = "preview", values = { heading = "Edita el contenido y revisa tus cambios", text = { html = "<p>Cambia una página y mírala exactamente como la verán los visitantes, antes que nadie.</p>" }, image = "/preview-mode.jpg" } }, { type = "featureRowBlock", alias = "workspace", values = { heading = "Haz cambios con seguridad en tu propio espacio de trabajo", text = { html = "<p>Un espacio de trabajo es tu propio lugar para editar con tranquilidad. Cambia páginas, medios y traducciones, y sigue trabajando en ellos hasta que estés listo para publicar.</p>" }, image = "/workspace-editor.jpg", link = [{ path = "/home/features/workspaces", name = "Sobre los espacios de trabajo" }] } }, { type = "featureRowBlock", alias = "share", values = { heading = "Comparte tu trabajo con tus compañeros", text = { html = "<p>Comparte tu espacio de trabajo con quien tenga que verlo y deja que recorra el sitio tal como quedará.</p>" }, image = "/workspace-menu.jpg" } }, { type = "featureRowBlock", alias = "publish", values = { heading = "Publica cuando estés listo", text = { html = "<p>Las páginas que necesitan aprobación se envían para aprobarlas, y las que tienen fecha de publicación la conservan. Si otra persona cambió la misma página mientras tanto, eliges qué versión de cada parte quieres conservar.</p>" }, image = "/publish-options.jpg", link = [{ path = "/home/features/publishing-and-approvals", name = "Sobre la publicación" }] } }, { type = "featureRowBlock", alias = "blocks", values = { heading = "Crea páginas sin un desarrollador", text = { html = "<p>Ordena portadas, textos, imágenes, citas y botones como necesite la página. Esta página está hecha así.</p>" }, image = "/site-editors.jpg", link = [{ path = "/home/features/blocks", name = "Sobre cómo crear páginas" }] } }, { type = "quoteBlock", alias = "quote", values = { quote = "Rehicimos toda la sección de precios en un espacio de trabajo durante dos semanas. El sitio publicado ni se enteró.", attribution = "Una editora inventada para esta demostración" } }, { type = "callToActionBlock", alias = "call-to-action", values = { heading = "Compruébalo tú mismo", text = "Pídenos una visita guiada por el panel.", link = [{ path = "/home/contact", name = "Escríbenos" }] } }]
intro = "Crombolo da a los editores un panel que les resultará familiar y un espacio propio para cada trabajo."
