[values]
umbracoUrlName = "operations"

[values.en-US]
title = "Operations"
intro = "Caches, the search index, background jobs, maintenance pauses, outgoing changes, upgrades and restarts."
body = { html = "<h2 id=\"cache-rebuild\"><code>crombolo cache rebuild</code></h2>\n<p>Rebuild the published cache on every node of the site. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo cache rebuild [--wait &lt;wait&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--wait</code></td><td>Seconds to wait for every node to rebuild; 0 does not wait. Default <code>30</code>.</td></tr></tbody></table>\n<h2 id=\"index-list\"><code>crombolo index list</code></h2>\n<p>The search indexes: what each holds, and what is waiting to be indexed. Changes nothing.</p>\n<pre><code>crombolo index list</code></pre>\n<h2 id=\"index-rebuild\"><code>crombolo index rebuild</code></h2>\n<p>Index every item again, for every node: the index is in the database. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo index rebuild [&lt;index&gt;] [--queue-only]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>index</code></td><td>One index; both when not given. One of <code>InternalIndex</code>, <code>MembersIndex</code>.</td></tr><tr><td><code>--queue-only</code></td><td>Queue everything, and let the site index it.</td></tr></tbody></table>\n<h2 id=\"jobs-list\"><code>crombolo jobs list</code></h2>\n<p>The site's and its bundles' background jobs, newest first: what each is, its state and how far it got. Changes nothing.</p>\n<pre><code>crombolo jobs list [--state &lt;state&gt;] [--owner &lt;owner&gt;] [--limit &lt;limit&gt;] [--offset &lt;offset&gt;] [--fields &lt;fields&gt;] [--profile &lt;profile&gt;] [--env &lt;env&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--state</code></td><td>Only the jobs in this state. One of <code>waiting</code>, <code>running</code>, <code>failed</code>, <code>done</code>.</td></tr><tr><td><code>--owner</code></td><td>Only one bundle's jobs, or site for the site's own.</td></tr><tr><td><code>--limit</code></td><td>How many to list. Default <code>50</code>.</td></tr><tr><td><code>--offset</code></td><td>How many to skip first. Default <code>0</code>.</td></tr><tr><td><code>--fields</code></td><td>Only these fields of each item, comma-separated.</td></tr><tr><td><code>--profile</code></td><td>Act on the site this profile names, rather than this one.</td></tr><tr><td><code>--env</code></td><td>A hosted site's environment.</td></tr></tbody></table>\n<h2 id=\"jobs-retry\"><code>crombolo jobs retry</code></h2>\n<p>Run a failed background job again, from its first attempt. Each run acts again.</p>\n<pre><code>crombolo jobs retry &lt;id&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>id</code></td><td>Its id, or at least the first 8 characters of it. Required.</td></tr><tr><td><code>--profile</code></td><td>Act on the site this profile names, rather than this one.</td></tr><tr><td><code>--env</code></td><td>A hosted site's environment.</td></tr></tbody></table>\n<h2 id=\"jobs-show\"><code>crombolo jobs show</code></h2>\n<p>One background job: what it is, how far it got, and why it failed. Changes nothing.</p>\n<pre><code>crombolo jobs show &lt;id&gt; [--profile &lt;profile&gt;] [--env &lt;env&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>id</code></td><td>Its id, or at least the first 8 characters of it. Required.</td></tr><tr><td><code>--profile</code></td><td>Act on the site this profile names, rather than this one.</td></tr><tr><td><code>--env</code></td><td>A hosted site's environment.</td></tr></tbody></table>\n<h2 id=\"maintenance-pause\"><code>crombolo maintenance pause</code></h2>\n<p>Refuse every editor's save, on every node, for a while or until resumed. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo maintenance pause [--reason &lt;reason&gt;] [--for &lt;for&gt;] [--until &lt;until&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--reason</code></td><td>What editors are told.</td></tr><tr><td><code>--for</code></td><td>How long, as 90s, 10m, 1h or 1h30m.</td></tr><tr><td><code>--until</code></td><td>When it ends, as a time (ISO 8601).</td></tr></tbody></table>\n<h2 id=\"maintenance-resume\"><code>crombolo maintenance resume</code></h2>\n<p>Let editors save again. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo maintenance resume</code></pre>\n<h2 id=\"maintenance-status\"><code>crombolo maintenance status</code></h2>\n<p>Whether editing is paused, by whom and why. Changes nothing.</p>\n<pre><code>crombolo maintenance status</code></pre>\n<h2 id=\"events-failed\"><code>crombolo events failed</code></h2>\n<p>What gave up going out, and why. Changes nothing.</p>\n<pre><code>crombolo events failed [--limit &lt;limit&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--limit</code></td><td>How many of each to list. Default <code>50</code>.</td></tr></tbody></table>\n<h2 id=\"events-retry\"><code>crombolo events retry</code></h2>\n<p>Send failed changes, webhooks or e-mails again. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo events retry [&lt;id&gt;] [--all]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>id</code></td><td>The failed item to send again.</td></tr><tr><td><code>--all</code></td><td>Every failed item.</td></tr></tbody></table>\n<h2 id=\"events-status\"><code>crombolo events status</code></h2>\n<p>What is waiting to go out to webhooks and e-mail, and what failed. Changes nothing.</p>\n<pre><code>crombolo events status</code></pre>\n<h2 id=\"upgrade\"><code>crombolo upgrade</code></h2>\n<p>Back up, apply pending framework migrations, cut over, and record them. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo upgrade [--plan] [--force &lt;force&gt;] [--set &lt;set&gt;] [--backup-taken]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--plan</code></td><td>Print the DDL pending framework migrations would run, and stop.</td></tr><tr><td><code>--force</code></td><td>Go on over outstanding findings, saying why.</td></tr><tr><td><code>--set</code></td><td>A value for a new mandatory property: &lt;type&gt;.&lt;property&gt;=&lt;value&gt;.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr></tbody></table>\n<h2 id=\"upgrade-check\"><code>crombolo upgrade check</code></h2>\n<p>What the deployed definitions would do to this database's data. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo upgrade check [--fix] [--set &lt;set&gt;] [--backup-taken]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--fix</code></td><td>Back up, then apply the additive part and every conversion early.</td></tr><tr><td><code>--set</code></td><td>A value for a new mandatory property: &lt;type&gt;.&lt;property&gt;=&lt;value&gt;.</td></tr><tr><td><code>--backup-taken</code></td><td>A backup was taken another way: Postgres needs this, or CROMBOLO_PG_DUMP.</td></tr></tbody></table>\n<h2 id=\"upgrade-ledger\"><code>crombolo upgrade ledger</code></h2>\n<p>Print migration_history: every migration, sync and import applied here. Changes nothing.</p>\n<pre><code>crombolo upgrade ledger [--limit &lt;limit&gt;] [--offset &lt;offset&gt;] [--fields &lt;fields&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--limit</code></td><td>How many to list. Default <code>1000</code>.</td></tr><tr><td><code>--offset</code></td><td>How many to skip first. Default <code>0</code>.</td></tr><tr><td><code>--fields</code></td><td>Only these fields of each item, comma-separated.</td></tr></tbody></table>\n<h2 id=\"upgrade-schema\"><code>crombolo upgrade schema</code></h2>\n<p>Rewrite every schema/ file canonically. Safe to run again: a second run changes nothing more.</p>\n<pre><code>crombolo upgrade schema</code></pre>\n<h2 id=\"restart\"><code>crombolo restart</code></h2>\n<p>Restart the site, so code installed since it started runs. Each run acts again.</p>\n<pre><code>crombolo restart [--profile &lt;profile&gt;] [--env &lt;env&gt;]</code></pre>\n<table><thead><tr><th>Argument</th><th>What it is</th></tr></thead><tbody><tr><td><code>--profile</code></td><td>Act on the site this profile names, rather than this one.</td></tr><tr><td><code>--env</code></td><td>A hosted site's environment.</td></tr></tbody></table>" }

