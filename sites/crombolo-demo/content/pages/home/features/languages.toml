[values.en-US]
title = "Languages"
summary = "Translate a page, a property or a single word."
body = { html = "<p>Each property says whether it varies by language. This site is in English and Spanish, and the switch in the header moves you between the two versions of a page.</p><p>Words printed by the views come from the dictionary, and addresses can follow a hostname or a path such as /es.</p>" }

[values.es-ES]
title = "Idiomas"
summary = "Traduce una página, una propiedad o una sola palabra."
body = { html = "<p>Cada propiedad indica si varía según el idioma. Este sitio está en inglés y en español, y el selector de la cabecera te lleva de una versión de la página a la otra.</p><p>Las palabras que muestran las vistas vienen del diccionario, y las direcciones pueden seguir un nombre de host o una ruta como /es.</p>" }
