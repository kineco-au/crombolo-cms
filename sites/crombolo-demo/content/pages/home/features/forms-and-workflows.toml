[values.en-US]
title = "Forms and workflows"
summary = "Collect answers, and decide who signs off a page."
body = { html = "<p>Forms are defined in files and rendered by the site, with validation on the server and entries kept in the back office.</p><p>A workflow names the stages a page passes through before it is published, and who decides at each one.</p>" }

[values.es-ES]
title = "Formularios y flujos de trabajo"
summary = "Recoge respuestas y decide quién aprueba una página."
body = { html = "<p>Los formularios se definen en archivos y los muestra el sitio, con validación en el servidor y las entradas guardadas en el panel.</p><p>Un flujo de trabajo indica las etapas que recorre una página antes de publicarse y quién decide en cada una.</p>" }
