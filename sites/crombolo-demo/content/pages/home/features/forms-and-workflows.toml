[values.en-US]
title = "Forms and workflows"
summary = "Collect answers, and decide who signs off a page."
body = { html = "<p>Forms are built in the back office and drawn by the site, with answers checked as they arrive and kept under Forms.</p><p>A workflow names the stages a page passes through before it is published, and who decides at each one.</p>" }

[values.es-ES]
title = "Formularios y flujos de trabajo"
summary = "Recoge respuestas y decide quién aprueba una página."
body = { html = "<p>Los formularios se crean en el panel y los muestra el sitio; las respuestas se comprueban al llegar y se guardan en Formularios.</p><p>Un flujo de trabajo indica las etapas que recorre una página antes de publicarse y quién decide en cada una.</p>" }
