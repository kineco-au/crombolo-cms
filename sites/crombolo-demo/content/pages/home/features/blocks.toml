[values.en-US]
title = "Blocks"
summary = "Build pages from parts, in whatever order the page needs."
body = { html = "<p>Banners, text, images, quotes and buttons are blocks a developer has set up once. Editors add them, reorder them and fill them in, without asking for a new template.</p><p>The home page of this site is nothing but blocks.</p>" }

[values.es-ES]
title = "Bloques"
summary = "Crea páginas con piezas, en el orden que necesite cada página."
body = { html = "<p>Portadas, textos, imágenes, citas y botones son bloques que un desarrollador prepara una vez. Los editores los añaden, los reordenan y los rellenan sin pedir una plantilla nueva.</p><p>La página de inicio de este sitio solo tiene bloques.</p>" }
