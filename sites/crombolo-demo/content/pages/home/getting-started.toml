[values.en-US]
title = "Getting Started"
intro = "Getting started with Crombolo in 5 minutes"
sections = [
  { type = "textBlock", alias = "start", values = { body = { html = "<p>Crombolo's API is built on <a href=\"https://bun.sh\">Bun</a>, its templates are server-rendered tsx components, and runs on Postgres or SQLite. We recommend Postgres for production sites.</p><h2>What you need</h2><p>Bun 1.3 or later.</p><pre><code>curl -fsSL https://bun.sh/install | bash</code></pre>" } } },
  { type = "expandableBlock", alias = "postgres", values = { title = "Optional: configure Postgres connection", body = { html = "<p>A new site uses SQLite unless you choose Postgres. <a href=\"https://www.postgresql.org/download/\">Install Postgres</a> and create an empty database:</p><pre><code>createdb my-site</code></pre><p>Add <code>--postgres</code> when you make the site:</p><pre><code>bunx @crombolo/cli@latest init --name \"My site\" --empty --postgres</code></pre><p>Then set its address in the site's <code>.env</code> file, with your own user and password:</p><pre><code>CROMBOLO_POSTGRES_URL=postgres://&lt;user&gt;:&lt;password&gt;@localhost:5432/my-site</code></pre><p>The first start creates everything in it.</p>" } } },
  { type = "textBlock", alias = "ways", values = { body = { html = "<h2>Developer system support</h2><ul><li>Mac</li><li>Linux</li><li>Windows on WSL</li></ul><h2>Choose a way in</h2><ul><li><strong><a href=\"/getting-started/a-fresh-site\">A Fresh Site</a>:</strong> an empty site you add your own types and pages to. Start here to learn how a site is put together.</li><li><strong><a href=\"/getting-started/use-a-template\">Use A Template</a>:</strong> types, views, styles and starting content, so there is something on the page at once.</li><li><strong><a href=\"/getting-started/start-from-source\">Start From Source</a>:</strong> run Crombolo itself from its source code, to change it or try what isn't released yet.</li></ul>" } } },
  { type = "expandableBlock", alias = "folder", values = { title = "What's in a site", body = { html = "<p>Every new site has these folders. Crombolo looks for them by name.</p><pre><code>my-site/\n├── components/         views, in any folders you like\n│   └── blocks/         one view for each type of block, by its name\n├── content/            content kept as files, if you want any\n│   ├── pages/          pages, in folders as the site's tree is\n│   ├── library/        shared content\n│   └── media/          pictures and other files\n├── schema/             what the site can hold\n│   ├── content-types/  types of page, block and Library item\n│   ├── data-types/     the editors fields use\n│   ├── forms/          forms and their fields\n│   ├── media-types/    types of media\n│   ├── member-types/   types of member\n│   ├── workflows/      approvals\n│   └── schema.toml     the version of these definitions\n├── css/                stylesheets\n├── scripts/            scripts for the browser\n├── public/             files served as they are\n├── actions/            code your pages call on the server\n├── crombolo.config.ts  the site's settings\n├── package.json        packages and scripts\n├── server.ts           starts the site for development\n├── tsconfig.json       TypeScript settings\n├── AGENTS.md           a guide for coding agents\n├── .env                secrets and local settings: never commit it\n└── .gitignore          what git leaves out</code></pre><p>Optional, when you need them: <code>schema/languages.toml</code>, <code>domains.toml</code>, <code>content/dictionary.toml</code>. A site with a front end of its own in <code>web/</code> has no <code>actions/</code>.</p><p>The first start adds the database, <code>media/</code>, <code>logs/</code> and <code>.crombolo/</code>.</p>" } } },
]
body = { html = "" }

[values.es-ES]
title = "Primeros pasos"
intro = "Empieza con Crombolo en 5 minutos"
sections = [
  { type = "textBlock", alias = "start", values = { body = { html = "<p>La API de Crombolo está construida sobre <a href=\"https://bun.sh\">Bun</a>, sus plantillas son componentes tsx renderizados en el servidor y funciona con Postgres o SQLite. Recomendamos Postgres para los sitios en producción.</p><h2>Lo que necesitas</h2><p>Bun 1.3 o posterior.</p><pre><code>curl -fsSL https://bun.sh/install | bash</code></pre>" } } },
  { type = "expandableBlock", alias = "postgres", values = { title = "Opcional: configura la conexión con Postgres", body = { html = "<p>Un sitio nuevo usa SQLite salvo que elijas Postgres. <a href=\"https://www.postgresql.org/download/\">Instala Postgres</a> y crea una base de datos vacía:</p><pre><code>createdb my-site</code></pre><p>Añade <code>--postgres</code> al crear el sitio:</p><pre><code>bunx @crombolo/cli@latest init --name \"My site\" --empty --postgres</code></pre><p>Después define su dirección en el archivo <code>.env</code> del sitio, con tu usuario y contraseña:</p><pre><code>CROMBOLO_POSTGRES_URL=postgres://&lt;user&gt;:&lt;password&gt;@localhost:5432/my-site</code></pre><p>El primer arranque crea todo lo necesario en ella.</p>" } } },
  { type = "textBlock", alias = "ways", values = { body = { html = "<h2>Sistemas compatibles para desarrollar</h2><ul><li>Mac</li><li>Linux</li><li>Windows con WSL</li></ul><h2>Elige un camino</h2><ul><li><strong><a href=\"/es/primeros-pasos/un-sitio-nuevo\">Un sitio nuevo</a>:</strong> un sitio vacío al que añades tus propios tipos y páginas. Empieza aquí para aprender cómo se compone un sitio.</li><li><strong><a href=\"/es/primeros-pasos/usar-una-plantilla\">Usar una plantilla</a>:</strong> tipos, vistas, estilos y contenido inicial, para que haya algo en la página desde el principio.</li><li><strong><a href=\"/es/primeros-pasos/empezar-desde-el-codigo-fuente\">Empezar desde el código fuente</a>:</strong> ejecuta el propio Crombolo desde su código fuente, para cambiarlo o probar lo que aún no se ha publicado.</li></ul>" } } },
  { type = "expandableBlock", alias = "folder", values = { title = "Qué hay en un sitio", body = { html = "<p>Todo sitio nuevo tiene estas carpetas. Crombolo las busca por su nombre.</p><pre><code>my-site/\n├── components/         vistas, en las carpetas que quieras\n│   └── blocks/         una vista por cada tipo de bloque, con su nombre\n├── content/            contenido en archivos, si lo quieres\n│   ├── pages/          páginas, en carpetas como el árbol del sitio\n│   ├── library/        contenido compartido\n│   └── media/          imágenes y otros archivos\n├── schema/             lo que el sitio puede contener\n│   ├── content-types/  tipos de página, bloque y elemento de la Biblioteca\n│   ├── data-types/     los editores que usan los campos\n│   ├── forms/          formularios y sus campos\n│   ├── media-types/    tipos de medios\n│   ├── member-types/   tipos de miembro\n│   ├── workflows/      aprobaciones\n│   └── schema.toml     la versión de estas definiciones\n├── css/                hojas de estilo\n├── scripts/            scripts para el navegador\n├── public/             archivos que se sirven tal cual\n├── actions/            código que tus páginas llaman en el servidor\n├── crombolo.config.ts  los ajustes del sitio\n├── package.json        paquetes y scripts\n├── server.ts           arranca el sitio para desarrollo\n├── tsconfig.json       ajustes de TypeScript\n├── AGENTS.md           una guía para agentes de código\n├── .env                secretos y ajustes locales: no lo confirmes nunca\n└── .gitignore          lo que git deja fuera</code></pre><p>Opcionales, cuando los necesites: <code>schema/languages.toml</code>, <code>domains.toml</code>, <code>content/dictionary.toml</code>. Un sitio con su propio front end en <code>web/</code> no tiene <code>actions/</code>.</p><p>El primer arranque añade la base de datos, <code>media/</code>, <code>logs/</code> y <code>.crombolo/</code>.</p>" } } },
]
body = { html = "" }
