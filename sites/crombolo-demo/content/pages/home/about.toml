[values.en-US]
title = "About this site"
intro = "A complete site, made to be taken apart."
body = { html = "<p>This site shows the everyday features of a CMS working together, with content about Crombolo itself. Sign in, open a workspace and change anything: the live pages stay as they are until you publish.</p><p>Start with a page in the back office, then find the view that draws it in the components folder. Change one, and see the other move.</p><p>The people and the quotes are invented. Every picture is a screenshot of Crombolo itself, and CREDITS.md lists them.</p>" }

[values.es-ES]
title = "Sobre este sitio"
intro = "Un sitio completo, hecho para desmontarlo."
body = { html = "<p>Este sitio muestra las funciones habituales de un CMS trabajando juntas, con contenido sobre el propio Crombolo. Entra, abre un espacio de trabajo y cambia lo que quieras: las páginas publicadas siguen igual hasta que publiques.</p><p>Empieza por una página en el panel y busca después la vista que la dibuja en la carpeta de componentes. Cambia una y verás moverse la otra.</p><p>Las personas y las citas son inventadas. Cada imagen es una captura del propio Crombolo, y CREDITS.md las enumera.</p>" }
