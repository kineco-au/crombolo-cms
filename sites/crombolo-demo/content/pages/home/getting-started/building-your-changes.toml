type = "contentPage"
name = { "en-US" = "Building Your Changes", "es-ES" = "Crear tus cambios" }
order = 3

[values.en-US]
title = "Building Your Changes"
intro = "Set up a new site, or change one that's already there."
body = { html = "<h2>Setting up a new site</h2><p>A new site has nothing live to protect, so work straight in its folder.</p><h3>1. Make it</h3><p>See <a href=\"/getting-started/a-fresh-site\">A Fresh Site</a> or <a href=\"/getting-started/use-a-template\">Use A Template</a>.</p><h3>2. Change it</h3><p>Change its types, views and styles in <code>schema/</code>, <code>components/</code> and <code>css/</code>, and its pages in the back office or in <code>content/</code>.</p><h3>3. Check it</h3><pre><code>bunx crombolo components check       # compile and type-check every view\nbunx crombolo types check --static   # check the definitions without a database\nbunx crombolo site build --check     # check the content files against them\nbunx crombolo status                 # whether this environment is working</code></pre><p>Each exits with a non-zero code when it finds a problem, so they drop straight into CI.</p><h3>4. Commit it</h3><p>Then see <a href=\"/getting-started/deploying-your-changes\">Deploying Your Changes</a>.</p><h2>Changing existing content in a workspace</h2><p>A workspace is your own copy of the site to change. Visitors and other editors see none of it until it's merged.</p><h3>1. Create a workspace</h3><pre><code>bunx crombolo workspace open \"Spring sale\"</code></pre><h3>2. Make your changes</h3><p>Start the site with <code>bun start</code>, sign in, and choose Spring sale at the right of the strip under Content. Change pages, media, types and code there.</p><h3>3. Look at it</h3><pre><code>bunx crombolo workspace diff \"Spring sale\"      # what it changes\nbunx crombolo workspace address \"Spring sale\"   # a link to the site as it would be</code></pre><h3>4. Check it</h3><pre><code>bunx crombolo workspace check \"Spring sale\"\nbunx crombolo workspace merge \"Spring sale\" --dry-run</code></pre><p>The check renders the changed pages. The dry run says what a merge would do, and names any conflict.</p><h3>5. Merge it into Shared</h3><p>Shared is the site everyone works from. Merging brings everything in Spring sale into it, all or nothing:</p><pre><code>bunx crombolo workspace merge \"Spring sale\" --yes</code></pre><p>Pages published in the workspace go live on this site. If someone changed the same thing in Shared, the merge stops and <code>bunx crombolo workspace conflicts \"Spring sale\"</code> says what. A change that deletes or loses something must be accepted by name with <code>--accept-lossy</code>.</p>" }

[values.es-ES]
title = "Crear tus cambios"
intro = "Configura un sitio nuevo o cambia uno que ya existe."
body = { html = "<h2>Configurar un sitio nuevo</h2><p>Un sitio nuevo no tiene nada publicado que proteger, así que trabaja directamente en su carpeta.</p><h3>1. Créalo</h3><p>Consulta <a href=\"/es/primeros-pasos/un-sitio-nuevo\">Un sitio nuevo</a> o <a href=\"/es/primeros-pasos/usar-una-plantilla\">Usar una plantilla</a>.</p><h3>2. Cámbialo</h3><p>Cambia sus tipos, vistas y estilos en <code>schema/</code>, <code>components/</code> y <code>css/</code>, y sus páginas en el panel o en <code>content/</code>.</p><h3>3. Compruébalo</h3><pre><code>bunx crombolo components check       # compila y comprueba los tipos de cada vista\nbunx crombolo types check --static   # comprueba las definiciones sin base de datos\nbunx crombolo site build --check     # comprueba los archivos de contenido con ellas\nbunx crombolo status                 # si este entorno funciona</code></pre><p>Cada uno termina con un código distinto de cero cuando encuentra un problema, así que encajan directamente en CI.</p><h3>4. Confírmalo</h3><p>Después consulta <a href=\"/es/primeros-pasos/desplegar-tus-cambios\">Desplegar tus cambios</a>.</p><h2>Cambiar contenido existente en un espacio de trabajo</h2><p>Un espacio de trabajo es tu propia copia del sitio para hacer cambios. Los visitantes y los demás editores no ven nada hasta que se fusiona.</p><h3>1. Crea un espacio de trabajo</h3><pre><code>bunx crombolo workspace open \"Spring sale\"</code></pre><h3>2. Haz tus cambios</h3><p>Arranca el sitio con <code>bun start</code>, entra y elige Spring sale a la derecha de la barra bajo Contenido. Cambia ahí páginas, medios, tipos y código.</p><h3>3. Míralo</h3><pre><code>bunx crombolo workspace diff \"Spring sale\"      # lo que cambia\nbunx crombolo workspace address \"Spring sale\"   # un enlace al sitio como quedaría</code></pre><h3>4. Compruébalo</h3><pre><code>bunx crombolo workspace check \"Spring sale\"\nbunx crombolo workspace merge \"Spring sale\" --dry-run</code></pre><p>La comprobación genera las páginas cambiadas. El simulacro dice lo que haría una fusión y nombra los conflictos.</p><h3>5. Fusiónalo en Compartido</h3><p>Compartido es el sitio desde el que trabajan todos. Al fusionar, todo lo que hay en Spring sale pasa a él, todo o nada:</p><pre><code>bunx crombolo workspace merge \"Spring sale\" --yes</code></pre><p>Las páginas publicadas en el espacio de trabajo se publican en este sitio. Si alguien cambió lo mismo en Compartido, la fusión se detiene y <code>bunx crombolo workspace conflicts \"Spring sale\"</code> dice qué. Un cambio que borra o pierde algo debe aceptarse por su nombre con <code>--accept-lossy</code>.</p>" }
