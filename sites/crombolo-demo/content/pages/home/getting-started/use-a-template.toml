type = "contentPage"
name = { "en-US" = "Use A Template", "es-ES" = "Usar una plantilla" }
order = 1

[values.en-US]
title = "Use A Template"
intro = "Start from a complete site and change it."
sections = [
  { type = "expandableBlock", alias = "templates", values = { title = "Available templates", body = { html = "<ul><li><strong>Basic</strong> (<code>basic</code>): a Content Page type with a title, an image and a description, its template, and a published welcome page; what a plain init gives you.</li><li><strong>Next.js</strong> (<code>next</code>): an empty site with a Next.js front end in web/, wired for preview, revalidation and member sign-in.</li><li><strong>Crombolo</strong> (<code>demo/crombolo</code>): a full site about Crombolo, in English and Spanish: a home page for editors and a page for developers built from blocks, features filtered by category, people from the Library, a blog with tags and paging, search, and a contact form.</li><li><strong>Harbourstone Distillery</strong> (<code>demo/harbourstone</code>): a coastal distillery: a range with tasting-note elements, reusable highlights, a contact form, photographs and a stylesheet.</li><li><strong>Harbourstone Distillery (Next.js)</strong> (<code>demo/harbourstone-next</code>): the Harbourstone distillery with a Next.js front end in web/: the same content, drafts in Draft Mode, a cache cleared by webhook, and a comparison of the bottlings chosen in the browser.</li><li><strong>Harbourstone Distillery (single-page app)</strong> (<code>demo/harbourstone-spa</code>): the Harbourstone distillery as a single-page app in web/, built with Next.js and run in the browser: the same content read from the APIs, members signing in from the app, drafts shown by the Preview button, and a static build to host anywhere.</li><li><strong>Plain Signal</strong> (<code>demo/plain-signal</code>): an AI magazine for everyone: sections, articles with photographs and their credits, a sub-editor and editor approval workflow, and a contact form drawn by an island.</li><li><strong>Starter</strong> (<code>starter</code>): a header, a footer and a two-column page layout with placeholder text, ready to restyle.</li></ul>" } } },
]
body = { html = "<h2>Choose one</h2><pre><code>bunx @crombolo/cli@latest init --template list</code></pre><h2>Make the site</h2><p>This example is the site you're reading.</p><pre><code>mkdir my-site &amp;&amp; cd my-site\nbunx @crombolo/cli@latest init --template demo/crombolo\nbun install</code></pre><h2>Start it</h2><p>The first start applies the template's content and publishes it.</p><pre><code>bun start</code></pre><h2>Sign in</h2><p>The site is at <a href=\"http://localhost:8080/\">http://localhost:8080/</a> and the back office at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>. The start prints a username and password. The password is new on every start; set <code>CROMBOLO_ADMIN_PASSWORD</code> to keep one. If port 8080 is taken, run <code>PORT=3000 bun start</code>.</p><h2>Change it</h2><p>The starting content is files in <code>content/</code>. Edit them, and the next start applies the change. <code>bunx crombolo site build --check</code> checks them first.</p>" }

[values.es-ES]
title = "Usar una plantilla"
intro = "Empieza con un sitio completo y cámbialo."
sections = [
  { type = "expandableBlock", alias = "templates", values = { title = "Plantillas disponibles", body = { html = "<ul><li><strong>Basic</strong> (<code>basic</code>): a Content Page type with a title, an image and a description, its template, and a published welcome page; what a plain init gives you.</li><li><strong>Next.js</strong> (<code>next</code>): an empty site with a Next.js front end in web/, wired for preview, revalidation and member sign-in.</li><li><strong>Crombolo</strong> (<code>demo/crombolo</code>): a full site about Crombolo, in English and Spanish: a home page for editors and a page for developers built from blocks, features filtered by category, people from the Library, a blog with tags and paging, search, and a contact form.</li><li><strong>Harbourstone Distillery</strong> (<code>demo/harbourstone</code>): a coastal distillery: a range with tasting-note elements, reusable highlights, a contact form, photographs and a stylesheet.</li><li><strong>Harbourstone Distillery (Next.js)</strong> (<code>demo/harbourstone-next</code>): the Harbourstone distillery with a Next.js front end in web/: the same content, drafts in Draft Mode, a cache cleared by webhook, and a comparison of the bottlings chosen in the browser.</li><li><strong>Harbourstone Distillery (single-page app)</strong> (<code>demo/harbourstone-spa</code>): the Harbourstone distillery as a single-page app in web/, built with Next.js and run in the browser: the same content read from the APIs, members signing in from the app, drafts shown by the Preview button, and a static build to host anywhere.</li><li><strong>Plain Signal</strong> (<code>demo/plain-signal</code>): an AI magazine for everyone: sections, articles with photographs and their credits, a sub-editor and editor approval workflow, and a contact form drawn by an island.</li><li><strong>Starter</strong> (<code>starter</code>): a header, a footer and a two-column page layout with placeholder text, ready to restyle.</li></ul>" } } },
]
body = { html = "<h2>Elige una</h2><pre><code>bunx @crombolo/cli@latest init --template list</code></pre><h2>Crea el sitio</h2><p>Este ejemplo es el sitio que estás leyendo.</p><pre><code>mkdir my-site &amp;&amp; cd my-site\nbunx @crombolo/cli@latest init --template demo/crombolo\nbun install</code></pre><h2>Arráncalo</h2><p>El primer arranque aplica el contenido de la plantilla y lo publica.</p><pre><code>bun start</code></pre><h2>Entra</h2><p>El sitio está en <a href=\"http://localhost:8080/\">http://localhost:8080/</a> y el panel en <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>. Al arrancar se muestran un usuario y una contraseña. La contraseña es nueva en cada arranque; define <code>CROMBOLO_ADMIN_PASSWORD</code> para conservar una. Si el puerto 8080 está ocupado, ejecuta <code>PORT=3000 bun start</code>.</p><h2>Cámbialo</h2><p>El contenido inicial son archivos en <code>content/</code>. Edítalos y el siguiente arranque aplicará el cambio. <code>bunx crombolo site build --check</code> los comprueba antes.</p>" }
