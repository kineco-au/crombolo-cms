type = "contentPage"
name = { "en-US" = "Start From Source", "es-ES" = "Empezar desde el código fuente" }
order = 2

[values.en-US]
title = "Start From Source"
intro = "Build and run Crombolo from its source code."
body = { html = "<p>Follow this guide to build Crombolo from source.</p><p><a href=\"https://github.com/kineco-au/crombolo-cms\">https://github.com/kineco-au/crombolo-cms</a></p><h2>What you need</h2><p>Docker with Compose v2. Everything else runs inside it.</p><p>On Windows, work inside WSL 2, with the code in its own file system.</p><h2>Build it</h2><p>From the root of your copy of the code, build the back office, then make the API's types:</p><pre><code>docker compose run --rm --no-deps cms-test-browser bun run vendor:backoffice\ndocker compose run --rm --no-deps -w /app cms bun run generate:types</code></pre><h2>Run it</h2><pre><code>docker compose up -d --wait cms</code></pre><p>The site is at <a href=\"http://localhost:8080/\">http://localhost:8080/</a> and the back office at <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>. Sign in with <code>admin@crombolo.local</code> and the password <code>crombolo-dev-password</code>. It restarts itself when the code changes. Set <code>CROMBOLO_PORT</code> to use another port, and <code>CROMBOLO_ADMIN_PASSWORD</code> another password.</p><h2>Connect to Postgres</h2><h3>Get up and running with an open source production-ready database</h3><p><code>docker compose up</code> starts <a href=\"https://www.postgresql.org/download/\">Postgres</a> and connects to it, so there is nothing to set. From your own machine it is on port 5433:</p><pre><code>postgres://crombolo:crombolo@localhost:5433/crombolo</code></pre><h3>Your own</h3><p>Create an empty database, then start Crombolo with its address. The first start creates everything in it:</p><pre><code>docker compose stop cms\ndocker compose run --rm --no-deps --service-ports \\\n  -e CROMBOLO_POSTGRES_URL=postgres://&lt;user&gt;:&lt;password&gt;@&lt;host&gt;:&lt;port&gt;/&lt;database&gt; \\\n  cms</code></pre><p>For a database on your own machine, the host is <code>host.docker.internal</code> with Docker Desktop. With Docker on Linux, use the machine's own address.</p><h2>Other commands</h2><h3>Running</h3><ul><li><code>docker compose logs -f cms</code>: follow the logs</li><li><code>docker compose run --rm --no-deps -w /app cms bun run site</code>: list the sites and templates</li><li><code>docker compose run --rm --no-deps --service-ports -w /app cms bun run site demo/crombolo</code>: run a copy of one, with <code>docker compose stop cms</code> first; <code>--fresh</code> starts the copy again</li></ul><h3>Checking</h3><ul><li><code>docker compose run --rm --no-deps -w /app cms bun run check</code>: formatting, lint and types</li><li><code>docker compose run --rm --no-deps -w /app cms bun run fix</code>: fix formatting and lint</li><li><code>docker compose run --rm cms-test-sqlite</code>, <code>docker compose run --rm cms-test</code>: the tests on SQLite, and on Postgres</li><li><code>docker compose run --rm cms-test-browser</code>: the browser tests</li></ul><h3>Stopping</h3><ul><li><code>docker compose --profile test down --remove-orphans</code>: stop everything</li><li><code>docker compose --profile test down -v --remove-orphans</code>: stop everything and <strong>delete the database and uploads</strong></li></ul>" }

[values.es-ES]
title = "Empezar desde el código fuente"
intro = "Compila y ejecuta Crombolo desde su código fuente."
body = { html = "<p>Sigue esta guía para compilar Crombolo desde el código fuente.</p><p><a href=\"https://github.com/kineco-au/crombolo-cms\">https://github.com/kineco-au/crombolo-cms</a></p><h2>Lo que necesitas</h2><p>Docker con Compose v2. Todo lo demás se ejecuta dentro.</p><p>En Windows, trabaja dentro de WSL 2, con el código en su propio sistema de archivos.</p><h2>Compílalo</h2><p>Desde la raíz de tu copia del código, compila el panel y genera los tipos de la API:</p><pre><code>docker compose run --rm --no-deps cms-test-browser bun run vendor:backoffice\ndocker compose run --rm --no-deps -w /app cms bun run generate:types</code></pre><h2>Arráncalo</h2><pre><code>docker compose up -d --wait cms</code></pre><p>El sitio está en <a href=\"http://localhost:8080/\">http://localhost:8080/</a> y el panel en <a href=\"http://localhost:8080/crombolo\">http://localhost:8080/crombolo</a>. Entra con <code>admin@crombolo.local</code> y la contraseña <code>crombolo-dev-password</code>. Se reinicia solo cuando cambia el código. Define <code>CROMBOLO_PORT</code> para usar otro puerto y <code>CROMBOLO_ADMIN_PASSWORD</code> para otra contraseña.</p><h2>Conectar con Postgres</h2><h3>Empieza con una base de datos de código abierto lista para producción</h3><p><code>docker compose up</code> arranca <a href=\"https://www.postgresql.org/download/\">Postgres</a> y se conecta, así que no hay nada que definir. Desde tu equipo está en el puerto 5433:</p><pre><code>postgres://crombolo:crombolo@localhost:5433/crombolo</code></pre><h3>La tuya</h3><p>Crea una base de datos vacía y arranca Crombolo con su dirección. El primer arranque crea todo lo necesario en ella:</p><pre><code>docker compose stop cms\ndocker compose run --rm --no-deps --service-ports \\\n  -e CROMBOLO_POSTGRES_URL=postgres://&lt;user&gt;:&lt;password&gt;@&lt;host&gt;:&lt;port&gt;/&lt;database&gt; \\\n  cms</code></pre><p>Para una base de datos en tu equipo, el host es <code>host.docker.internal</code> con Docker Desktop. Con Docker en Linux, usa la dirección del equipo.</p><h2>Otros comandos</h2><h3>Ejecutar</h3><ul><li><code>docker compose logs -f cms</code>: sigue los registros</li><li><code>docker compose run --rm --no-deps -w /app cms bun run site</code>: lista los sitios y las plantillas</li><li><code>docker compose run --rm --no-deps --service-ports -w /app cms bun run site demo/crombolo</code>: ejecuta una copia de uno, con <code>docker compose stop cms</code> antes; <code>--fresh</code> empieza la copia de nuevo</li></ul><h3>Comprobar</h3><ul><li><code>docker compose run --rm --no-deps -w /app cms bun run check</code>: formato, lint y tipos</li><li><code>docker compose run --rm --no-deps -w /app cms bun run fix</code>: corrige el formato y el lint</li><li><code>docker compose run --rm cms-test-sqlite</code>, <code>docker compose run --rm cms-test</code>: las pruebas en SQLite y en Postgres</li><li><code>docker compose run --rm cms-test-browser</code>: las pruebas de navegador</li></ul><h3>Detener</h3><ul><li><code>docker compose --profile test down --remove-orphans</code>: lo detiene todo</li><li><code>docker compose --profile test down -v --remove-orphans</code>: lo detiene todo y <strong>borra la base de datos y los archivos subidos</strong></li></ul>" }
