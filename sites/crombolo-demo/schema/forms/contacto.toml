# The Spanish version of contact.toml.
[form]
key = "9c4e1d72-6a2f-4b83-8e05-2d1f7c9b3e64"
alias = "contacto"
name = "Contacto (Español)"
store-entries = true
requires-approval = false
submit-label = "Enviar mensaje"
message-on-submit = "Gracias. Tu mensaje está en el panel, en Formularios."
honeypot = true
minimum-submit-seconds = 3

[[page]]

  [[page.group]]
  columns = 1

    [[page.group.field]]
    alias = "visitorName"
    type = "shortAnswer"
    caption = "Nombre"
    mandatory = true
    mandatory-message = "Necesitamos un nombre para responder"
    autocomplete = "name"

    [[page.group.field]]
    alias = "visitorEmail"
    type = "email"
    caption = "Correo electrónico"
    mandatory = true
    mandatory-message = "Necesitamos un correo para responder"
    autocomplete = "email"

    [[page.group.field]]
    alias = "message"
    type = "longAnswer"
    caption = "Mensaje"
    mandatory = true
    mandatory-message = "Cuéntanos qué te gustaría saber"
    rows = 5
