[content-type]
alias = "featureList"
name = "Feature List"
description = "Lists the features below it, filtered by category"
icon = "icon-thumbnail-list"
allow-children = ["feature"]
varies-by-culture = true
compositions = ["seoFields"]
components = ["pages/featureList"]
default-component = "pages/featureList"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true
varies-by-culture = true
site-search = "high"

[[tab.property]]
alias = "intro"
name = "Introduction"
description = "A sentence or two under the heading"
type = "textarea"
varies-by-culture = true
