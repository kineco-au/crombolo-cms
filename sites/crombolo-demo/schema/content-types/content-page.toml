[content-type]
alias = "contentPage"
name = "Content Page"
description = "A page of text with an image"
icon = "icon-document"
allow-children = ["contentPage"]
varies-by-culture = true
compositions = ["seoFields"]
components = ["pages/contentPage"]
default-component = "pages/contentPage"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true
varies-by-culture = true
site-search = "high"

[[tab.property]]
alias = "intro"
name = "Introduction"
description = "A sentence or two under the heading"
type = "textarea"
varies-by-culture = true

[[tab.property]]
alias = "image"
name = "Image"
type = "imageMediaPicker"

[[tab.property]]
alias = "body"
name = "Body"
type = "richtext"
varies-by-culture = true

[[tab.property]]
alias = "umbracoUrlName"
name = "Address"
description = "The last part of the page's address; taken from its name when empty"
type = "textstring"

[[tab.property]]
alias = "sections"
name = "Sections"
description = "Text and expandable sections above the body, in the order they should appear"
type = "pageSections"
varies-by-culture = true

[[tab.property]]
alias = "steps"
name = "Steps"
description = "Take readers through the pages below this one with previous and next buttons"
type = "trueFalse"
