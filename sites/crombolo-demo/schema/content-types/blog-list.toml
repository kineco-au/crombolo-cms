[content-type]
alias = "blogList"
name = "Blog"
description = "Lists the posts below it, newest first, a page at a time"
icon = "icon-newspaper"
allow-children = ["blogPost"]
varies-by-culture = true
compositions = ["seoFields"]
components = ["pages/blogList"]
default-component = "pages/blogList"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true
varies-by-culture = true
site-search = "high"

[[tab.property]]
alias = "intro"
name = "Introduction"
description = "A sentence or two under the heading"
type = "textarea"
varies-by-culture = true

[[tab.property]]
alias = "postsPerPage"
name = "Posts per page"
type = "numeric"
