[media-type]
alias = "umbracoMediaArticle"
name = "Article"
icon = "icon-article"
allow-at-root = true

[[group]]
name = "Article"
alias = "article"

[[group.property]]
alias = "umbracoFile"
name = "Article"
type = "uploadArticle"
mandatory = true

[[group.property]]
alias = "umbracoExtension"
name = "File extension"
type = "label"

[[group.property]]
alias = "umbracoBytes"
name = "File size"
type = "labelBytes"
