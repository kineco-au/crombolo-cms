# A tag push runs the whole CI build, then publishes the workspace to npm as one
# fixed-version set. Versions the registry already holds are skipped, so a tag
# that only moves some packages is safe to push.
#
# Needs an NPM_TOKEN secret with publish rights to the @crombolo scope.
name: Release

# What the Actions list shows for the run. Without this, a push event is titled
# with the tagged commit's message — so a release reads as whatever the last commit
# happened to say, and two releases are told apart only by date. The tag is the one
# thing a release is actually about, so it goes in the title.
run-name: release ${{ github.ref_name }}

on:
    push:
        tags: ["v*"]

concurrency:
    group: release-${{ github.ref }}

env:
    BUN_VERSION: "1.4.2"

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        # A release always runs the browser suite and both database dialects,
        # whatever the tagged commit says: main runs SQLite alone to stay fast.
        with:
            browser_tests: true
            postgres_tests: true

    # Story 081's load test: concurrent edits on overlapping branches, then an
    # invariant pass, on both dialects, two nodes sharing the database on
    # Postgres. It runs here rather than in CI: it is minutes of hammering that
    # guards what a release ships, not what every push to main changes. Locally:
    # `bun run docker:test:load`. The seed is printed, so a failure replays with
    # CROMBOLO_LOAD_SEED. Postgres splits the load test and the two benchmarks
    # across three independent runners; their full-sized fixtures stay intact.
    load:
        name: load (${{ matrix.dialect }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { dialect: sqlite, shard: 1, shards: 1 }
                    - { dialect: postgres, shard: 1, shards: 3 }
                    - { dialect: postgres, shard: 2, shards: 3 }
                    - { dialect: postgres, shard: 3, shards: 3 }
        services:
            db:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: crombolo
                    POSTGRES_PASSWORD: crombolo
                    POSTGRES_DB: crombolo_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U crombolo -d crombolo_test"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 30
        env:
            CROMBOLO_DB: ${{ matrix.dialect }}
            CROMBOLO_POSTGRES_URL: postgres://crombolo:crombolo@localhost:5432/crombolo_test
            CROMBOLO_LOAD_OPS: "1500"
        steps:
            - uses: actions/checkout@v5
            # Throwaway data: no durability to pay for. All three take a reload, so
            # the service container needs no command line of its own.
            - name: Tune Postgres for tests
              if: matrix.dialect == 'postgres'
              env:
                  PGPASSWORD: crombolo
              run: |
                  # The health check can pass while the image still initialises on
                  # a socket only, so wait for TCP before tuning.
                  for _ in $(seq 1 30); do
                    pg_isready -h localhost -U crombolo -d crombolo_test && break
                    sleep 1
                  done
                  psql -h localhost -U crombolo -d crombolo_test -v ON_ERROR_STOP=1 \
                    -c "ALTER SYSTEM SET fsync = off" \
                    -c "ALTER SYSTEM SET synchronous_commit = off" \
                    -c "ALTER SYSTEM SET full_page_writes = off" \
                    -c "SELECT pg_reload_conf()"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run generate:types
            - name: Run load and benchmark shard ${{ matrix.shard }} of ${{ matrix.shards }}
              if: matrix.shards > 1
              run: |
                  files=$(bun run scripts/test-shard.ts ${{ matrix.shard }} ${{ matrix.shards }} load)
                  test -n "$files"
                  # Unquoted on purpose: one argument per file, as in the unit shards.
                  bun run test:ci --timeout 600000 $files
            - if: matrix.shards == 1
              run: bun run test:load
            # Stories 086 and 175's benchmark: a generated 25,000-page site, timed
            # against the budgets in docs/testing.md, and the Small site beside it.
            # Large runs weekly instead (bench-large.yml).
            - if: matrix.shards == 1
              run: bun run test:bench
            - name: Benchmark the small site
              if: matrix.shard == 1
              env:
                  CROMBOLO_BENCH_SIZE: small
              run: bun run test:ci --timeout 600000 tests/load/large-site.bench.ts

    publish:
        needs: [ci, load]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Signs npm provenance from this workflow's identity.
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            # For the npm CLI, which uploads the tarballs Bun packs, and the .npmrc it
            # authenticates with.
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - run: bun install --frozen-lockfile

            - name: Check the tag matches the package version
              run: |
                  version="$(bun --print 'require("./packages/crombolo/package.json").version')"
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$version" != "$tag" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match @crombolo/crombolo@$version" >&2
                    exit 1
                  fi

            - run: bun run generate:types

            - uses: actions/cache@v6
              id: dist
              with:
                  path: packages/backoffice-dist/dist
                  key: >-
                      backoffice-dist-${{ hashFiles('bun.lock', 'scripts/vendor-backoffice.ts',
                      'packages/backoffice-dist/upstream-static/**') }}
            - if: steps.dist.outputs.cache-hit != 'true'
              run: bun run vendor:backoffice

            - run: bun run release:publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    # Our own product site runs on the platform as an ordinary tenant, so a
    # release republishes its content the way a customer's CI would (`115` in
    # crombolo-enterprise). It publishes to **preview**; production is promoted
    # by hand once somebody has looked at it.
    #
    # Gated on a repository variable rather than on a secret being absent: a
    # rotated or deleted secret is indistinguishable from "not set up yet", and
    # a publish that quietly stops happening is the thing this job exists to
    # prevent. Off, it skips and says so. On, any failure fails the release.
    brochureware:
        needs: publish
        if: vars.BROCHUREWARE_PUBLISH == 'enabled'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile

            - name: Publish the product site to preview
              run: bun run brochureware:publish
              env:
                  CROMBOLO_PLATFORM_URL: ${{ vars.CROMBOLO_PLATFORM_URL }}
                  CROMBOLO_PLATFORM_TOKEN: ${{ secrets.CROMBOLO_PLATFORM_TOKEN }}
                  CROMBOLO_PLATFORM_ORGANISATION: ${{ vars.CROMBOLO_PLATFORM_ORGANISATION }}
                  CROMBOLO_PLATFORM_SITE: ${{ vars.CROMBOLO_PLATFORM_SITE }}
                  CROMBOLO_PLATFORM_ENVIRONMENT: ${{ vars.CROMBOLO_PLATFORM_PREVIEW }}

            - name: Say that production is still waiting
              run: |
                  {
                    echo "### Product site"
                    echo
                    echo "Published to **preview**. Promote it to production once it looks right."
                  } >> "$GITHUB_STEP_SUMMARY"
