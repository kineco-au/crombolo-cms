[content-type]
alias = "homePage"
name = "Home Page"
description = "The site's landing page"
icon = "icon-home"
allow-at-root = true
allow-children = ["homePage"]
compositions = ["seoFields"]
components = ["homePage"]
default-component = "homePage"

[[tab]]
name = "Content"

[[tab.property]]
alias = "title"
name = "Title"
description = "Shown as the page heading"
type = "textstring"
mandatory = true

[[tab.property]]
alias = "bodyText"
name = "Body"
type = "richtext"
